name: Windows CI
on:
  push:
    branches: [windows-support]
  pull_request:
    branches: [windows-support]
jobs:
  build-and-test-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: choco install ninja ccache python llvm

      - name: Add LLVM to PATH
        run: echo "C:\Program Files\LLVM\bin" | Out-File -FilePath $env:GITHUB_PATH -Append

      - name: Install latest CMake
        uses: jwlawson/actions-setup-cmake@v1
        with:
          cmake-version: "3.27.7" # or any version >= 3.21

      - name: Install vcpkg
        run: |
          git clone https://github.com/microsoft/vcpkg.git
          .\vcpkg\bootstrap-vcpkg.bat

      # Install vcpkg dependencies for cpp
      - name: Install vcpkg dependencies for cpp
        run: ..\vcpkg\vcpkg.exe install --triplet x64-windows
        working-directory: cpp

      # Build and test cpp
      - name: Generate CMakePresets.json for DEV build (cpp)
        run: |
          @"
          {
            "version": 3,
            "configurePresets": [
              {
                "name": "DEV",
                "displayName": "Development build with coverage (Clang, vcpkg, Debug)",
                "generator": "Ninja",
                "binaryDir": "build",
                "cacheVariables": {
                  "CMAKE_TOOLCHAIN_FILE": "../vcpkg/scripts/buildsystems/vcpkg.cmake",
                  "VCPKG_TARGET_TRIPLET": "x64-windows",
                  "CMAKE_BUILD_TYPE": "Debug",
                  "CMAKE_C_COMPILER": "clang",
                  "CMAKE_CXX_COMPILER": "clang++",
                  "USE_VCPKG": "1",
                  "FALCON_CORE_DEV": "ON"
                }
              }
            ]
          }
          "@ | Out-File -Encoding utf8 CMakePresets.json
        shell: pwsh
        working-directory: cpp
      - name: List files in cpp/ (detailed)
        run: Get-ChildItem -Force | Format-List
        shell: pwsh
        working-directory: cpp
      - name: Show CMakePresets.json
        run: cat CMakePresets.json
        working-directory: cpp

      - name: Configure CMake for cpp (with coverage)
        run: cmake --preset DEV
        working-directory: cpp

      - name: Build cpp
        run: cmake --build build
        working-directory: cpp

      # TO REMOVE: Debug step to list gtest tests
      - name: Debug - list gtest tests on Windows
        shell: pwsh
        working-directory: cpp
        run: |
          $ErrorActionPreference = "Stop"
          $exe = Get-ChildItem -Path build -Filter "falcon_core_cpp_run_tests*.exe" -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $exe) {
            Write-Error "❌ Could not find test exe."
            exit 1
          }
          Write-Host "Running: $($exe.FullName) --gtest_list_tests"
          & $exe.FullName --gtest_list_tests
          $code = $LASTEXITCODE
          Write-Host "Exit code: $code"
          if ($code -ne 0) {
            Write-Error "❌ gtest_list_tests crashed/failed (exit $code = $(('{0:X}' -f ($code -bor 0))))"
            exit 1
          }

      # - name: Test falcon-core-cpp-dev (with coverage)
      #   shell: pwsh
      #   run: |
      #     $ErrorActionPreference = "Stop"
      #     $buildDir = "build"
      #     $coverageDir = "coverage"
      #     New-Item -ItemType Directory -Force -Path $coverageDir | Out-Null
      #     $env:PATH = "$env:GITHUB_WORKSPACE\cpp\$buildDir;$env:PATH"
      #     $env:LLVM_PROFILE_FILE = "$env:GITHUB_WORKSPACE\cpp\$buildDir\falcon_core_cpp_run_tests.profraw"
      #     .\$buildDir\falcon_core_cpp_run_tests.exe
      #     llvm-profdata merge -sparse $buildDir\falcon_core_cpp_run_tests.profraw -o $buildDir\falcon_core_cpp_run_tests.profdata
      #     llvm-cov report .\$buildDir\falcon_core_cpp_run_tests.exe -instr-profile=$buildDir\falcon_core_cpp_run_tests.profdata | Out-File -Encoding utf8 $coverageDir\falcon-core-cpp.txt
      #   working-directory: cpp

      - name: Test falcon-core-cpp-dev (with coverage)
        shell: pwsh
        working-directory: cpp
        run: |
          $ErrorActionPreference = "Stop"
          $buildDir    = "build"
          $coverageDir = "coverage"
          $minRequired = 85.0   # change this if you want stricter/looser checks

          New-Item -ItemType Directory -Force -Path $coverageDir | Out-Null

          Write-Host "=== Listing contents of '$buildDir' ==="
          Get-ChildItem -Recurse $buildDir

          # Locate the test executable
          $exe = Get-ChildItem -Path $buildDir -Filter "falcon_core_cpp_run_tests*.exe" -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $exe) {
            Write-Error "❌ Could not find 'falcon_core_cpp_run_tests.exe' anywhere under '$buildDir'."
            exit 1
          }
          Write-Host "Found test executable at: $($exe.FullName)"

          # Preferred profile file
          $profRawPreferred = Join-Path $exe.DirectoryName "falcon_core_cpp_run_tests.profraw"
          $profRaw          = $profRawPreferred

          # Tell the runtime where to write
          $env:LLVM_PROFILE_FILE = $profRawPreferred
          Write-Host "LLVM_PROFILE_FILE set to: $env:LLVM_PROFILE_FILE"

          # Run tests
          Write-Host "=== Running tests ==="
          & $exe.FullName
          $testExit = $LASTEXITCODE
          Write-Host "Test exit code: $testExit"
          if ($testExit -ne 0) {
            Write-Error "❌ Test executable exited with non-zero code ($testExit)."
            exit 1
          }

          # Diagnostics: list any *.profraw files
          Write-Host "=== Searching for *.profraw files under '$buildDir' ==="
          $allProfraw = Get-ChildItem -Path $buildDir -Filter "*.profraw" -Recurse -ErrorAction SilentlyContinue
          foreach ($p in $allProfraw) {
            Write-Host "Found profraw candidate: $($p.FullName)  (Size: $($p.Length) bytes)"
          }

          # Prefer the named profile; fall back to any profraw near the exe
          if (-not (Test-Path $profRaw)) {
            Write-Host "No profile at $profRawPreferred, searching for any '*.profraw' near the exe..."
            $candidate = Get-ChildItem -Path $exe.DirectoryName -Filter "*.profraw" -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1
            if ($candidate) {
              Write-Host "Using found profile file: $($candidate.FullName)"
              $profRaw = $candidate.FullName
            } else {
              Write-Error "❌ No .profraw file found after running tests; coverage instrumentation seems broken."
              exit 1
            }
          } else {
            Write-Host "Using preferred profile file: $profRawPreferred"
          }

          $profData   = Join-Path $exe.DirectoryName "falcon_core_cpp_run_tests.profdata"
          $reportFile = Join-Path $coverageDir "falcon-core-cpp.txt"

          Write-Host "=== Merging profile data ==="
          Write-Host "profraw:  $profRaw"
          Write-Host "profdata: $profData"
          llvm-profdata merge -sparse $profRaw -o $profData

          Write-Host "=== Generating coverage report to $reportFile ==="
          llvm-cov report $exe.FullName -instr-profile=$profData |
            Tee-Object -FilePath $reportFile

          # ---- Enforce coverage threshold from TOTAL line ----
          Write-Host "=== Checking coverage thresholds (>= $minRequired%) ==="
          $totalLine = Select-String -Path $reportFile -Pattern '^TOTAL' | Select-Object -First 1
          if (-not $totalLine) {
            Write-Error "❌ TOTAL line not found in coverage report."
            exit 1
          }

          $matches = [regex]::Matches($totalLine.Line, '([0-9]+(?:\.[0-9]+)?)%')
          if ($matches.Count -eq 0) {
            Write-Error "❌ No percentages found in coverage report TOTAL line."
            Write-Host "TOTAL line was: $($totalLine.Line)"
            exit 1
          }

          foreach ($m in $matches) {
            $val = [double]$m.Groups[1].Value
            if ($val -lt $minRequired) {
              Write-Error "❌ Coverage $val% is below required $minRequired% (TOTAL line: $($totalLine.Line))"
              exit 1
            }
          }

          Write-Host "✅ Windows C++ coverage OK; all TOTAL percentages ≥ $minRequired%."




      # Install vcpkg dependencies for c-api
      - name: Install vcpkg dependencies for c-api
        run: ..\vcpkg\vcpkg.exe install --triplet x64-windows
        working-directory: c-api

      # Build and test c-api
      - name: Generate CMakePresets.json for DEV build
        run: |
          @"
          {
            "version": 3,
            "configurePresets": [
              {
                "name": "DEV",
                "displayName": "Development build with coverage (Clang, vcpkg, Debug)",
                "generator": "Ninja",
                "binaryDir": "build",
                "cacheVariables": {
                  "CMAKE_TOOLCHAIN_FILE": "../vcpkg/scripts/buildsystems/vcpkg.cmake",
                  "VCPKG_TARGET_TRIPLET": "x64-windows",
                  "CMAKE_BUILD_TYPE": "Debug",
                  "CMAKE_C_COMPILER": "clang",
                  "CMAKE_CXX_COMPILER": "clang++",
                  "USE_VCPKG": "1",
                  "FALCON_CORE_DEV": "ON",
                  "CORE_ROOT": "../cpp"
                }
              }
            ]
          }
          "@ | Out-File -Encoding utf8 CMakePresets.json
        shell: pwsh
        working-directory: c-api

      - name: Configure CMake for c-api (with coverage)
        run: cmake --preset DEV
        working-directory: c-api

      - name: Build c-api
        run: cmake --build build
        working-directory: c-api

      - name: Test falcon-core-c-api-dev (with coverage)
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $buildDir = "build"
          $coverageDir = "coverage"
          New-Item -ItemType Directory -Force -Path $coverageDir | Out-Null
          $env:PATH = "$env:GITHUB_WORKSPACE\c-api\$buildDir;$env:PATH"
          $env:LLVM_PROFILE_FILE = "$env:GITHUB_WORKSPACE\c-api\$buildDir\falcon_core_c_api_run_tests.profraw"
          .\$buildDir\falcon_core_c_api_run_tests.exe
          llvm-profdata merge -sparse $buildDir\falcon_core_c_api_run_tests.profraw -o $buildDir\falcon_core_c_api_run_tests.profdata
          llvm-cov report .\$buildDir\falcon_core_c_api_run_tests.exe -instr-profile=$buildDir\falcon_core_c_api_run_tests.profdata | Out-File -Encoding utf8 $coverageDir\falcon-core-c-api.txt
        working-directory: c-api

      - name: Upload coverage reports
        uses: actions/upload-artifact@v4
        with:
          name: coverage-reports
          path: |
            cpp/coverage/*
            c-api/coverage/*
                    
      - name: Notify Discord on failure
        if: failure()
        shell: pwsh
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          python - <<'PY'
          import json, os, urllib.request

          url = os.environ["DISCORD_WEBHOOK_URL"]
          run_url = f"{os.environ['GITHUB_SERVER_URL']}/{os.environ['GITHUB_REPOSITORY']}/actions/runs/{os.environ['GITHUB_RUN_ID']}"

          payload = {
              "content": (
                  "❌ **Workflow failed**\n"
                  f"Repo: **{os.environ['GITHUB_REPOSITORY']}**\n"
                  f"Workflow: **{os.environ['GITHUB_WORKFLOW']}**\n"
                  f"Job: **{os.environ['GITHUB_JOB']}**\n"
                  f"Branch: **{os.environ.get('GITHUB_REF_NAME','')}**\n"
                  f"Commit: `{os.environ['GITHUB_SHA']}`\n"
                  f"Run: {run_url}"
              )
          }

          req = urllib.request.Request(
              url,
              data=json.dumps(payload).encode("utf-8"),
              headers={"Content-Type": "application/json"},
              method="POST",
          )
          urllib.request.urlopen(req).read()
          PY

      - name: Setup tmate (failure-only old build session)
        if: ${{ failure() }}
        uses: mxschmitt/action-tmate@v3
        timeout-minutes: 45
        with:
          limit-access-to-actor: true

      - name: Upload crash dumps
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: crash-dumps
          path: D:\a\falcon-core\falcon-core\cpp\build\dumps\*