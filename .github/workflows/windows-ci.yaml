name: Native Windows Build and Test

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  build-and-test-windows:
    name: Build and Test on Windows (clang + Ninja)
    runs-on: windows-latest

    # vcpkg binary caching
    env:
      VCPKG_BINARY_SOURCES: "clear;files,${{ github.workspace }}/.vcpkg/bincache,readwrite"
      VCPKG_DOWNLOADS: "${{ github.workspace }}/.vcpkg/downloads"
      # CRITICAL: Use x64-win-llvm triplet for Clang compatibility
      VCPKG_DEFAULT_TRIPLET: x64-win-llvm
      VCPKG_OVERLAY_TRIPLETS: ${{ github.workspace }}/vcpkg-triplets

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          ref: dev

      # NEW STEP: Clone Neumann-A vcpkg triplets repository
      - name: Clone Neumann-A vcpkg triplets
        shell: pwsh
        run: |
          Write-Host "=== Cloning custom vcpkg triplets repository ==="

          # Clone the entire repository to get all dependencies
          git clone --depth 1 https://github.com/Neumann-A/my-vcpkg-triplets.git vcpkg-triplets-repo

          # Move the triplets to our overlay directory
          New-Item -ItemType Directory -Force -Path vcpkg-triplets | Out-Null

          # Copy all triplet files (we only need x64-win-llvm but copy all for dependencies)
          Copy-Item -Path vcpkg-triplets-repo/* -Destination vcpkg-triplets/ -Recurse -Force

          # Verify the triplet and its dependencies exist
          Write-Host "`n=== Verifying triplet files ==="
          $requiredFiles = @(
            "vcpkg-triplets/x64-win-llvm.cmake",
            "vcpkg-triplets/x64-win-llvm/x64-win-llvm.toolchain.cmake",
            "vcpkg-triplets/x64-win-llvm/extra_setup.cmake",
            "vcpkg-triplets/x64-win-llvm/port_specialization.cmake"
          )

          $allFilesExist = $true
          foreach ($file in $requiredFiles) {
            if (Test-Path $file) {
              Write-Host "✓ Found: $file"
            } else {
              Write-Error "✗ Missing: $file"
              $allFilesExist = $false
            }
          }

          if (-not $allFilesExist) {
            Write-Error "Required triplet files are missing!"
            exit 1
          }

          # Show the main triplet file contents
          Write-Host "`n=== x64-win-llvm.cmake Contents (first 30 lines) ==="
          Get-Content vcpkg-triplets/x64-win-llvm.cmake | Select-Object -First 30

          # Cleanup the cloned repo (we've copied what we need)
          Remove-Item -Path vcpkg-triplets-repo -Recurse -Force

          Write-Host "`n✓ Custom triplets installed successfully"

      - name: Attempt to restore vcpkg binary cache
        uses: actions/cache@v4
        with:
          path: |
            .vcpkg/bincache
            .vcpkg/downloads
          key: vcpkg-${{ runner.os }}-llvm-${{ hashFiles('cpp/vcpkg.json', 'vcpkg-lock.json', '**/vcpkg-configuration.json') }}
          restore-keys: |
            vcpkg-${{ runner.os }}-llvm-
            vcpkg-${{ runner.os }}-

      - name: Setup vcpkg
        uses: lukka/run-vcpkg@v11
        with:
          vcpkgGitCommitId: "73af4de996897cb45dcf5034d16a551a3cf476f7"

      # Ensure we have LLVM/Clang
      - name: Install LLVM/Clang via Chocolatey
        shell: pwsh
        run: |
          Write-Host "=== Installing LLVM/Clang ==="
          choco install llvm -y

          # Refresh environment
          $env:Path = [System.Environment]::GetEnvironmentVariable("Path","Machine") + ";" + [System.Environment]::GetEnvironmentVariable("Path","User")

          Write-Host "✓ LLVM/Clang installed"

      # Install Ninja
      - name: Install Ninja
        shell: pwsh
        run: |
          Write-Host "=== Installing Ninja ==="
          choco install ninja -y
          Write-Host "✓ Ninja installed"

      - name: Verify Toolchain
        shell: pwsh
        run: |
          Write-Host "=== Toolchain Verification ==="

          # Refresh PATH
          $env:Path = [System.Environment]::GetEnvironmentVariable("Path","Machine") + ";" + [System.Environment]::GetEnvironmentVariable("Path","User")

          Write-Host "`nClang version:"
          clang --version

          Write-Host "`nClang++ version:"
          clang++ --version

          Write-Host "`nNinja version:"
          ninja --version

          Write-Host "`nLinker (lld-link):"
          if (Get-Command lld-link -ErrorAction SilentlyContinue) {
            lld-link --version
          } else {
            Write-Warning "lld-link not found in PATH"
          }

          Write-Host "`nVCPKG Configuration:"
          Write-Host "  VCPKG_DEFAULT_TRIPLET = $env:VCPKG_DEFAULT_TRIPLET"
          Write-Host "  VCPKG_OVERLAY_TRIPLETS = $env:VCPKG_OVERLAY_TRIPLETS"

          Write-Host "`nTriplet overlay directory contents:"
          Get-ChildItem -Path "$env:VCPKG_OVERLAY_TRIPLETS" -Recurse | Select-Object FullName

      - name: Configure CMake with Ninja + Clang + Custom Triplet
        working-directory: cpp
        shell: pwsh
        run: |
          $env:Path = [System.Environment]::GetEnvironmentVariable("Path","Machine") + ";" + [System.Environment]::GetEnvironmentVariable("Path","User")

          Write-Host "=== CMake Configuration ==="
          cmake -B build `
            -S . `
            -G "Ninja" `
            -DCMAKE_C_COMPILER=clang `
            -DCMAKE_CXX_COMPILER=clang++ `
            -DCMAKE_TOOLCHAIN_FILE="${env:VCPKG_ROOT}/scripts/buildsystems/vcpkg.cmake" `
            -DVCPKG_MANIFEST_DIR="${env:GITHUB_WORKSPACE}/cpp" `
            -DVCPKG_INSTALLED_DIR="${env:GITHUB_WORKSPACE}/cpp/build/vcpkg_installed" `
            -DVCPKG_TARGET_TRIPLET=x64-win-llvm `
            -DVCPKG_HOST_TRIPLET=x64-win-llvm `
            -DVCPKG_OVERLAY_TRIPLETS="${env:GITHUB_WORKSPACE}/vcpkg-triplets" `
            -DCMAKE_BUILD_TYPE=Release `
            -DFALCON_CORE_DEV=ON `
            -DUSE_VCPKG=ON

          if ($LASTEXITCODE -ne 0) {
            Write-Error "CMake configuration failed!"
            exit $LASTEXITCODE
          }

          Write-Host "✓ CMake configuration successful"

      - name: Save vcpkg binary cache (early)
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            .vcpkg/bincache
            .vcpkg/downloads
          key: vcpkg-${{ runner.os }}-llvm-${{ hashFiles('cpp/vcpkg.json', 'vcpkg-lock.json', '**/vcpkg-configuration.json') }}-${{ github.run_id }}

      - name: Build falcon-core-cpp
        working-directory: cpp
        shell: pwsh
        run: |
          Write-Host "=== Building with Ninja ==="
          ninja -C build -v

          if ($LASTEXITCODE -ne 0) {
            Write-Error "Build failed!"
            exit $LASTEXITCODE
          }

          Write-Host "✓ Build successful"

      - name: List build outputs
        working-directory: cpp
        shell: pwsh
        run: |
          Write-Host "=== Build Directory Structure ==="
          Get-ChildItem -Path "build" -Recurse -Include *.exe,*.dll | ForEach-Object {
            $size = "{0:N2}" -f ($_.Length / 1MB)
            Write-Host "$($_.FullName) - $size MB"
          }

      - name: Run CPP tests
        working-directory: cpp
        shell: pwsh
        run: |
          Write-Host "=== Test Execution Setup ==="

          # Determine vcpkg bin path (x64-win-llvm or x64-windows)
          $vcpkgBinPaths = @(
            "build/vcpkg_installed/x64-win-llvm/bin",
            "build/vcpkg_installed/x64-win-llvm/debug/bin",
            "build/vcpkg_installed/x64-windows/bin"
          )

          $vcpkgBin = $null
          foreach ($path in $vcpkgBinPaths) {
            if (Test-Path $path) {
              $vcpkgBin = (Resolve-Path $path).Path
              Write-Host "Found vcpkg bin: $vcpkgBin"
              break
            }
          }

          if (-not $vcpkgBin) {
            Write-Error "Could not find vcpkg bin directory!"
            Write-Host "Searched paths:"
            $vcpkgBinPaths | ForEach-Object { Write-Host "  - $_" }
            exit 1
          }

          $buildDir = (Resolve-Path "build").Path

          Write-Host "`nEnvironment:"
          Write-Host "  VcpkgBin: $vcpkgBin"
          Write-Host "  BuildDir: $buildDir"

          # Add DLL directories to PATH
          $env:PATH = "$vcpkgBin;$buildDir;$env:PATH"

          # Verify DLL locations
          Write-Host "`n=== DLL Verification ==="
          $dlls = @("zlib1.dll", "hdf5.dll", "yaml-cpp.dll", "falcon_core_cpp.dll")
          foreach ($dll in $dlls) {
            Write-Host "`nLooking for $dll:"
            $found = where.exe $dll 2>&1 | Select-Object -First 1
            if ($found) {
              Write-Host "  ✓ $found"
            } else {
              Write-Warning "  ✗ Not found in PATH"
            }
          }

          # Find test executable
          $testExe = Get-ChildItem -Path "build" -Filter "falcon_core_cpp_run_tests.exe" -Recurse | Select-Object -First 1

          if (-not $testExe) {
            Write-Error "Test executable not found!"
            Write-Host "Build directory contents:"
            Get-ChildItem -Path "build" -Recurse -Include *.exe | Select-Object FullName
            exit 1
          }

          Write-Host "`n=== Running Tests ==="
          Write-Host "Test executable: $($testExe.FullName)"

          # Run tests
          & $testExe.FullName --gtest_color=yes --gtest_output=xml:test-results.xml
          $exitCode = $LASTEXITCODE

          Write-Host "`nTest exit code: $exitCode"

          # Decode exit codes
          if ($exitCode -eq -1073741515 -or $exitCode -eq 3221225781) {
            Write-Error "DLL NOT FOUND ERROR (0xC0000135)"
            Write-Host "Missing DLL dependencies. Checked locations:"
            Write-Host "  - $vcpkgBin"
            Write-Host "  - $buildDir"
            exit 1
          } elseif ($exitCode -eq -1073741819 -or $exitCode -eq 3221225477) {
            Write-Error "ACCESS VIOLATION ERROR (0xC0000005)"
            Write-Host "Memory access violation. Possible causes:"
            Write-Host "  - NULL pointer dereference"
            Write-Host "  - ABI mismatch (check triplet is x64-win-llvm)"
            Write-Host "  - Stack corruption"
            exit 1
          } elseif ($exitCode -eq -1073741571 -or $exitCode -eq 3221225725) {
            Write-Error "STACK OVERFLOW ERROR (0xC00000FD)"
            exit 1
          }

          if ($exitCode -ne 0) {
            Write-Error "Tests failed with exit code: $exitCode"
            exit $exitCode
          }

          Write-Host "`n✓ All tests passed successfully"

      # Error handling and diagnostics
      - name: Run tests with detailed diagnostics (on failure)
        if: failure()
        working-directory: cpp
        shell: pwsh
        run: |
          Write-Host "=== Diagnostic Information ==="

          $testExe = Get-ChildItem -Path "build" -Filter "falcon_core_cpp_run_tests.exe" -Recurse | Select-Object -First 1

          if ($testExe) {
            Write-Host "`nTest executable: $($testExe.FullName)"
            
            # Check if we have dumpbin (from MSVC build tools)
            if (Get-Command "dumpbin.exe" -ErrorAction SilentlyContinue) {
              Write-Host "`n=== DLL Dependencies (dumpbin) ==="
              dumpbin.exe /DEPENDENTS $testExe.FullName
            }
            
            # List all DLLs in vcpkg bin
            Write-Host "`n=== Available vcpkg DLLs ==="
            Get-ChildItem -Path "build/vcpkg_installed" -Recurse -Filter *.dll | Select-Object FullName
            
            # Try to list tests without running them
            Write-Host "`n=== Test List (if executable loads) ==="
            $vcpkgBin = Get-ChildItem -Path "build/vcpkg_installed" -Recurse -Directory -Filter "bin" | Select-Object -First 1
            if ($vcpkgBin) {
              $env:PATH = "$($vcpkgBin.FullName);$(Resolve-Path 'build');$env:PATH"
            }
            
            & $testExe.FullName --gtest_list_tests 2>&1 | Tee-Object -Variable output
          }

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-test-results
          path: cpp/test-results.xml
          if-no-files-found: ignore

      - name: Upload build logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: windows-build-logs
          path: |
            cpp/build/**/*.log
            cpp/build/CMakeFiles/*.log
          if-no-files-found: ignore

      - name: Upload triplet files (for debugging)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: vcpkg-triplet-files
          path: vcpkg-triplets/**
          if-no-files-found: ignore

      - name: Setup tmate session for debugging (on failure)
        if: failure() && github.event_name == 'workflow_dispatch'
        uses: mxschmitt/action-tmate@v3
        timeout-minutes: 60
        with:
          limit-access-to-actor: true
