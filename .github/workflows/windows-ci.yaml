name: Native Windows Build and Test

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  build-and-test-windows:
    name: Build and Test on Windows (clang-cl + Ninja)
    runs-on: windows-latest

    # vcpkg binary caching
    env:
      VCPKG_BINARY_SOURCES: "clear;files,${{ github.workspace }}/.vcpkg/bincache,readwrite"
      VCPKG_DOWNLOADS: "${{ github.workspace }}/.vcpkg/downloads"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          ref: dev

      - name: Attempt to restore vcpkg binary cache
        uses: actions/cache@v4
        with:
          path: |
            .vcpkg/bincache
            .vcpkg/downloads
          key: vcpkg-${{ runner.os }}-clang-cl-${{ hashFiles('cpp/vcpkg.json', 'vcpkg-lock.json', '**/vcpkg-configuration.json') }}
          restore-keys: |
            vcpkg-${{ runner.os }}-clang-cl-
            vcpkg-${{ runner.os }}-

      - name: Setup vcpkg
        uses: lukka/run-vcpkg@v11
        with:
          vcpkgGitCommitId: "73af4de996897cb45dcf5034d16a551a3cf476f7"

      # Ensure we have LLVM/Clang
      - name: Install LLVM/Clang via Chocolatey
        shell: pwsh
        run: |
          Write-Host "=== Installing LLVM/Clang ==="
          choco install llvm -y

          # Refresh environment
          $env:Path = [System.Environment]::GetEnvironmentVariable("Path","Machine") + ";" + [System.Environment]::GetEnvironmentVariable("Path","User")

          Write-Host "✓ LLVM/Clang installed"

      # Install Ninja
      - name: Install Ninja
        shell: pwsh
        run: |
          Write-Host "=== Installing Ninja ==="
          choco install ninja -y
          Write-Host "✓ Ninja installed"

      - name: Verify Toolchain
        shell: pwsh
        run: |
          Write-Host "=== Toolchain Verification ==="

          # Refresh PATH
          $env:Path = [System.Environment]::GetEnvironmentVariable("Path","Machine") + ";" + [System.Environment]::GetEnvironmentVariable("Path","User")

          Write-Host "`nClang-cl version:"
          clang-cl --version

          Write-Host "`nNinja version:"
          ninja --version

          Write-Host "`nVCPKG Root:"
          Write-Host "  VCPKG_ROOT = $env:VCPKG_ROOT"

      - name: Clean and Configure CMake with Ninja + clang-cl
        working-directory: cpp
        shell: pwsh
        run: |
          $env:Path = [System.Environment]::GetEnvironmentVariable("Path","Machine") + ";" + [System.Environment]::GetEnvironmentVariable("Path","User")

          Write-Host "=== Cleaning build directory ==="
          if (Test-Path build) {
            Remove-Item -Recurse -Force build
            Write-Host "✓ Build directory cleaned"
          }

          Write-Host "`n=== CMake Configuration ==="
          cmake -B build `
            -S . `
            -G "Ninja" `
            -DCMAKE_C_COMPILER=clang-cl `
            -DCMAKE_CXX_COMPILER=clang-cl `
            -DCMAKE_TOOLCHAIN_FILE="${env:VCPKG_ROOT}/scripts/buildsystems/vcpkg.cmake" `
            -DVCPKG_MANIFEST_DIR="${env:GITHUB_WORKSPACE}/cpp" `
            -DVCPKG_INSTALLED_DIR="${env:GITHUB_WORKSPACE}/cpp/build/vcpkg_installed" `
            -DCMAKE_BUILD_TYPE=Release `
            -DFALCON_CORE_DEV=ON `
            -DUSE_VCPKG=ON

          if ($LASTEXITCODE -ne 0) {
            Write-Error "CMake configuration failed!"
            exit $LASTEXITCODE
          }

          Write-Host "✓ CMake configuration successful"

      - name: Save vcpkg binary cache (early)
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            .vcpkg/bincache
            .vcpkg/downloads
          key: vcpkg-${{ runner.os }}-clang-cl-${{ hashFiles('cpp/vcpkg.json', 'vcpkg-lock.json', '**/vcpkg-configuration.json') }}-${{ github.run_id }}

      - name: Build falcon-core-cpp
        working-directory: cpp
        shell: pwsh
        run: |
          Write-Host "=== Building with Ninja ==="
          ninja -C build -v

          if ($LASTEXITCODE -ne 0) {
            Write-Error "Build failed!"
            exit $LASTEXITCODE
          }

          Write-Host "✓ Build successful"

      - name: List build outputs
        working-directory: cpp
        shell: pwsh
        run: |
          Write-Host "=== Build Directory Structure ==="
          Get-ChildItem -Path "build" -Recurse -Include *.exe,*.dll | ForEach-Object {
            $size = "{0:N2}" -f ($_.Length / 1MB)
            Write-Host "$($_.FullName) - $size MB"
          }

      - name: Run CPP tests
        working-directory: cpp
        shell: pwsh
        run: |
          Write-Host "=== Test Execution Setup ==="

          # Determine vcpkg bin path
          $vcpkgBinPaths = @(
            "build/vcpkg_installed/x64-windows/bin",
            "build/vcpkg_installed/x64-windows/debug/bin"
          )

          $vcpkgBin = $null
          foreach ($path in $vcpkgBinPaths) {
            if (Test-Path $path) {
              $vcpkgBin = (Resolve-Path $path).Path
              Write-Host "Found vcpkg bin: $vcpkgBin"
              break
            }
          }

          if (-not $vcpkgBin) {
            Write-Error "Could not find vcpkg bin directory!"
            Write-Host "Searched paths:"
            $vcpkgBinPaths | ForEach-Object { Write-Host "  - $_" }
            exit 1
          }

          $buildDir = (Resolve-Path "build").Path

          Write-Host "`nEnvironment:"
          Write-Host "  VcpkgBin: $vcpkgBin"
          Write-Host "  BuildDir: $buildDir"

          # Add DLL directories to PATH
          $env:PATH = "$vcpkgBin;$buildDir;$env:PATH"

          # Verify DLL locations
          Write-Host "`n=== DLL Verification ==="
          $dlls = @("zlib1.dll", "hdf5.dll", "yaml-cpp.dll", "falcon_core_cpp.dll")
          foreach ($dll in $dlls) {
            Write-Host "`nLooking for $dll:"
            $found = Get-ChildItem -Path $vcpkgBin,$buildDir -Filter $dll -ErrorAction SilentlyContinue | Select-Object -First 1
            if ($found) {
              Write-Host "  ✓ $($found.FullName)"
            } else {
              Write-Warning "  ✗ Not found"
            }
          }

          # Find test executable
          $testExe = Get-ChildItem -Path "build" -Filter "falcon_core_cpp_run_tests.exe" -Recurse | Select-Object -First 1

          if (-not $testExe) {
            Write-Error "Test executable not found!"
            Write-Host "Build directory contents:"
            Get-ChildItem -Path "build" -Recurse -Include *.exe | Select-Object FullName
            exit 1
          }

          Write-Host "`n=== Running Tests ==="
          Write-Host "Test executable: $($testExe.FullName)"
          Write-Host "Running from directory: $(Get-Location)"

          # Run tests (matching your exact command: ./build/falcon_core_cpp_run_tests.exe)
          & ".\$($testExe.FullName.Replace("$PWD\", ''))" --gtest_color=yes --gtest_output=xml:test-results.xml
          $exitCode = $LASTEXITCODE

          Write-Host "`nTest exit code: $exitCode"

          # Decode exit codes
          if ($exitCode -eq -1073741515 -or $exitCode -eq 3221225781) {
            Write-Error "DLL NOT FOUND ERROR (0xC0000135)"
            Write-Host "Missing DLL dependencies. Checked locations:"
            Write-Host "  - $vcpkgBin"
            Write-Host "  - $buildDir"
            exit 1
          } elseif ($exitCode -eq -1073741819 -or $exitCode -eq 3221225477) {
            Write-Error "ACCESS VIOLATION ERROR (0xC0000005)"
            Write-Host "Memory access violation. Possible causes:"
            Write-Host "  - NULL pointer dereference"
            Write-Host "  - ABI mismatch"
            Write-Host "  - Stack corruption"
            exit 1
          } elseif ($exitCode -eq -1073741571 -or $exitCode -eq 3221225725) {
            Write-Error "STACK OVERFLOW ERROR (0xC00000FD)"
            exit 1
          }

          if ($exitCode -ne 0) {
            Write-Error "Tests failed with exit code: $exitCode"
            exit $exitCode
          }

          Write-Host "`n✓ All tests passed successfully"

      # Error handling and diagnostics
      - name: Run tests with detailed diagnostics (on failure)
        if: failure()
        working-directory: cpp
        shell: pwsh
        run: |
          Write-Host "=== Diagnostic Information ==="

          $testExe = Get-ChildItem -Path "build" -Filter "falcon_core_cpp_run_tests.exe" -Recurse | Select-Object -First 1

          if ($testExe) {
            Write-Host "`nTest executable: $($testExe.FullName)"
            
            # Use Dependencies.exe (better than dumpbin) or fallback to dumpbin
            Write-Host "`n=== Checking for dependency analysis tools ==="
            
            # Try to find Visual Studio's dumpbin
            $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
            if (Test-Path $vswhere) {
              $vsPath = & $vswhere -latest -property installationPath
              $dumpbin = "$vsPath\VC\Tools\MSVC\*\bin\Hostx64\x64\dumpbin.exe"
              $dumpbinPath = Get-Item $dumpbin -ErrorAction SilentlyContinue | Select-Object -First 1
              
              if ($dumpbinPath) {
                Write-Host "`n=== DLL Dependencies (dumpbin) ==="
                & $dumpbinPath.FullName /DEPENDENTS $testExe.FullName
              }
            }
            
            # List all DLLs in vcpkg bin
            Write-Host "`n=== Available vcpkg DLLs ==="
            Get-ChildItem -Path "build/vcpkg_installed" -Recurse -Filter *.dll | Select-Object FullName
            
            # Try to list tests without running them
            Write-Host "`n=== Test List (if executable loads) ==="
            $vcpkgBin = Get-ChildItem -Path "build/vcpkg_installed/x64-windows/bin" -ErrorAction SilentlyContinue
            if ($vcpkgBin) {
              $env:PATH = "$($vcpkgBin.FullName);$(Resolve-Path 'build');$env:PATH"
            }
            
            & $testExe.FullName --gtest_list_tests 2>&1 | Tee-Object -Variable output
          }

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-test-results
          path: cpp/test-results.xml
          if-no-files-found: ignore

      - name: Upload build logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: windows-build-logs
          path: |
            cpp/build/**/*.log
            cpp/build/CMakeFiles/*.log
          if-no-files-found: ignore

      - name: Setup tmate session for debugging (on failure)
        if: failure() && github.event_name == 'workflow_dispatch'
        uses: mxschmitt/action-tmate@v3
        timeout-minutes: 60
        with:
          limit-access-to-actor: true
