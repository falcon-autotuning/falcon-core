name: C-API Linux CI

on:
  workflow_call:
  workflow_dispatch:

jobs:
  build-and-test:
    name: Build and Test C-API (Linux)
    runs-on: ubuntu-latest

    env:
      VCPKG_BINARY_SOURCES: "clear;files,${{ github.workspace }}/.vcpkg/bincache,readwrite"
      VCPKG_DOWNLOADS: "${{ github.workspace }}/.vcpkg/downloads"

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Attempt to restore vcpkg binary cache
        uses: actions/cache@v4
        with:
          path: |
            .vcpkg/bincache
            .vcpkg/downloads
          key: vcpkg-${{ runner.os }}-linux-capi-${{ hashFiles('c-api/vcpkg.json', 'cpp/vcpkg.json', 'vcpkg-lock.json', '**/vcpkg-configuration.json') }}
          restore-keys: |
            vcpkg-${{ runner.os }}-linux-capi-
            vcpkg-${{ runner.os }}-linux-

      - name: Setup vcpkg
        uses: lukka/run-vcpkg@v11
        with:
          vcpkgGitCommitId: "73af4de996897cb45dcf5034d16a551a3cf476f7"

      - name: Install build dependencies for Makefile
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            make \
            ninja-build \
            clang \
            llvm \
            lld \
            pkg-config \
            cmake \
            curl \
            zip \
            unzip \
            tar \
            git

      - name: Download C++ build artifacts
        uses: actions/download-artifact@v4
        with:
          name: cpp-linux-build
          path: cpp/build

      - name: Verify C++ artifacts
        run: |
          echo "=== Downloaded C++ Artifacts ==="
          ls -lh cpp/build/
          test -f cpp/build/libfalcon_core_cpp.so || (echo "ERROR: libfalcon_core_cpp.so not found!" && exit 1)
          file cpp/build/libfalcon_core_cpp.so
          echo "✓ C++ artifacts verified"

      - name: Build C-API library (dev mode with tests using Makefile)
        working-directory: c-api
        run: |
          echo "=== Building with Makefile (dev mode) ==="
          CC=/usr/bin/clang CXX=/usr/bin/clang++ USE_VCPKG=1 VCPKG_TRIPLET=x64-linux-dynamic CORE_ROOT=../cpp make build-dev

          if [ $? -ne 0 ]; then
            echo "ERROR: Build failed!"
            exit 1
          fi

          echo "✓ Build successful"

      - name: Verify C-API build
        run: |
          echo "=== C-API Build Artifacts ==="
          ls -lh c-api/build/
          test -f c-api/build/libfalcon_core_c_api.so || (echo "ERROR: libfalcon_core_c_api.so not found!" && exit 1)
          test -f c-api/build/integration_serialize_connection_c || (echo "ERROR: integration_serialize_connection_c not found!" && exit 1)
          test -f c-api/build/integration_deserialize_connection_c || (echo "ERROR: integration_deserialize_connection_c not found!" && exit 1)
          echo "✓ C-API build verified"

      - name: Run C-API unit tests
        working-directory: c-api
        run: |
          echo "=== Running Unit Tests ==="
          make run-all-tests

      - name: Run C-API integration tests (same platform)
        run: |
          cd c-api/build
          export LD_LIBRARY_PATH=$(pwd):$(pwd)/vcpkg_installed/x64-linux-dynamic/lib:$(pwd)/../../cpp/build:$LD_LIBRARY_PATH
          ./integration_serialize_connection_c --output capi_linux_local.json --name "CApiLinuxLocalTest" --type PlungerGate
          ./integration_deserialize_connection_c --input capi_linux_local.json --name "CApiLinuxLocalTest" --type PlungerGate --verbose

      - name: Serialize for cross-platform test
        run: |
          cd c-api/build
          export LD_LIBRARY_PATH=$(pwd):$(pwd)/vcpkg_installed/x64-linux-dynamic/lib:$(pwd)/../../cpp/build:$LD_LIBRARY_PATH
          ./integration_serialize_connection_c --output capi_linux_cross.json --name "CApiLinuxToWindowsTest" --type ScreeningGate
          cat capi_linux_cross.json

      - name: Upload cross-platform test artifact
        uses: actions/upload-artifact@v4
        with:
          name: capi-linux-serialized
          path: c-api/build/capi_linux_cross.json
          retention-days: 1

      - name: Prepare integration test executable package (flattened structure)
        run: |
          echo "=== Preparing C-API integration test package ==="
          mkdir -p capi-integration-package

          # Copy executable
          cp c-api/build/integration_deserialize_connection_c capi-integration-package/

          # Copy C-API library
          cp c-api/build/libfalcon_core_c_api.so capi-integration-package/

          # Copy C++ library (dependency)
          cp cpp/build/libfalcon_core_cpp.so capi-integration-package/

          echo ""
          echo "=== Package contents ==="
          ls -lh capi-integration-package/

          echo ""
          echo "=== Verifying executable ==="
          file capi-integration-package/integration_deserialize_connection_c

          echo ""
          echo "✓ Integration test package prepared"

      - name: Upload integration test executable for cross-platform tests
        uses: actions/upload-artifact@v4
        with:
          name: capi-linux-integration-deserializer
          path: capi-integration-package/**
          retention-days: 1

      - name: Setup tmate session on failure
        if: failure()
        uses: mxschmitt/action-tmate@v3
        timeout-minutes: 30
