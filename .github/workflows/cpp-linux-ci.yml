name: C++ Linux CI

on:
  workflow_call:
  workflow_dispatch:

jobs:
  build-and-test:
    name: Build and Test C++ (Linux)
    runs-on: ubuntu-latest

    env:
      VCPKG_BINARY_SOURCES: "clear;files,${{ github.workspace }}/.vcpkg-binary-cache,readwrite"
      VCPKG_DOWNLOADS: "${{ github.workspace }}/.vcpkg/downloads"

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Create vcpkg binary cache directory
        run: |
          mkdir -p "${{ github.workspace }}/.vcpkg-binary-cache"

      - name: Cache vcpkg binary packages (SHARED ACROSS ALL LINUX WORKFLOWS)
        uses: actions/cache@v4
        with:
          path: .vcpkg-binary-cache
          # This key is SHARED by all Linux workflows
          key: vcpkg-binaries-linux-${{ hashFiles('**/vcpkg.json', '**/vcpkg-configuration.json') }}
          restore-keys: |
            vcpkg-binaries-linux-

      - name: Cache vcpkg downloads
        uses: actions/cache@v4
        with:
          path: ~/.cache/vcpkg/archives
          key: vcpkg-downloads-${{ runner.os }}
          restore-keys: |
            vcpkg-downloads-

      - name: Install build dependencies (MUST be before vcpkg setup)
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            make \
            ninja-build \
            clang \
            llvm \
            lld \
            pkg-config \
            cmake \
            curl \
            zip \
            unzip \
            tar \
            git \
            autoconf \
            automake \
            libtool

      - name: Setup vcpkg
        uses: lukka/run-vcpkg@v11
        with:
          vcpkgGitCommitId: "73af4de996897cb45dcf5034d16a551a3cf476f7"

      - name: Verify vcpkg is ready
        run: |
          echo "=== Verifying vcpkg installation ==="
          echo "VCPKG_ROOT: ${VCPKG_ROOT}"
          ls -la "${VCPKG_ROOT}"
          ${VCPKG_ROOT}/vcpkg version

      - name: Build C++ library (dev mode with tests using Makefile)
        working-directory: cpp
        run: |
          echo "=== Building with Makefile (dev mode) ==="
          CC=/usr/bin/clang CXX=/usr/bin/clang++ USE_VCPKG=1 VCPKG_TRIPLET=x64-linux-dynamic make build-dev

          if [ $? -ne 0 ]; then
            echo "ERROR: Build failed!"
            exit 1
          fi

          echo "✓ Build successful"

      - name: Verify build artifacts
        working-directory: cpp/build
        run: |
          echo "=== Build Artifacts ==="
          ls -lh
          test -f libfalcon_core_cpp.so || (echo "ERROR: libfalcon_core_cpp.so not found!" && exit 1)
          echo "✓ Build artifacts verified"

      - name: Run C++ unit tests
        working-directory: cpp
        run: |
          echo "=== Running Unit Tests ==="
          make run-all-tests

      - name: Run C++ integration tests (same platform)
        working-directory: cpp/build
        run: |
          export LD_LIBRARY_PATH=$(pwd):$(pwd)/vcpkg_installed/x64-linux-dynamic/lib:$LD_LIBRARY_PATH
          ./integration_serialize_connection --output cpp_linux_local.json --name "LinuxLocalTest" --type PlungerGate
          ./integration_deserialize_connection --input cpp_linux_local.json --name "LinuxLocalTest" --type PlungerGate --verbose

      - name: Serialize for cross-platform test
        working-directory: cpp/build
        run: |
          export LD_LIBRARY_PATH=$(pwd):$(pwd)/vcpkg_installed/x64-linux-dynamic/lib:$LD_LIBRARY_PATH
          ./integration_serialize_connection --output cpp_linux_cross.json --name "LinuxToWindowsTest" --type BarrierGate
          cat cpp_linux_cross.json

      - name: Upload cross-platform test artifact
        uses: actions/upload-artifact@v4
        with:
          name: cpp-linux-serialized
          path: cpp/build/cpp_linux_cross.json
          retention-days: 1

      - name: Upload C++ build artifacts for C-API CI
        uses: actions/upload-artifact@v4
        with:
          name: cpp-linux-build
          path: |
            cpp/build/libfalcon_core_cpp.so
            cpp/build/CMakeCache.txt
          retention-days: 1

      - name: Upload integration test executable for cross-platform tests
        uses: actions/upload-artifact@v4
        with:
          name: cpp-linux-integration-deserializer
          path: |
            cpp/build/integration_deserialize_connection
            cpp/build/libfalcon_core_cpp.so
          retention-days: 1

      - name: Setup tmate session on failure
        if: failure()
        uses: mxschmitt/action-tmate@v3
        timeout-minutes: 30
