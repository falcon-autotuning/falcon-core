name: C++ Linux CI

on:
  workflow_call:
  workflow_dispatch:

jobs:
  build-and-test:
    name: Build and Test C++ (Linux)
    runs-on: ubuntu-latest
    container:
      image: archlinux:latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Create build user
        run: |
          useradd -m builduser
          echo "builduser ALL=(ALL) NOPASSWD: ALL" >> /etc/sudoers
          chown -R builduser:builduser .

      - name: Cache pacman packages
        uses: actions/cache@v4
        with:
          path: /var/cache/pacman/pkg
          key: ${{ runner.os }}-pacman-${{ github.ref }}
          restore-keys: |
            ${{ runner.os }}-pacman-

      - name: Cache AUR packages
        uses: actions/cache@v4
        with:
          path: |
            packaging/highfive/*.pkg.tar.zst
            packaging/exprtk/*.pkg.tar.zst
          key: ${{ runner.os }}-aur-${{ github.ref }}
          restore-keys: |
            ${{ runner.os }}-aur-

      - name: Install system dependencies
        run: |
          pacman -Syu --noconfirm
          pacman -S --noconfirm \
            base-devel \
            git \
            wget \
            curl \
            pkg-config \
            openssh \
            cereal \
            hdf5 \
            boost \
            bzip2 \
            expat \
            nlohmann-json \
            openssl \
            python \
            sqlite \
            yaml-cpp \
            zlib \
            ninja \
            llvm \
            ccache \
            clang \
            gtest \
            glibc \
            cmake \
            lld

      - name: Set clang as default compiler for makepkg
        run: |
          grep -q '^CC=' /etc/makepkg.conf && \
          sed -i 's|^CC=.*|CC=/usr/bin/clang|' /etc/makepkg.conf || \
          echo 'CC=/usr/bin/clang' >> /etc/makepkg.conf

          grep -q '^CXX=' /etc/makepkg.conf && \
          sed -i 's|^CXX=.*|CXX=/usr/bin/clang++|' /etc/makepkg.conf || \
          echo 'CXX=/usr/bin/clang++' >> /etc/makepkg.conf

      - name: Cache ccache
        uses: actions/cache@v4
        with:
          path: ~/.ccache
          key: ${{ runner.os }}-ccache-${{ github.ref }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-ccache-${{ github.ref }}-
            ${{ runner.os }}-ccache-

      - name: Install AUR packages
        run: |
          mkdir -p packaging
          chown builduser:builduser packaging
          runuser -u builduser -- env PATH=/usr/bin:$PATH bash -c "
              if [ ! -d packaging/highfive ]; then git clone https://aur.archlinux.org/highfive.git packaging/highfive; fi
              if [ ! -d packaging/exprtk ]; then git clone https://aur.archlinux.org/exprtk.git packaging/exprtk; fi
              cd packaging/highfive
              if ls *.pkg.tar.zst 1> /dev/null 2>&1; then
                sudo pacman -U --noconfirm ./*.pkg.tar.zst
              else
                PKGDEST=\"\$(pwd)\" makepkg -si --noconfirm --needed
              fi
              cd ../exprtk
              if ls *.pkg.tar.zst 1> /dev/null 2>&1; then
                sudo pacman -U --noconfirm ./*.pkg.tar.zst
              else
                PKGDEST=\"\$(pwd)\" makepkg -si --noconfirm --needed
              fi
            "

      - name: Build xtensor packages
        run: |
          runuser -u builduser -- env PATH=/usr/bin:$PATH bash -c "
            cd packaging/xtl && makepkg -si --noconfirm --syncdeps --cleanbuild
            cd ../xsimd && makepkg -si --noconfirm --syncdeps --cleanbuild
            cd ../xtensor && makepkg -si --noconfirm --syncdeps --cleanbuild
            cd ../xtensor-io && makepkg -si --noconfirm --syncdeps --cleanbuild
          "

      - name: Build C++ library (dev mode with tests)
        run: |
          cd cpp
          CC=/usr/bin/clang CXX=/usr/bin/clang++ make build-dev

      - name: Run C++ unit tests
        run: |
          cd cpp
          make run-all-tests

      - name: Run C++ integration tests (same platform)
        run: |
          cd cpp/build
          export LD_LIBRARY_PATH=$(pwd):$LD_LIBRARY_PATH
          ./integration_serialize_connection --output cpp_linux_local.json --name "LinuxLocalTest" --type PlungerGate
          ./integration_deserialize_connection --input cpp_linux_local.json --name "LinuxLocalTest" --type PlungerGate --verbose

      - name: Serialize for cross-platform test
        run: |
          cd cpp/build
          export LD_LIBRARY_PATH=$(pwd):$LD_LIBRARY_PATH
          ./integration_serialize_connection --output cpp_linux_cross.json --name "LinuxToWindowsTest" --type BarrierGate
          cat cpp_linux_cross.json

      - name: Upload cross-platform test artifact
        uses: actions/upload-artifact@v4
        with:
          name: cpp-linux-serialized
          path: cpp/build/cpp_linux_cross.json
          retention-days: 1

      - name: Upload integration test executable for cross-platform tests
        uses: actions/upload-artifact@v4
        with:
          name: cpp-linux-integration-deserializer
          path: |
            cpp/build/integration_deserialize_connection
            cpp/build/libfalcon_core_cpp.so
          retention-days: 1

      - name: Setup tmate session on failure
        if: failure()
        uses: mxschmitt/action-tmate@v3
        timeout-minutes: 30
