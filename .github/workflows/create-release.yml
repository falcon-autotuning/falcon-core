name: Create GitHub Release

on:
  workflow_call:
  workflow_dispatch:

jobs:
  create-release:
    name: Create Release
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download all release artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts

      - name: Display structure of downloaded files
        run: |
          echo "=== Downloaded Artifacts Structure ==="
          ls -R release-artifacts
          echo ""
          echo "=== File Sizes ==="
          find release-artifacts -type f -exec ls -lh {} \;

      - name: Verify all artifacts present
        run: |
          required_artifacts=(
            "falcon-core-cpp-linux-x64/falcon-core-cpp-linux-x64.tar.gz"
            "falcon-core-cpp-linux-x64/falcon-core-cpp-linux-x64.tar.gz.sha256"
            "falcon-core-cpp-windows-x64/falcon-core-cpp-windows-x64.zip"
            "falcon-core-cpp-windows-x64/falcon-core-cpp-windows-x64.zip.sha256"
            "falcon-core-c-api-linux-x64/falcon-core-c-api-linux-x64.tar.gz"
            "falcon-core-c-api-linux-x64/falcon-core-c-api-linux-x64.tar.gz.sha256"
            "falcon-core-c-api-windows-x64/falcon-core-c-api-windows-x64.zip"
            "falcon-core-c-api-windows-x64/falcon-core-c-api-windows-x64.zip.sha256"
          )

          all_present=true
          for artifact in "${required_artifacts[@]}"; do
            if [ -f "release-artifacts/$artifact" ]; then
              echo "[OK] $artifact"
            else
              echo "[MISSING] $artifact"
              all_present=false
            fi
          done

          if [ "$all_present" = false ]; then
            echo ""
            echo "ERROR: Not all required artifacts are present!"
            exit 1
          fi

          echo ""
          echo "✓ All artifacts verified"

      - name: Generate release tag
        id: tag
        run: |
          # Use semantic versioning with date
          VERSION="v$(date +'%Y.%m.%d')-$(git rev-parse --short HEAD)"
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Generated version: $VERSION"

          # Also create a friendly name
          RELEASE_NAME="Falcon Core $VERSION"
          echo "release_name=$RELEASE_NAME" >> $GITHUB_OUTPUT

      - name: Create release notes
        id: notes
        run: |
          cat > release-notes.md << 'EOF'
          # Falcon Core Release

          Multi-platform release of Falcon Core libraries for quantum device control and autotuning.

          ## 📦 Packages

          ### C++ Library

          - **Linux x64** (`falcon-core-cpp-linux-x64.tar.gz`)
            - Optimized release build
            - Clang/LLVM compiled
            - Includes headers and shared library

          - **Windows x64** (`falcon-core-cpp-windows-x64.zip`)
            - Optimized release build
            - Clang-CL compiled
            - Includes DLL, import library, headers, and all runtime dependencies

          ### C-API Library

          - **Linux x64** (`falcon-core-c-api-linux-x64.tar.gz`)
            - C interface to C++ library
            - Includes both C-API and C++ libraries
            - Clang/LLVM compiled

          - **Windows x64** (`falcon-core-c-api-windows-x64.zip`)
            - C interface to C++ library
            - Includes both C-API and C++ libraries with all dependencies
            - Clang-CL compiled

          ## ✅ Verification

          Each package includes a `.sha256` checksum file. Verify your download:

          **Linux/macOS:**
          ```bash
          sha256sum -c falcon-core-*.sha256
          ```

          **Windows (PowerShell):**
          ```powershell
          $expected = (Get-Content falcon-core-*.sha256).Split()[0]
          $actual = (Get-FileHash falcon-core-*.zip -Algorithm SHA256).Hash.ToLower()
          if ($expected -eq $actual) { "OK" } else { "MISMATCH" }
          ```

          ## 📋 System Requirements

          ### Linux
          - glibc 2.31+
          - System dependencies: Boost, HDF5, yaml-cpp, cereal, xtensor

          ### Windows
          - Windows 10/11 (x64)
          - Visual C++ Redistributable (if needed)
          - All dependencies included in package

          ## 🚀 Quick Start

          Refer to the `README.md` file in each package for installation and usage instructions.

          ## 📝 Build Information

          - **Commit:** $GITHUB_SHA
          - **Build Date:** $(date -u +"%Y-%m-%d %H:%M:%S UTC")
          - **Compiler:** Clang/LLVM (Linux), Clang-CL (Windows)
          - **Build Type:** Release (Optimized)
          - **C++ Standard:** C++14
          - **C Standard:** C99

          ## 🔗 Documentation

          For full documentation, visit the [repository](https://github.com/$GITHUB_REPOSITORY)

          ## ⚠️ Known Issues

          - Windows packages are larger due to included dependencies
          - Linux packages require system dependencies to be installed separately

          EOF

          echo "Release notes created"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.version }}
          name: ${{ steps.tag.outputs.release_name }}
          body_path: release-notes.md
          draft: false
          prerelease: false
          files: |
            release-artifacts/falcon-core-cpp-linux-x64/falcon-core-cpp-linux-x64.tar.gz
            release-artifacts/falcon-core-cpp-linux-x64/falcon-core-cpp-linux-x64.tar.gz.sha256
            release-artifacts/falcon-core-cpp-windows-x64/falcon-core-cpp-windows-x64.zip
            release-artifacts/falcon-core-cpp-windows-x64/falcon-core-cpp-windows-x64.zip.sha256
            release-artifacts/falcon-core-c-api-linux-x64/falcon-core-c-api-linux-x64.tar.gz
            release-artifacts/falcon-core-c-api-linux-x64/falcon-core-c-api-linux-x64.tar.gz.sha256
            release-artifacts/falcon-core-c-api-windows-x64/falcon-core-c-api-windows-x64.zip
            release-artifacts/falcon-core-c-api-windows-x64/falcon-core-c-api-windows-x64.zip.sha256
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Release Summary
        run: |
          echo "=================================================="
          echo "Release created successfully!"
          echo "=================================================="
          echo "Tag: ${{ steps.tag.outputs.version }}"
          echo "Name: ${{ steps.tag.outputs.release_name }}"
          echo ""
          echo "Artifacts included:"
          echo "  📦 falcon-core-cpp-linux-x64.tar.gz"
          echo "  📦 falcon-core-cpp-windows-x64.zip"
          echo "  📦 falcon-core-c-api-linux-x64.tar.gz"
          echo "  📦 falcon-core-c-api-windows-x64.zip"
          echo "  🔒 SHA256 checksums for all packages"
          echo ""
          echo "Release URL:"
          echo "  https://github.com/$GITHUB_REPOSITORY/releases/tag/${{ steps.tag.outputs.version }}"
          echo "=================================================="

      - name: Setup tmate session on failure
        if: failure()
        uses: mxschmitt/action-tmate@v3
        timeout-minutes: 30
