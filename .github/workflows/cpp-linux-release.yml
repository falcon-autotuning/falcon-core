name: C++ Linux Release Build

on:
  workflow_call:
  workflow_dispatch:

jobs:
  build-release:
    name: Build C++ Release (Linux)
    runs-on: ubuntu-latest
    container:
      image: archlinux:latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Create build user
        run: |
          useradd -m builduser
          echo "builduser ALL=(ALL) NOPASSWD: ALL" >> /etc/sudoers
          chown -R builduser:builduser .

      - name: Cache pacman packages
        uses: actions/cache@v4
        with:
          path: /var/cache/pacman/pkg
          key: ${{ runner.os }}-pacman-release-${{ github.ref }}
          restore-keys: |
            ${{ runner.os }}-pacman-release-
            ${{ runner.os }}-pacman-

      - name: Cache AUR packages
        uses: actions/cache@v4
        with:
          path: |
            packaging/highfive/*.pkg.tar.zst
            packaging/exprtk/*.pkg.tar.zst
          key: ${{ runner.os }}-aur-release-${{ github.ref }}
          restore-keys: |
            ${{ runner.os }}-aur-release-
            ${{ runner.os }}-aur-

      - name: Install system dependencies
        run: |
          pacman -Syu --noconfirm
          pacman -S --noconfirm \
            base-devel \
            git \
            wget \
            curl \
            pkg-config \
            cereal \
            hdf5 \
            boost \
            bzip2 \
            expat \
            nlohmann-json \
            openssl \
            python \
            sqlite \
            yaml-cpp \
            zlib \
            ninja \
            llvm \
            ccache \
            clang \
            cmake \
            lld \
            tar \
            gzip

      - name: Set clang as default compiler
        run: |
          grep -q '^CC=' /etc/makepkg.conf && \
          sed -i 's|^CC=.*|CC=/usr/bin/clang|' /etc/makepkg.conf || \
          echo 'CC=/usr/bin/clang' >> /etc/makepkg.conf

          grep -q '^CXX=' /etc/makepkg.conf && \
          sed -i 's|^CXX=.*|CXX=/usr/bin/clang++|' /etc/makepkg.conf || \
          echo 'CXX=/usr/bin/clang++' >> /etc/makepkg.conf

      - name: Cache ccache
        uses: actions/cache@v4
        with:
          path: ~/.ccache
          key: ${{ runner.os }}-ccache-${{ github.ref }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-ccache-${{ github.ref }}-
            ${{ runner.os }}-ccache-

      - name: Install AUR packages
        run: |
          mkdir -p packaging
          chown builduser:builduser packaging
          runuser -u builduser -- env PATH=/usr/bin:$PATH bash -c "
              if [ ! -d packaging/highfive ]; then git clone https://aur.archlinux.org/highfive.git packaging/highfive; fi
              if [ ! -d packaging/exprtk ]; then git clone https://aur.archlinux.org/exprtk.git packaging/exprtk; fi
              cd packaging/highfive
              if ls *.pkg.tar.zst 1> /dev/null 2>&1; then
                sudo pacman -U --noconfirm ./*.pkg.tar.zst
              else
                PKGDEST=\"\$(pwd)\" makepkg -si --noconfirm --needed
              fi
              cd ../exprtk
              if ls *.pkg.tar.zst 1> /dev/null 2>&1; then
                sudo pacman -U --noconfirm ./*.pkg.tar.zst
              else
                PKGDEST=\"\$(pwd)\" makepkg -si --noconfirm --needed
              fi
            "

      - name: Build xtensor packages
        run: |
          runuser -u builduser -- env PATH=/usr/bin:$PATH bash -c "
            cd packaging/xtl && makepkg -si --noconfirm --syncdeps --cleanbuild
            cd ../xsimd && makepkg -si --noconfirm --syncdeps --cleanbuild
            cd ../xtensor && makepkg -si --noconfirm --syncdeps --cleanbuild
            cd ../xtensor-io && makepkg -si --noconfirm --syncdeps --cleanbuild
          "

      - name: Build C++ library (OPTIMIZED RELEASE)
        run: |
          cd cpp
          CC=/usr/bin/clang CXX=/usr/bin/clang++ make build
          echo "=== Build completed ==="
          ls -lh build/

      - name: Verify release build
        run: |
          test -f cpp/build/libfalcon_core_cpp.so || (echo "ERROR: libfalcon_core_cpp.so not found!" && exit 1)
          file cpp/build/libfalcon_core_cpp.so
          size cpp/build/libfalcon_core_cpp.so
          echo "✓ Release build verified"

      - name: Package release artifact
        run: |
          cd cpp
          mkdir -p release-package/lib
          mkdir -p release-package/include

          cp build/libfalcon_core_cpp.so release-package/lib/
          cp -r include/falcon_core release-package/include/

          cat > release-package/README.md << 'EOF'
          # Falcon Core C++ Library - Linux x64

          ## Contents

          - `lib/libfalcon_core_cpp.so` - Optimized shared library
          - `include/falcon_core/` - Public header files

          ## Installation

          Copy the library and headers to your system:

          ```bash
          sudo cp lib/libfalcon_core_cpp.so /usr/local/lib/
          sudo cp -r include/falcon_core /usr/local/include/
          sudo ldconfig
          ```

          ## Dependencies

          Required system packages:
          - boost (filesystem, system, uuid)
          - hdf5
          - yaml-cpp
          - cereal
          - xtensor
          - xtensor-io
          - xsimd
          - xtl

          Install via your package manager before using this library.

          ## Build Information

          - Platform: Linux x86_64
          - Compiler: Clang/LLVM
          - C++ Standard: C++14
          - Build Type: Release (Optimized)
          EOF

          echo "falcon-core-cpp-linux-x64" > release-package/VERSION
          echo "Built: $(date -u +"%Y-%m-%d %H:%M:%S UTC")" >> release-package/VERSION
          echo "Commit: $GITHUB_SHA" >> release-package/VERSION

          tar -czf falcon-core-cpp-linux-x64.tar.gz -C release-package .
          ls -lh falcon-core-cpp-linux-x64.tar.gz

      - name: Generate checksum
        run: |
          cd cpp
          sha256sum falcon-core-cpp-linux-x64.tar.gz > falcon-core-cpp-linux-x64.tar.gz.sha256
          cat falcon-core-cpp-linux-x64.tar.gz.sha256

      - name: Upload release artifacts for C-API
        uses: actions/upload-artifact@v4
        with:
          name: cpp-linux-release-build
          path: cpp/build/libfalcon_core_cpp.so
          retention-days: 1

      - name: Upload release package
        uses: actions/upload-artifact@v4
        with:
          name: falcon-core-cpp-linux-x64
          path: |
            cpp/falcon-core-cpp-linux-x64.tar.gz
            cpp/falcon-core-cpp-linux-x64.tar.gz.sha256
          retention-days: 90
          compression-level: 0

      - name: Setup tmate session on failure
        if: failure()
        uses: mxschmitt/action-tmate@v3
        timeout-minutes: 30
