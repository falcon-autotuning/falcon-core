name: Windows build + test (vcpkg) + tmate on failure

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Cache vcpkg
        uses: actions/cache@v4
        with:
          path: |
            vcpkg/archives
            vcpkg/downloads
            vcpkg/buildtrees
            vcpkg/packages
          key: ${{ runner.os }}-vcpkg-${{ hashFiles('**/vcpkg.json') }}

      - name: Install vcpkg
        run: |
          git clone https://github.com/microsoft/vcpkg.git
          cd vcpkg
          git checkout 6f5c259
          .\bootstrap-vcpkg.bat

      # Install vcpkg dependencies for cpp
      - name: Install vcpkg dependencies for cpp
        run: ..\vcpkg\vcpkg.exe install --triplet x64-windows
        working-directory: cpp

      - name: Configure (CMake + vcpkg)
        shell: pwsh
        run: |
          cmake -S . -B build `
            -G "Visual Studio 17 2022" -A x64 `
            -DCMAKE_TOOLCHAIN_FILE="${{ github.workspace }}/vcpkg/scripts/buildsystems/vcpkg.cmake" `
            -DBUILD_TESTS=ON

      - name: Build
        shell: pwsh
        run: |
          cmake --build build --config Release --verbose

      - name: Run tests
        shell: pwsh
        run: |
          # Make sure runtime DLLs are discoverable (vcpkg DLLs + build output)
          $env:PATH = "$PWD\build\vcpkg_installed\x64-windows\bin;$PWD\build\Release;$env:PATH"

          # Adjust if your test exe lives elsewhere:
          $testExe = "cpp\build\falcon_core_cpp_run_tests.exe"
          if (!(Test-Path $testExe)) {
            Write-Error "Test exe not found: $testExe (update path in workflow)"
            Get-ChildItem -Recurse build -Filter *.exe | Select-Object FullName
            exit 1
          }

          & $testExe --gtest_color=no --gtest_output=xml:"$PWD\gtest.xml"
          exit $LASTEXITCODE

      - name: Upload test artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-test-artifacts
          path: |
            gtest.xml
            build/**/*.exe
            build/**/*.dll

      - name: tmate on failure
        if: ${{ failure() }}
        uses: mxschmitt/action-tmate@v3
        timeout-minutes: 45
        with:
          limit-access-to-actor: true

      - name: Upload crash dumps
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: crash-dumps
          path: D:\a\falcon-core\falcon-core\cpp\build\dumps\*
