name: C-API Windows CI

on:
  workflow_call:
  workflow_dispatch:

jobs:
  build-and-test:
    name: Build and Test C-API (Windows)
    runs-on: windows-latest

    env:
      VCPKG_BINARY_SOURCES: "clear;files,${{ github.workspace }}/.vcpkg-binary-cache,readwrite"
      VCPKG_DOWNLOADS: "${{ github.workspace }}/.vcpkg/downloads"

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Create vcpkg binary cache directory
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path ".vcpkg-binary-cache"

      - name: Cache vcpkg binary packages (SHARED ACROSS ALL WINDOWS WORKFLOWS)
        uses: actions/cache@v4
        with:
          path: .vcpkg-binary-cache
          # This key is SHARED by all Windows workflows
          key: vcpkg-binaries-windows-${{ hashFiles('**/vcpkg.json', '**/vcpkg-configuration.json') }}
          restore-keys: |
            vcpkg-binaries-windows-

      - name: Setup vcpkg
        uses: lukka/run-vcpkg@v11
        with:
          vcpkgGitCommitId: "73af4de996897cb45dcf5034d16a551a3cf476f7"

      - name: Install LLVM/Clang
        shell: pwsh
        run: |
          Write-Host "=== Installing LLVM/Clang ==="
          choco install llvm -y
          $env:Path = [System.Environment]::GetEnvironmentVariable("Path","Machine") + ";" + [System.Environment]::GetEnvironmentVariable("Path","User")
          Write-Host "✓ LLVM/Clang installed"

      - name: Install Ninja
        shell: pwsh
        run: |
          Write-Host "=== Installing Ninja ==="
          choco install ninja -y
          Write-Host "✓ Ninja installed"

      - name: Download C++ build artifacts
        uses: actions/download-artifact@v4
        with:
          name: cpp-windows-build
          path: cpp/build

      - name: Verify and organize C++ artifacts
        shell: pwsh
        run: |
          Write-Host "=== Downloaded C++ Artifacts ==="
          Get-ChildItem cpp/build -Recurse

          if (Test-Path "cpp/build/falcon_core_cpp.dll") {
            Write-Host "✓ falcon_core_cpp.dll found in root"
          } else {
            $dllLocation = Get-ChildItem "cpp/build" -Recurse -Filter "falcon_core_cpp.dll" | Select-Object -First 1
            if ($dllLocation) {
              Write-Host "Found DLL at: $($dllLocation.FullName)"
              Copy-Item $dllLocation.FullName "cpp/build/"
              
              $libLocation = Get-ChildItem "cpp/build" -Recurse -Filter "falcon_core_cpp.lib" | Select-Object -First 1
              if ($libLocation) {
                Copy-Item $libLocation.FullName "cpp/build/"
              }
              
              Write-Host "✓ Reorganized artifacts to cpp/build root"
            } else {
              Write-Error "ERROR: falcon_core_cpp.dll not found!"
              exit 1
            }
          }

          Write-Host "`n=== Final cpp/build contents ==="
          Get-ChildItem cpp/build -Filter "*.*" | Select-Object Name, Length

      - name: Configure CMake for C-API
        working-directory: c-api
        shell: pwsh
        run: |
          $env:Path = [System.Environment]::GetEnvironmentVariable("Path","Machine") + ";" + [System.Environment]::GetEnvironmentVariable("Path","User")

          cmake -B build `
            -S . `
            -G "Ninja" `
            -DCMAKE_C_COMPILER=clang-cl `
            -DCMAKE_CXX_COMPILER=clang-cl `
            -DCMAKE_TOOLCHAIN_FILE="${env:VCPKG_ROOT}/scripts/buildsystems/vcpkg.cmake" `
            -DVCPKG_MANIFEST_DIR="${env:GITHUB_WORKSPACE}/c-api" `
            -DVCPKG_INSTALLED_DIR="${env:GITHUB_WORKSPACE}/c-api/build/vcpkg_installed" `
            -DCMAKE_BUILD_TYPE=Release `
            -DFALCON_CORE_DEV=ON `
            -DUSE_VCPKG=ON `
            -DCORE_ROOT="${env:GITHUB_WORKSPACE}/cpp"

          if ($LASTEXITCODE -ne 0) {
            Write-Error "CMake configuration failed!"
            exit $LASTEXITCODE
          }

      - name: Build C-API library
        working-directory: c-api
        shell: pwsh
        run: |
          ninja -C build -v

          if ($LASTEXITCODE -ne 0) {
            Write-Error "Build failed!"
            exit $LASTEXITCODE
          }

      - name: Manually copy C++ DLLs to C-API build directory
        shell: pwsh
        run: |
          Get-ChildItem "cpp/build" -Filter "*.dll" | ForEach-Object {
            Copy-Item $_.FullName "c-api/build/" -Force
            Write-Host "Copied: $($_.Name)"
          }

      - name: Verify C-API build
        working-directory: c-api
        shell: pwsh
        run: |
          $requiredFiles = @(
            "build/falcon_core_c_api.dll",
            "build/falcon_core_cpp.dll",
            "build/integration_deserialize_connection_c.exe"
          )

          foreach ($file in $requiredFiles) {
            if (-not (Test-Path $file)) {
              Write-Error "ERROR: Required file not found: $file"
              exit 1
            } else {
              $fileInfo = Get-Item $file
              Write-Host "[OK] $file ($($fileInfo.Length) bytes)"
            }
          }

          Write-Host "`n✓ C-API build verified"

      - name: Run C-API tests
        working-directory: c-api
        shell: pwsh
        run: |
          $buildDir = (Resolve-Path "build").Path
          $cppBuildDir = (Resolve-Path "../cpp/build").Path
          $env:PATH = "$buildDir;$cppBuildDir;$env:PATH"

          $testExe = Get-ChildItem -Path "build" -Filter "falcon_core_c_api_run_tests.exe" -Recurse | Select-Object -First 1

          if (-not $testExe) {
            Write-Error "Test executable not found!"
            exit 1
          }

          & ".\$($testExe.FullName.Replace("$PWD\", ''))" --gtest_color=yes
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }

      - name: Run C-API integration tests (same platform)
        shell: pwsh
        run: |
          cd c-api/build
          .\integration_serialize_connection_c.exe --output capi_windows_local.json --name "CApiWindowsLocalTest" --type PlungerGate
          .\integration_deserialize_connection_c.exe --input capi_windows_local.json --name "CApiWindowsLocalTest" --type PlungerGate --verbose

      - name: Serialize for cross-platform test
        shell: pwsh
        run: |
          cd c-api/build
          .\integration_serialize_connection_c.exe --output capi_windows_cross.json --name "CApiWindowsToLinuxTest" --type Ohmic
          Get-Content capi_windows_cross.json

      - name: Upload cross-platform test artifact
        uses: actions/upload-artifact@v4
        with:
          name: capi-windows-serialized
          path: c-api/build/capi_windows_cross.json
          retention-days: 1

      - name: Prepare integration test executable with ALL dependencies for cross-platform tests
        working-directory: c-api/build
        shell: pwsh
        run: |
          Write-Host "=== Preparing C-API integration test executable ==="

          $artifactDir = "integration-test-package"
          New-Item -ItemType Directory -Force -Path $artifactDir

          # Verify the executable exists before copying
          if (-not (Test-Path "integration_deserialize_connection_c.exe")) {
            Write-Error "ERROR: integration_deserialize_connection_c.exe not found!"
            Get-ChildItem . -Recurse -Filter "*deserialize*.exe"
            exit 1
          }

          # Copy C-API executable
          Copy-Item "integration_deserialize_connection_c.exe" $artifactDir
          Write-Host "✓ Copied integration_deserialize_connection_c.exe"

          # Copy C-API DLL
          if (Test-Path "falcon_core_c_api.dll") {
            Copy-Item "falcon_core_c_api.dll" $artifactDir
            Write-Host "✓ Copied falcon_core_c_api.dll"
          } else {
            Write-Warning "falcon_core_c_api.dll not found in build directory"
          }

          # Copy C++ DLL (dependency)
          if (Test-Path "../../cpp/build/falcon_core_cpp.dll") {
            Copy-Item "../../cpp/build/falcon_core_cpp.dll" $artifactDir
            Write-Host "✓ Copied falcon_core_cpp.dll"
          } elseif (Test-Path "falcon_core_cpp.dll") {
            Copy-Item "falcon_core_cpp.dll" $artifactDir
            Write-Host "✓ Copied falcon_core_cpp.dll (from local)"
          } else {
            Write-Warning "falcon_core_cpp.dll not found"
          }

          # Copy vcpkg DLLs (runtime dependencies)
          $vcpkgBin = "vcpkg_installed/x64-windows/bin"
          if (Test-Path $vcpkgBin) {
            Write-Host "`nCopying vcpkg runtime dependencies..."
            Get-ChildItem $vcpkgBin -Filter "*.dll" | ForEach-Object {
              Copy-Item $_.FullName $artifactDir
              Write-Host "  Copied: $($_.Name)"
            }
          } else {
            Write-Warning "vcpkg bin directory not found at: $vcpkgBin"
          }

          Write-Host "`n=== Integration Test Package Contents ==="
          Get-ChildItem $artifactDir | ForEach-Object {
            Write-Host "$($_.Name) - $($_.Length) bytes"
          }

          # Verify the executable is in the package
          if (-not (Test-Path "$artifactDir/integration_deserialize_connection_c.exe")) {
            Write-Error "CRITICAL: Executable not in artifact package!"
            exit 1
          }

          Write-Host "`n✓ Integration test package prepared successfully"

      - name: Upload integration test executable for cross-platform tests
        uses: actions/upload-artifact@v4
        with:
          name: capi-windows-integration-deserializer
          path: c-api/build/integration-test-package/**
          retention-days: 1
          compression-level: 0

      - name: Setup tmate session on failure
        if: failure()
        uses: mxschmitt/action-tmate@v3
        timeout-minutes: 30
