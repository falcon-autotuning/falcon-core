name: C-API Windows CI

on:
  workflow_call:
  workflow_dispatch:

jobs:
  build-and-test:
    name: Build and Test C-API (Windows)
    runs-on: windows-latest

    env:
      VCPKG_BINARY_SOURCES: "clear;files,${{ github.workspace }}/.vcpkg/bincache,readwrite"
      VCPKG_DOWNLOADS: "${{ github.workspace }}/.vcpkg/downloads"

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Attempt to restore vcpkg binary cache
        uses: actions/cache@v4
        with:
          path: |
            .vcpkg/bincache
            .vcpkg/downloads
          key: vcpkg-${{ runner.os }}-clang-cl-capi-${{ hashFiles('c-api/vcpkg.json', 'vcpkg-lock.json', '**/vcpkg-configuration.json') }}
          restore-keys: |
            vcpkg-${{ runner.os }}-clang-cl-capi-
            vcpkg-${{ runner.os }}-clang-cl-
            vcpkg-${{ runner.os }}-

      - name: Setup vcpkg
        uses: lukka/run-vcpkg@v11
        with:
          vcpkgGitCommitId: "73af4de996897cb45dcf5034d16a551a3cf476f7"

      - name: Install LLVM/Clang
        shell: pwsh
        run: |
          Write-Host "=== Installing LLVM/Clang ==="
          choco install llvm -y
          $env:Path = [System.Environment]::GetEnvironmentVariable("Path","Machine") + ";" + [System.Environment]::GetEnvironmentVariable("Path","User")
          Write-Host "✓ LLVM/Clang installed"

      - name: Install Ninja
        shell: pwsh
        run: |
          Write-Host "=== Installing Ninja ==="
          choco install ninja -y
          Write-Host "✓ Ninja installed"

      - name: Download C++ build artifacts
        uses: actions/download-artifact@v4
        with:
          name: cpp-windows-build
          path: cpp/build

      - name: Verify C++ artifacts
        shell: pwsh
        run: |
          Write-Host "=== Downloaded C++ Artifacts ==="
          Get-ChildItem cpp/build -Recurse

          if (-not (Test-Path "cpp/build/falcon_core_cpp.dll")) {
            Write-Error "ERROR: falcon_core_cpp.dll not found!"
            exit 1
          }

          Write-Host "✓ C++ artifacts verified"

      - name: Copy C++ DLLs to predictable location
        shell: pwsh
        run: |
          if (-not (Test-Path "cpp/build/falcon_core_cpp.dll")) {
            $dllLocation = Get-ChildItem "cpp/build" -Recurse -Filter "falcon_core_cpp.dll" | Select-Object -First 1
            if ($dllLocation) {
              Copy-Item $dllLocation.FullName "cpp/build/"
            }
          }

      - name: Configure CMake for C-API
        working-directory: c-api
        shell: pwsh
        run: |
          $env:Path = [System.Environment]::GetEnvironmentVariable("Path","Machine") + ";" + [System.Environment]::GetEnvironmentVariable("Path","User")

          cmake -B build `
            -S . `
            -G "Ninja" `
            -DCMAKE_C_COMPILER=clang-cl `
            -DCMAKE_CXX_COMPILER=clang-cl `
            -DCMAKE_TOOLCHAIN_FILE="${env:VCPKG_ROOT}/scripts/buildsystems/vcpkg.cmake" `
            -DVCPKG_MANIFEST_DIR="${env:GITHUB_WORKSPACE}/c-api" `
            -DVCPKG_INSTALLED_DIR="${env:GITHUB_WORKSPACE}/c-api/build/vcpkg_installed" `
            -DCMAKE_BUILD_TYPE=Release `
            -DFALCON_CORE_DEV=ON `
            -DUSE_VCPKG=ON `
            -DCORE_ROOT="${env:GITHUB_WORKSPACE}/cpp"

          if ($LASTEXITCODE -ne 0) {
            Write-Error "CMake configuration failed!"
            exit $LASTEXITCODE
          }

      - name: Build C-API library
        working-directory: c-api
        shell: pwsh
        run: |
          ninja -C build -v

          if ($LASTEXITCODE -ne 0) {
            Write-Error "Build failed!"
            exit $LASTEXITCODE
          }

      - name: Manually copy C++ DLLs to C-API build directory
        shell: pwsh
        run: |
          Get-ChildItem "cpp/build" -Filter "*.dll" | ForEach-Object {
            Copy-Item $_.FullName "c-api/build/" -Force
          }

      - name: Verify C-API build
        working-directory: c-api
        shell: pwsh
        run: |
          $requiredFiles = @(
            "build/falcon_core_c_api.dll",
            "build/falcon_core_cpp.dll"
          )

          foreach ($file in $requiredFiles) {
            if (-not (Test-Path $file)) {
              Write-Error "ERROR: Required file not found: $file"
              exit 1
            }
          }

          Write-Host "✓ C-API build verified"

      - name: Run C-API tests
        working-directory: c-api
        shell: pwsh
        run: |
          $buildDir = (Resolve-Path "build").Path
          $cppBuildDir = (Resolve-Path "../cpp/build").Path
          $env:PATH = "$buildDir;$cppBuildDir;$env:PATH"

          $testExe = Get-ChildItem -Path "build" -Filter "falcon_core_c_api_run_tests.exe" -Recurse | Select-Object -First 1

          if (-not $testExe) {
            Write-Error "Test executable not found!"
            exit 1
          }

          & ".\$($testExe.FullName.Replace("$PWD\", ''))" --gtest_color=yes
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }

      - name: Run C-API integration tests (same platform)
        shell: pwsh
        run: |
          cd c-api/build
          .\integration_serialize_connection_c.exe --output capi_windows_local.json --name "CApiWindowsLocalTest" --type PlungerGate
          .\integration_deserialize_connection_c.exe --input capi_windows_local.json --name "CApiWindowsLocalTest" --type PlungerGate --verbose

      - name: Serialize for cross-platform test
        shell: pwsh
        run: |
          cd c-api/build
          .\integration_serialize_connection_c.exe --output capi_windows_cross.json --name "CApiWindowsToLinuxTest" --type Ohmic
          Get-Content capi_windows_cross.json

      - name: Upload cross-platform test artifact
        uses: actions/upload-artifact@v4
        with:
          name: capi-windows-serialized
          path: c-api/build/capi_windows_cross.json
          retention-days: 1

      - name: Prepare integration test executable with dependencies
        working-directory: c-api/build
        shell: pwsh
        run: |
          Write-Host "=== Preparing C-API integration test executable ==="

          $artifactDir = "integration-test-package"
          New-Item -ItemType Directory -Force -Path $artifactDir

          # Copy C-API executable
          Copy-Item "integration_deserialize_connection_c.exe" $artifactDir

          # Copy C-API DLL
          Copy-Item "falcon_core_c_api.dll" $artifactDir

          # Copy C++ DLL
          Copy-Item "../../cpp/build/falcon_core_cpp.dll" $artifactDir

          # Copy vcpkg DLLs
          $vcpkgBin = "vcpkg_installed/x64-windows/bin"
          if (Test-Path $vcpkgBin) {
            Get-ChildItem $vcpkgBin -Filter "*.dll" | ForEach-Object {
              Copy-Item $_.FullName $artifactDir
              Write-Host "  Copied: $($_.Name)"
            }
          }

          Write-Host "`n=== Package Contents ==="
          Get-ChildItem $artifactDir | Select-Object Name, Length

      - name: Upload integration test executable for cross-platform tests
        uses: actions/upload-artifact@v4
        with:
          name: capi-windows-integration-deserializer
          path: c-api/build/integration-test-package/**
          retention-days: 1
          compression-level: 0

      - name: Setup tmate session on failure
        if: failure()
        uses: mxschmitt/action-tmate@v3
        timeout-minutes: 30
