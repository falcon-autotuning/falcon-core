name: C-API Windows CI

on:
  workflow_call:
  workflow_dispatch:

jobs:
  build-and-test:
    name: Build and Test C-API (Windows)
    runs-on: windows-latest

    env:
      VCPKG_BINARY_SOURCES: "clear;files,${{ github.workspace }}/.vcpkg/bincache,readwrite"
      VCPKG_DOWNLOADS: "${{ github.workspace }}/.vcpkg/downloads"

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Attempt to restore vcpkg binary cache
        uses: actions/cache@v4
        with:
          path: |
            .vcpkg/bincache
            .vcpkg/downloads
          key: vcpkg-${{ runner.os }}-clang-cl-capi-${{ hashFiles('c-api/vcpkg.json', 'vcpkg-lock.json', '**/vcpkg-configuration.json') }}
          restore-keys: |
            vcpkg-${{ runner.os }}-clang-cl-capi-
            vcpkg-${{ runner.os }}-clang-cl-
            vcpkg-${{ runner.os }}-

      - name: Setup vcpkg
        uses: lukka/run-vcpkg@v11
        with:
          vcpkgGitCommitId: "73af4de996897cb45dcf5034d16a551a3cf476f7"

      - name: Install LLVM/Clang
        shell: pwsh
        run: |
          Write-Host "=== Installing LLVM/Clang ==="
          choco install llvm -y
          $env:Path = [System.Environment]::GetEnvironmentVariable("Path","Machine") + ";" + [System.Environment]::GetEnvironmentVariable("Path","User")
          Write-Host "✓ LLVM/Clang installed"

      - name: Install Ninja
        shell: pwsh
        run: |
          Write-Host "=== Installing Ninja ==="
          choco install ninja -y
          Write-Host "✓ Ninja installed"

      - name: Download C++ build artifacts
        uses: actions/download-artifact@v4
        with:
          name: cpp-windows-build
          path: cpp/build

      - name: Verify C++ artifacts
        shell: pwsh
        run: |
          Write-Host "=== Downloaded C++ Artifacts ==="
          Get-ChildItem cpp/build -Recurse | Select-Object FullName, Length

          if (-not (Test-Path "cpp/build/falcon_core_cpp.dll")) {
            Write-Error "ERROR: falcon_core_cpp.dll not found!"
            Write-Host "`nSearching for DLL..."
            Get-ChildItem cpp/build -Recurse -Filter "*.dll" | Select-Object FullName
            exit 1
          }

          # Verify file integrity
          $dllFile = Get-Item "cpp/build/falcon_core_cpp.dll"
          Write-Host "`nfalcon_core_cpp.dll size: $($dllFile.Length) bytes"

          if ($dllFile.Length -lt 100KB) {
            Write-Error "ERROR: falcon_core_cpp.dll is too small ($($dllFile.Length) bytes). File may be corrupted."
            exit 1
          }

          # Try to load the DLL to verify it's valid
          Write-Host "`nVerifying DLL integrity..."
          try {
            [System.Reflection.Assembly]::LoadFile($dllFile.FullName) | Out-Null
            Write-Host "✓ DLL appears valid (loadable)"
          } catch {
            # This is expected for C++ DLLs, just checking it's not completely corrupted
            Write-Host "Note: DLL verification check completed (native DLL, not .NET)"
          }

          Write-Host "`n✓ C++ artifacts verified"

      - name: Copy C++ DLLs to predictable location
        shell: pwsh
        run: |
          Write-Host "=== Organizing C++ artifacts ==="

          # Ensure cpp/build exists and copy DLLs there
          New-Item -ItemType Directory -Force -Path "cpp/build" | Out-Null

          # Copy all DLLs to cpp/build root
          Get-ChildItem "cpp/build" -Recurse -Filter "*.dll" | ForEach-Object {
            $dest = "cpp/build/$($_.Name)"
            if ($_.FullName -ne (Resolve-Path $dest -ErrorAction SilentlyContinue)) {
              Copy-Item $_.FullName $dest -Force
              Write-Host "Copied: $($_.Name)"
            }
          }

          # Copy .lib files too
          Get-ChildItem "cpp/build" -Recurse -Filter "*.lib" | ForEach-Object {
            $dest = "cpp/build/$($_.Name)"
            if ($_.FullName -ne (Resolve-Path $dest -ErrorAction SilentlyContinue)) {
              Copy-Item $_.FullName $dest -Force
              Write-Host "Copied: $($_.Name)"
            }
          }

          Write-Host "`n=== cpp/build root contents ==="
          Get-ChildItem "cpp/build" -Filter "*.*" | Select-Object Name, Length

      - name: Configure CMake for C-API
        working-directory: c-api
        shell: pwsh
        run: |
          $env:Path = [System.Environment]::GetEnvironmentVariable("Path","Machine") + ";" + [System.Environment]::GetEnvironmentVariable("Path","User")

          Write-Host "=== CMake Configuration for C-API ==="
          cmake -B build `
            -S . `
            -G "Ninja" `
            -DCMAKE_C_COMPILER=clang-cl `
            -DCMAKE_CXX_COMPILER=clang-cl `
            -DCMAKE_TOOLCHAIN_FILE="${env:VCPKG_ROOT}/scripts/buildsystems/vcpkg.cmake" `
            -DVCPKG_MANIFEST_DIR="${env:GITHUB_WORKSPACE}/c-api" `
            -DVCPKG_INSTALLED_DIR="${env:GITHUB_WORKSPACE}/c-api/build/vcpkg_installed" `
            -DCMAKE_BUILD_TYPE=Release `
            -DFALCON_CORE_DEV=ON `
            -DUSE_VCPKG=ON `
            -DCORE_ROOT="${env:GITHUB_WORKSPACE}/cpp"

          if ($LASTEXITCODE -ne 0) {
            Write-Error "C-API CMake configuration failed!"
            exit $LASTEXITCODE
          }

          Write-Host "✓ C-API CMake configuration successful"

      - name: Build C-API library
        working-directory: c-api
        shell: pwsh
        run: |
          Write-Host "=== Building C-API with Ninja ==="
          ninja -C build -v

          if ($LASTEXITCODE -ne 0) {
            Write-Error "C-API build failed!"
            exit $LASTEXITCODE
          }

          Write-Host "✓ C-API build successful"

      - name: Manually copy C++ DLLs to C-API build directory
        shell: pwsh
        run: |
          Write-Host "=== Manually ensuring all DLLs are in c-api/build ==="

          # Copy all DLLs from cpp/build to c-api/build
          Get-ChildItem "cpp/build" -Filter "*.dll" | ForEach-Object {
            Copy-Item $_.FullName "c-api/build/" -Force
            Write-Host "Copied: $($_.Name) -> c-api/build/"
          }

          Write-Host "`n=== c-api/build DLL inventory ==="
          Get-ChildItem "c-api/build" -Filter "*.dll" | Select-Object Name, Length

      - name: Verify C-API build
        working-directory: c-api
        shell: pwsh
        run: |
          Write-Host "=== C-API Build Artifacts ==="
          Get-ChildItem -Path build -Include *.dll,*.lib,*.exe -Recurse | Select-Object FullName, Length

          $requiredFiles = @(
            "build/falcon_core_c_api.dll",
            "build/falcon_core_cpp.dll",
            "build/integration_serialize_connection_c.exe",
            "build/integration_deserialize_connection_c.exe"
          )

          $allFound = $true
          foreach ($file in $requiredFiles) {
            if (-not (Test-Path $file)) {
              Write-Error "ERROR: Required file not found: $file"
              $allFound = $false
            } else {
              $fileInfo = Get-Item $file
              Write-Host "[OK] $file ($($fileInfo.Length) bytes)"
            }
          }

          if (-not $allFound) {
            Write-Error "Missing required files!"
            exit 1
          }

          Write-Host "`n✓ C-API build verified"

      - name: Run C-API tests
        working-directory: c-api
        shell: pwsh
        run: |
          Write-Host "=== C-API Test Execution ==="

          $buildDir = (Resolve-Path "build").Path
          $cppBuildDir = (Resolve-Path "../cpp/build").Path

          # Add both build directories to PATH
          $env:PATH = "$buildDir;$cppBuildDir;$env:PATH"

          Write-Host "PATH includes:"
          Write-Host "  - $buildDir"
          Write-Host "  - $cppBuildDir"

          $testExe = Get-ChildItem -Path "build" -Filter "falcon_core_c_api_run_tests.exe" -Recurse | Select-Object -First 1

          if (-not $testExe) {
            Write-Error "Test executable not found!"
            exit 1
          }

          Write-Host "`nRunning C-API tests..."
          & ".\$($testExe.FullName.Replace("$PWD\", ''))" --gtest_color=yes --gtest_output=xml:test-results.xml
          $exitCode = $LASTEXITCODE

          if ($exitCode -ne 0) {
            Write-Error "Tests failed with exit code: $exitCode"
            exit $exitCode
          }

          Write-Host "`n✓ All C-API tests passed"

      - name: Run C-API integration tests (same platform)
        shell: pwsh
        run: |
          cd c-api/build
          .\integration_serialize_connection_c.exe --output capi_windows_local.json --name "CApiWindowsLocalTest" --type PlungerGate
          .\integration_deserialize_connection_c.exe --input capi_windows_local.json --name "CApiWindowsLocalTest" --type PlungerGate --verbose

      - name: Serialize for cross-platform test
        shell: pwsh
        run: |
          cd c-api/build
          .\integration_serialize_connection_c.exe --output capi_windows_cross.json --name "CApiWindowsToLinuxTest" --type Ohmic
          Get-Content capi_windows_cross.json

      - name: Upload cross-platform test artifact
        uses: actions/upload-artifact@v4
        with:
          name: capi-windows-serialized
          path: c-api/build/capi_windows_cross.json
          retention-days: 1

      - name: Setup tmate session on failure
        if: failure()
        uses: mxschmitt/action-tmate@v3
        timeout-minutes: 30
