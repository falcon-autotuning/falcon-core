name: Main Pipeline (CI + CD)

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  # Stage 1: Run full CI pipeline
  cpp-linux-ci:
    name: C++ Linux CI
    uses: ./.github/workflows/cpp-linux-ci.yml
    secrets: inherit

  cpp-windows-ci:
    name: C++ Windows CI
    uses: ./.github/workflows/cpp-windows-ci.yml
    secrets: inherit

  c-api-linux-ci:
    name: C-API Linux CI
    needs: [cpp-linux-ci]
    uses: ./.github/workflows/c-api-linux-ci.yml
    secrets: inherit

  c-api-windows-ci:
    name: C-API Windows CI
    needs: [cpp-windows-ci]
    uses: ./.github/workflows/c-api-windows-ci.yml
    secrets: inherit

  cross-platform-integration:
    name: Cross-Platform Integration
    needs: [cpp-linux-ci, cpp-windows-ci, c-api-linux-ci, c-api-windows-ci]
    uses: ./.github/workflows/cross-platform-integration.yml
    secrets: inherit

  # Stage 2: Build release artifacts (only if CI passes)
  cpp-linux-release:
    name: C++ Linux Release
    needs: [cross-platform-integration]
    uses: ./.github/workflows/cpp-linux-release.yml
    secrets: inherit

  cpp-windows-release:
    name: C++ Windows Release
    needs: [cross-platform-integration]
    uses: ./.github/workflows/cpp-windows-release.yml
    secrets: inherit

  c-api-linux-release:
    name: C-API Linux Release
    needs: [cpp-linux-release]
    uses: ./.github/workflows/c-api-linux-release.yml
    secrets: inherit

  c-api-windows-release:
    name: C-API Windows Release
    needs: [cpp-windows-release]
    uses: ./.github/workflows/c-api-windows-release.yml
    secrets: inherit

  # Stage 3: Create GitHub release
  create-release:
    name: Create GitHub Release
    needs:
      [
        cpp-linux-release,
        cpp-windows-release,
        c-api-linux-release,
        c-api-windows-release,
      ]
    uses: ./.github/workflows/create-release.yml
    permissions:
      contents: write
    secrets: inherit

  # Final summary
  pipeline-complete:
    name: Pipeline Complete
    needs: [create-release]
    runs-on: ubuntu-latest
    steps:
      - name: Success Summary
        run: |
          echo "=================================================="
          echo "FULL CI/CD PIPELINE COMPLETED SUCCESSFULLY!"
          echo "=================================================="
          echo ""
          echo "✅ CI Phase: All tests passed"
          echo "✅ CD Phase: All releases built"
          echo "✅ GitHub Release created"
          echo ""
          echo "=================================================="
