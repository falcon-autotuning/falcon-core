name: Main Pipeline (CI + CD)

on:
  push:
    branches: [main, dev]
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  linux-ci:
    name: Linux CI
    uses: ./.github/workflows/linux-ci.yml
    secrets: inherit

  windows-ci:
    name: Windows CI
    uses: ./.github/workflows/windows-ci.yml
    secrets: inherit

  cross-platform-integration:
    name: Cross-Platform Integration
    needs: [linux-ci, windows-ci]
    uses: ./.github/workflows/cross-platform-integration.yml
    secrets: inherit
