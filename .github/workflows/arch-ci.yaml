name: Arch Linux CI

on:
  push:
    branches: [new-dev]
  pull_request:
    branches: [new-dev]

jobs:
  build-and-test-arch:
    runs-on: ubuntu-latest
    container:
      image: archlinux:latest
    steps:
      - uses: actions/checkout@v4

      - name: Cache pacman packages
        uses: actions/cache@v4
        with:
          path: /var/cache/pacman/pkg
          key: ${{ runner.os }}-pacman-${{ hashFiles('**/PKGBUILD') }}
          restore-keys: |
            ${{ runner.os }}-pacman-
      - name: Cache AUR packages
        uses: actions/cache@v4
        with:
          path: |
            packaging/highfive/*.pkg.tar.zst
            packaging/exprtk/*.pkg.tar.zst
          key: ${{ runner.os }}-aur-${{ hashFiles('packaging/highfive/PKGBUILD', 'packaging/exprtk/PKGBUILD') }}
          restore-keys: |
            ${{ runner.os }}-aur-
      - name: Install dependencies
        run: |
          pacman -Syu --noconfirm
          pacman -S --noconfirm base-devel git openssh cereal hdf5 boost bzip2 expat nlohmann-json openssl python sqlite yaml-cpp zlib ninja llvm ccache
      - name: Set clang as default compiler for makepkg
        run: |
          grep -q '^CC=' /etc/makepkg.conf && \
          sed -i 's|^CC=.*|CC=/usr/bin/clang|' /etc/makepkg.conf || \
          echo 'CC=/usr/bin/clang' >> /etc/makepkg.conf

          grep -q '^CXX=' /etc/makepkg.conf && \
          sed -i 's|^CXX=.*|CXX=/usr/bin/clang++|' /etc/makepkg.conf || \
          echo 'CXX=/usr/bin/clang++' >> /etc/makepkg.conf

          grep -E '^CC=|^CXX=' /etc/makepkg.conf
      - name: Cache ccache
        uses: actions/cache@v4
        with:
          path: ~/.ccache
          key: ${{ runner.os }}-ccache-${{ github.ref }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-ccache-${{ github.ref }}-
            ${{ runner.os }}-ccache-
      - name: Install AUR packages
        run: |
          mkdir -p packaging
          if [ ! -d packaging/highfive ]; then git clone https://aur.archlinux.org/highfive.git packaging/highfive; fi
          if [ ! -d packaging/exprtk ]; then git clone https://aur.archlinux.org/exprtk.git packaging/exprtk; fi
          cd packaging/highfive
          if ls *.pkg.tar.zst 1> /dev/null 2>&1; then
            sudo pacman -U --noconfirm ./*.pkg.tar.zst
          else
            makepkg -si --noconfirm --needed
          fi
          cd ../exprtk
          if ls *.pkg.tar.zst 1> /dev/null 2>&1; then
            sudo pacman -U --noconfirm ./*.pkg.tar.zst
          else
            makepkg -si --noconfirm --needed
          fi
      - name: Build and test PKGBUILDs
        run: |
          cd packaging/xtl
          makepkg -si --noconfirm --syncdeps --cleanbuild
          cd ../xsimd
          makepkg -si --noconfirm --syncdeps --cleanbuild
          cd ../xtensor
          makepkg -si --noconfirm --syncdeps --cleanbuild
          cd ../xtensor-io
          makepkg -si --noconfirm --syncdeps --cleanbuild
      - name: Build falcon-core-cpp-dev
        run: |
          cd cpp
          CC=clang CXX=clang++ USE_VCPKG=0 make build-dev

      - name: Test falcon-core-cpp-dev
        run: |
          cd cpp
          make run-all-tests
          mkdir -p coverage
          make coverage-overview > coverage/falcon-core-cpp.txt

      - name: Install falcon-core-cpp-dev artifacts
        run: |
          install -Dm755 cpp/build/libfalcon_core_cpp.so /usr/lib/libfalcon_core_cpp.so
          install -d /usr/include/falcon-core-cpp-dev
          cp -r cpp/include/falcon_core/* /usr/include/falcon-core-cpp-dev/
          install -d /usr/share/falcon-core-cpp-dev/coverage
          cp -r cpp/build/coverage/* /usr/share/falcon-core-cpp-dev/coverage/

      - name: Build falcon-core-c-api-dev
        run: |
          cd c-api
          CC=clang CXX=clang++ USE_VCPKG=0 make build-dev

      - name: Test falcon-core-c-api-dev
        run: |
          cd c-api
          make run-all-tests
          mkdir -p coverage
          make coverage-overview > coverage/falcon-core-c-api.txt

      - name: Install falcon-core-c-api-dev artifacts
        run: |
          install -Dm755 cpp/build/libfalcon_core_c_api.so /usr/lib/libfalcon_core_c_api.so
          install -d /usr/include/falcon-core-c-api-dev
          cp -r c-api/include/falcon_core/* /usr/include/falcon-core-c-api-dev/
          install -d /usr/share/falcon-core-c-api-dev/coverage
          cp -r c-api/build/coverage/* /usr/share/falcon-core-c-api-dev/coverage/
      - name: Upload coverage reports
        uses: actions/upload-artifact@v4
        with:
          name: coverage-reports
          path: |
            cpp/coverage/falcon-core-cpp.txt
            c-api/coverage/falcon-core-c-api.txt
