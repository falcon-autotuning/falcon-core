name: Arch Linux CI

on:
  push:
    branches: [none]
  pull_request:
    branches: [none]

jobs:
  build-and-test-arch:
    runs-on: ubuntu-latest
    container:
      image: archlinux:latest
    steps:
      - uses: actions/checkout@v4

      - name: Create build user
        run: |
          useradd -m builduser
          echo "builduser ALL=(ALL) NOPASSWD: ALL" >> /etc/sudoers
          chown -R builduser:builduser .

      - name: Cache pacman packages
        uses: actions/cache@v4
        with:
          path: /var/cache/pacman/pkg
          key: ${{ runner.os }}-pacman-${{ github.ref }}
          restore-keys: |
            ${{ runner.os }}-pacman-

      - name: Cache AUR packages
        uses: actions/cache@v4
        with:
          path: |
            packaging/highfive/*.pkg.tar.zst
            packaging/exprtk/*.pkg.tar.zst
          key: ${{ runner.os }}-aur-${{ github.ref }}
          restore-keys: |
            ${{ runner.os }}-aur-

      - name: Install dependencies
        run: |
          pacman -Syu --noconfirm
          pacman -S --noconfirm base-devel git openssh cereal hdf5 boost bzip2 expat nlohmann-json openssl python sqlite yaml-cpp zlib ninja llvm ccache clang gtest glibc cmake lld
      - name: Debug pthread and toolchain
        run: |
          echo "== glibc and pthread files =="
          pacman -Qi glibc || true
          ls -l /usr/lib/libpthread* || true
          ls -l /usr/include/pthread.h || true

          echo "== Compiler versions =="
          clang --version
          clang++ --version
          gcc --version
          g++ --version

          echo "== Clang test compile =="
          echo '#include <pthread.h>
          void* f(void*) { return nullptr; }
          int main() { pthread_t t; pthread_create(&t, 0, f, 0); pthread_join(t, 0); return 0; }' > test.cpp
          clang++ test.cpp -pthread -v || echo "Clang failed"

          echo "== GCC test compile =="
          g++ test.cpp -pthread -v || echo "GCC failed"

          echo "== ldd on clang =="
          ldd /usr/bin/clang || true

          echo "== ldd on clang++ =="
          ldd /usr/bin/clang++ || true

          echo "== Environment =="
          env
      - name: Set clang as default compiler for makepkg
        run: |
          grep -q '^CC=' /etc/makepkg.conf && \
          sed -i 's|^CC=.*|CC=/usr/bin/clang|' /etc/makepkg.conf || \
          echo 'CC=/usr/bin/clang' >> /etc/makepkg.conf

          grep -q '^CXX=' /etc/makepkg.conf && \
          sed -i 's|^CXX=.*|CXX=/usr/bin/clang++|' /etc/makepkg.conf || \
          echo 'CXX=/usr/bin/clang++' >> /etc/makepkg.conf

          grep -E '^CC=|^CXX=' /etc/makepkg.conf
      - name: Cache ccache
        uses: actions/cache@v4
        with:
          path: ~/.ccache
          key: ${{ runner.os }}-ccache-${{ github.ref }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-ccache-${{ github.ref }}-
            ${{ runner.os }}-ccache-
      - name: Minimal pthread CMake test
        run: |
          mkdir cmake-pthread-test
          cd cmake-pthread-test
          # Write CMakeLists.txt
          cat > CMakeLists.txt <<EOF
          cmake_minimum_required(VERSION 3.20)
          project(PthreadTest LANGUAGES CXX)
          find_package(Threads REQUIRED)
          add_executable(pthread_test main.cpp)
          target_link_libraries(pthread_test PRIVATE Threads::Threads)
          EOF
          # Write main.cpp
          cat > main.cpp <<EOF
          #include <pthread.h>
          #include <iostream>
          void* f(void*) { return nullptr; }
          int main() {
              pthread_t t;
              pthread_create(&t, 0, f, 0);
              pthread_join(t, 0);
              std::cout << "Pthread test ran\\n";
              return 0;
          }
          EOF
          # Build and run
          cmake -S . -B build -DCMAKE_CXX_COMPILER=clang++ -DCMAKE_C_COMPILER=clang
          cmake --build build
          ./build/pthread_test
      - name: Install AUR packages
        run: |
          mkdir -p packaging
          chown builduser:builduser packaging
          runuser -u builduser -- env PATH=/usr/bin:$PATH bash -c "
              if [ ! -d packaging/exprtk ]; then git clone https://aur.archlinux.org/exprtk.git packaging/exprtk; fi
              cd packaging/exprtk
              if ls *.pkg.tar.zst 1> /dev/null 2>&1; then
                sudo pacman -U --noconfirm ./*.pkg.tar.zst
              else
                PKGDEST="$(pwd)" makepkg -si --noconfirm --needed
              fi
            "
      - name: Build and test PKGBUILDs
        run: |
          runuser -u builduser -- env PATH=/usr/bin:$PATH bash -c "
            cd packaging/xtl
            makepkg -si --noconfirm --syncdeps --cleanbuild
            cd ../xsimd
            makepkg -si --noconfirm --syncdeps --cleanbuild
            cd ../xtensor
            makepkg -si --noconfirm --syncdeps --cleanbuild
            cd ../xtensor-io
            makepkg -si --noconfirm --syncdeps --cleanbuild
            cd ../highfive
            makepkg -si --noconfirm --syncdeps --cleanbuild
          "
      - name: Build falcon-core-cpp-dev
        run: |
          cd cpp
          CC=/usr/bin/clang CXX=/usr/bin/clang++ USE_VCPKG=0 make build-dev

      - name: Test falcon-core-cpp-dev
        run: |
          cd cpp
          make run-all-tests
          mkdir -p coverage
          make coverage-overview > coverage/falcon-core-cpp.txt

      - name: Install falcon-core-cpp-dev artifacts
        run: |
          install -Dm755 cpp/build/libfalcon_core_cpp.so /usr/lib/libfalcon_core_cpp.so
          install -d /usr/include/falcon-core-cpp-dev
          cp -r cpp/include/falcon_core/* /usr/include/falcon-core-cpp-dev/
          install -d /usr/share/falcon-core-cpp-dev/coverage
          cp -r cpp/coverage/* /usr/share/falcon-core-cpp-dev/coverage/

      - name: Build falcon-core-c-api-dev
        run: |
          cd c-api
          CC=/usr/bin/clang CXX=/usr/bin/clang++ USE_VCPKG=0 make build-dev

      - name: Test falcon-core-c-api-dev
        run: |
          cd c-api
          make run-all-tests
          mkdir -p coverage
          make coverage-overview > coverage/falcon-core-c-api.txt

      - name: Install falcon-core-c-api-dev artifacts
        run: |
          install -Dm755 c-api/build/libfalcon_core_c_api.so /usr/lib/libfalcon_core_c_api.so
          install -d /usr/include/falcon-core-c-api-dev
          cp -r c-api/include/falcon_core/* /usr/include/falcon-core-c-api-dev/
          install -d /usr/share/falcon-core-c-api-dev/coverage
          cp -r c-api/coverage/* /usr/share/falcon-core-c-api-dev/coverage/
      - name: Upload coverage reports
        uses: actions/upload-artifact@v4
        with:
          name: coverage-reports
          path: |
            cpp/coverage/*
            c-api/coverage/*

      - name: Check cpp coverage report
        run: |
          report="cpp/coverage/falcon-core-cpp.txt"

          # Check for PASSED line
          if ! grep -qE '\[  PASSED  \] [0-9]+ tests\.' "$report"; then
            echo "❌ PASSED line not found in $report"
            exit 1
          fi

          # Extract the TOTAL line
          total_line=$(grep '^TOTAL' "$report")
          if [ -z "$total_line" ]; then
            echo "❌ TOTAL line not found in $report"
            exit 1
          fi

          # Extract all percentages from the TOTAL line
          percentages=($(echo "$total_line" | grep -oE '[0-9]+\.[0-9]+%'))

          # Check each percentage is > 90%
          for pct in "${percentages[@]}"; do
            pct_num=$(echo "$pct" | tr -d '%')
            pct_int=${pct_num%.*}
            if (( $(echo "$pct_num < 85.0" | bc -l) )); then
              echo "❌ Coverage percent $pct is less than 90%"
              exit 1
            fi
          done

          echo "✅ All cpp coverage checks passed."
        shell: bash

      - name: Check c-api coverage report
        run: |
          report="c-api/coverage/falcon-core-c-api.txt"

          # Check for PASSED line
          if ! grep -qE '\[  PASSED  \] [0-9]+ tests\.' "$report"; then
            echo "❌ PASSED line not found in $report"
            exit 1
          fi

          # Extract the TOTAL line
          total_line=$(grep '^TOTAL' "$report")
          if [ -z "$total_line" ]; then
            echo "❌ TOTAL line not found in $report"
            exit 1
          fi

          # Extract all percentages from the TOTAL line
          percentages=($(echo "$total_line" | grep -oE '[0-9]+\.[0-9]+%'))

          # Check each percentage is > 90%
          for pct in "${percentages[@]}"; do
            pct_num=$(echo "$pct" | tr -d '%')
            pct_int=${pct_num%.*}
            if (( $(echo "$pct_num < 90.0" | bc -l) )); then
              echo "❌ Coverage percent $pct is less than 90%"
              exit 1
            fi
          done

          echo "✅ All c-api coverage checks passed."
        shell: bash

      - name: Start tmate session for debugging on failure
        if: ${{ failure() }}
        run: |
          set -euo pipefail
          # tmate should already be installed via pacman above; ensure it's present
          if ! command -v tmate >/dev/null 2>&1; then
            pacman -S --noconfirm tmate || true
          fi
          # Start a detached tmate session and print connection info
          TMATE_SOCK=/tmp/tmate.sock
          tmate -S "${TMATE_SOCK}" new-session -d
          tmate -S "${TMATE_SOCK}" wait tmate-ready
          echo "===== TMATE CONNECTION INFO ====="
          tmate -S "${TMATE_SOCK}" display -p '#{tmate_ssh}'
          tmate -S "${TMATE_SOCK}" display -p '#{tmate_web}'
          echo "================================="
          # Keep session alive so you can connect; job will time out eventually according to workflow/job timeout
          # Sleep in a loop to be robust to signals
          while true; do sleep 60; done
