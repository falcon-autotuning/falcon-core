name: Arch Linux CI

on:
  push:
    branches: [new-dev]
  pull_request:
    branches: [new-dev]

jobs:
  build-and-test-arch:
    runs-on: ubuntu-latest
    container:
      image: archlinux:latest
    steps:
      - uses: actions/checkout@v4

      - name: Create build user
        run: |
          useradd -m builduser
          echo "builduser ALL=(ALL) NOPASSWD: ALL" >> /etc/sudoers
          chown -R builduser:builduser .
      - name: Install dependencies and AUR packages
        run: |
          pacman -Syu --noconfirm
          pacman -S --noconfirm base-devel git openssh cereal hdf5 boost bzip2 expat nlohmann-json openssl python sqlite yaml-cpp zlib ninja llvm ccache
          runuser -u builduser -- bash -c "
            git clone https://aur.archlinux.org/highfive.git
            cd highfive
            makepkg -si --noconfirm --needed
            cd ..
            git clone https://aur.archlinux.org/exprtk.git
            cd exprtk
            makepkg -si --noconfirm --needed
            cd ..
          "

      # - name: Setup SSH for builduser
      #   run: |
      #     install -d -m 700 /home/builduser/.ssh
      #     printf "%s" "${{ secrets.FALCON_SSH_KEY }}" > /home/builduser/.ssh/id_ed25519
      #     chmod 600 /home/builduser/.ssh/id_ed25519
      #     ssh-keyscan github.com >> /home/builduser/.ssh/known_hosts
      #     echo -e "Host github.com\n  IdentityFile ~/.ssh/id_ed25519\n  IdentitiesOnly yes" > /home/builduser/.ssh/config
      #     chmod 600 /home/builduser/.ssh/config
      #     chown -R builduser:builduser /home/builduser/.ssh
      #     head -5 /home/builduser/.ssh/id_ed25519
      #     tail -5 /home/builduser/.ssh/id_ed25519
      #     runuser -u builduser -- ssh -vT git@github.com || true
      - name: Cache ccache
        uses: actions/cache@v4
        with:
          path: ~/.ccache
          key: ${{ runner.os }}-ccache-${{ github.ref }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-ccache-${{ github.ref }}-
            ${{ runner.os }}-ccache-
      - name: Build and test PKGBUILDs
        run: |
          runuser -u builduser -- bash -c "
            cd packaging/xtl
            makepkg -si --noconfirm --syncdeps --cleanbuild
            cd ../xsimd
            makepkg -si --noconfirm --syncdeps --cleanbuild
            cd ../xtensor
            makepkg -si --noconfirm --syncdeps --cleanbuild
            cd ../xtensor-io
            makepkg -si --noconfirm --syncdeps --cleanbuild
          "
      - name: Build falcon-core-cpp-dev
        env:
          CC: /usr/bin/clang
          CXX: /usr/bin/clang++
        run: |
          cd cpp
          make build-dev USE_VCPKG=0

      - name: Test falcon-core-cpp-dev
        env:
          CC: /usr/bin/clang
          CXX: /usr/bin/clang++
        run: |
          cd cpp
          make run-all-tests
          mkdir -p coverage
          make coverage-overview > coverage/falcon-core-cpp.txt

      - name: Install falcon-core-cpp-dev artifacts
        env:
          CC: /usr/bin/clang
          CXX: /usr/bin/clang++
        run: |
          install -Dm755 cpp/build/libfalcon_core_cpp.so /usr/lib/libfalcon_core_cpp.so
          install -d /usr/include/falcon-core-cpp-dev
          cp -r cpp/include/falcon_core/* /usr/include/falcon-core-cpp-dev/
          install -d /usr/share/falcon-core-cpp-dev/coverage
          cp -r cpp/build/coverage/* /usr/share/falcon-core-cpp-dev/coverage/
      - name: Build falcon-core-c-api-dev
        env:
          CC: /usr/bin/clang
          CXX: /usr/bin/clang++
        run: |
          cd c-api
          make build-dev USE_VCPKG=0

      - name: Test falcon-core-c-api-dev
        env:
          CC: /usr/bin/clang
          CXX: /usr/bin/clang++
        run: |
          cd c-api
          make run-all-tests
          mkdir -p coverage
          make coverage-overview > coverage/falcon-core-c-api.txt

      - name: Install falcon-core-c-api-dev artifacts
        env:
          CC: /usr/bin/clang
          CXX: /usr/bin/clang++
        run: |
          install -Dm755 cpp/build/libfalcon_core_c_api.so /usr/lib/libfalcon_core_c_api.so
          install -d /usr/include/falcon-core-c-api-dev
          cp -r c-api/include/falcon_core/* /usr/include/falcon-core-c-api-dev/
          install -d /usr/share/falcon-core-c-api-dev/coverage
          cp -r c-api/build/coverage/* /usr/share/falcon-core-c-api-dev/coverage/
      - name: Upload coverage reports
        uses: actions/upload-artifact@v4
        with:
          name: coverage-reports
          path: |
            cpp/coverage/falcon-core-cpp.txt
            c-api/coverage/falcon-core-c-api.txt
