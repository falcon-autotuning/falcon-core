name: Fedora CI

on:
  push:
    branches: [main, new-dev]
  pull_request:
    branches: [main, new-dev]

jobs:
  build-and-test-fedora:
    runs-on: ubuntu-latest
    container:
      image: fedora:latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          dnf install -y rpm-build ninja-build clang ccache python3 cmake boost-devel hdf5-devel yaml-cpp-devel

      - name: Prepare RPM build dirs
        run: |
          mkdir -p ~/rpmbuild/SPECS ~/rpmbuild/SOURCES

      - name: Build and install xtl
        run: |
          cp packaging/specs/xtl.spec ~/rpmbuild/SPECS/
          curl -L -o ~/rpmbuild/SOURCES/xtl-0.7.5.tar.gz https://github.com/xtensor-stack/xtl/archive/refs/tags/0.7.5.tar.gz
          rpmbuild -ba ~/rpmbuild/SPECS/xtl.spec
          dnf install -y ~/rpmbuild/RPMS/*/xtl-*.rpm

      - name: Build and install xsimd
        run: |
          cp packaging/specs/xsimd.spec ~/rpmbuild/SPECS/
          curl -L -o ~/rpmbuild/SOURCES/xsimd-10.0.0.tar.gz https://github.com/xtensor-stack/xsimd/archive/refs/tags/10.0.0.tar.gz
          rpmbuild -ba ~/rpmbuild/SPECS/xsimd.spec
          dnf install -y ~/rpmbuild/RPMS/*/xsimd-*.rpm

      - name: Build and install xtensor
        run: |
          cp packaging/specs/xtensor.spec ~/rpmbuild/SPECS/
          curl -L -o ~/rpmbuild/SOURCES/xtensor-0.25.0.tar.gz https://github.com/xtensor-stack/xtensor/archive/refs/tags/0.25.0.tar.gz
          rpmbuild -ba ~/rpmbuild/SPECS/xtensor.spec
          dnf install -y ~/rpmbuild/RPMS/*/xtensor-*.rpm

      - name: Build and install xtensor-io
        run: |
          cp packaging/specs/xtensor-io.spec ~/rpmbuild/SPECS/
          curl -L -o ~/rpmbuild/SOURCES/xtensor-io-0.13.0.tar.gz https://github.com/xtensor-stack/xtensor-io/archive/refs/tags/0.13.0.tar.gz
          rpmbuild -ba ~/rpmbuild/SPECS/xtensor-io.spec
          dnf install -y ~/rpmbuild/RPMS/*/xtensor-io-*.rpm

      - name: Build and install falcon-core-cpp-dev
        run: |
          cp packaging/specs/falcon-core-cpp-dev.spec ~/rpmbuild/SPECS/
          # Assumes your source is in the repo root and the spec expects falcon-core-cpp-dev-1.0.0/
          tar czf ~/rpmbuild/SOURCES/falcon-core-cpp-dev-1.0.0.tar.gz --transform 's,^.,falcon-core-cpp-dev-1.0.0,' .
          rpmbuild -ba ~/rpmbuild/SPECS/falcon-core-cpp-dev.spec
          dnf install -y ~/rpmbuild/RPMS/*/falcon-core-cpp-dev-*.rpm

      - name: Upload coverage reports
        uses: actions/upload-artifact@v4
        with:
          name: coverage-reports
          path: |
            cpp/cpp-coverage-report.txt
            c-api/c-api-coverage-report.txt
