name: Fedora CI

on:
  push:
    branches: [main, new-dev]
  pull_request:
    branches: [main, new-dev]

jobs:
  build-and-test-fedora:
    runs-on: ubuntu-latest
    container:
      image: fedora:latest
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          dnf install -y rpm-build ninja-build clang ccache python3 cmake boost-devel hdf5-devel yaml-cpp-devel xtensor-devel xtl-devel
      - name: Build and install xtl
        run: |
          mkdir -p ~/rpmbuild/SPECS ~/rpmbuild/SOURCES
          cp packaging/specs/xtl.spec ~/rpmbuild/SPECS/
          tar czf ~/rpmbuild/SOURCES/xtl-<version>.tar.gz -C path/to/xtl-src xtl-<version>
          rpmbuild -ba ~/rpmbuild/SPECS/xtl.spec
          dnf install -y ~/rpmbuild/RPMS/noarch/xtl-*.rpm

      - name: Build and install xsimd
        run: |
          cp packaging/specs/xsimd.spec ~/rpmbuild/SPECS/
          tar czf ~/rpmbuild/SOURCES/xsimd-<version>.tar.gz -C path/to/xsimd-src xsimd-<version>
          rpmbuild -ba ~/rpmbuild/SPECS/xsimd.spec
          dnf install -y ~/rpmbuild/RPMS/noarch/xsimd-*.rpm

      - name: Build and install xtensor
        run: |
          cp packaging/specs/xtensor.spec ~/rpmbuild/SPECS/
          tar czf ~/rpmbuild/SOURCES/xtensor-<version>.tar.gz -C path/to/xtensor-src xtensor-<version>
          rpmbuild -ba ~/rpmbuild/SPECS/xtensor.spec
          dnf install -y ~/rpmbuild/RPMS/noarch/xtensor-*.rpm

      - name: Build and install xtensor-io
        run: |
          cp packaging/specs/xtensor-io.spec ~/rpmbuild/SPECS/
          tar czf ~/rpmbuild/SOURCES/xtensor-io-<version>.tar.gz -C path/to/xtensor-io-src xtensor-io-<version>
          rpmbuild -ba ~/rpmbuild/SPECS/xtensor-io.spec
          dnf install -y ~/rpmbuild/RPMS/noarch/xtensor-io-*.rpm
      - name: Build and install falcon-core-cpp-dev
        run: |
          cp packaging/specs/falcon-core-cpp-dev.spec ~/rpmbuild/SPECS/
          tar czf ~/rpmbuild/SOURCES/falcon-core-cpp-dev-1.0.0.tar.gz -C path/to/falcon-core-cpp-dev-src falcon-core-cpp-dev-1.0.0
          rpmbuild -ba ~/rpmbuild/SPECS/falcon-core-cpp-dev.spec
          dnf install -y ~/rpmbuild/RPMS/x86_64/falcon-core-cpp-dev-*.rpm
      - name: Build and install falcon-core-cpp
        run: |
          cp packaging/specs/falcon-core-cpp.spec ~/rpmbuild/SPECS/
          tar czf ~/rpmbuild/SOURCES/falcon-core-cpp.1.0.0.tar.gz -C path/to/falcon-core-cpp-src falcon-core-cpp-1.0.0
          rpmbuild -ba ~/rpmbuild/SPECS/falcon-core-cpp.spec
          dnf install -y ~/rpmbuild/RPMS/x86_64/falcon-core-cpp-*.rpm
      - name: Upload coverage reports
        uses: actions/upload-artifact@v4
        with:
          name: coverage-reports
          path: |
            cpp/cpp-coverage-report.txt
            c-api/c-api-coverage-report.txt
