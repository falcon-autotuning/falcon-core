name: Fedora CI

on:
  push:
    branches: [main, new-dev]
  pull_request:
    branches: [main, new-dev]

jobs:
  build-and-test-fedora:
    runs-on: ubuntu-latest
    container:
      image: fedora:latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          dnf install -y rpm-build ninja-build clang ccache python3 cmake boost-devel hdf5-devel yaml-cpp-devel gcovr openssl-devel sqlite-devel

      - name: Prepare RPM build dirs
        run: |
          mkdir -p ~/rpmbuild/SPECS ~/rpmbuild/SOURCES

      - name: Build and install xtl
        run: |
          cp packaging/specs/xtl.spec ~/rpmbuild/SPECS/
          curl -L -o ~/rpmbuild/SOURCES/xtl-0.7.5.tar.gz https://github.com/xtensor-stack/xtl/archive/refs/tags/0.7.5.tar.gz
          rpmbuild -ba ~/rpmbuild/SPECS/xtl.spec
          dnf install -y ~/rpmbuild/RPMS/*/xtl-*.rpm

      - name: Build and install xsimd
        run: |
          cp packaging/specs/xsimd.spec ~/rpmbuild/SPECS/
          curl -L -o ~/rpmbuild/SOURCES/xsimd-10.0.0.tar.gz https://github.com/xtensor-stack/xsimd/archive/refs/tags/10.0.0.tar.gz
          rpmbuild -ba ~/rpmbuild/SPECS/xsimd.spec
          dnf install -y ~/rpmbuild/RPMS/*/xsimd-*.rpm

      - name: Build and install xtensor
        run: |
          cp packaging/specs/xtensor.spec ~/rpmbuild/SPECS/
          curl -L -o ~/rpmbuild/SOURCES/xtensor-0.25.0.tar.gz https://github.com/xtensor-stack/xtensor/archive/refs/tags/0.25.0.tar.gz
          rpmbuild -ba ~/rpmbuild/SPECS/xtensor.spec
          dnf install -y ~/rpmbuild/RPMS/*/xtensor-*.rpm

      - name: Build and install xtensor-io
        run: |
          cp packaging/specs/xtensor-io.spec ~/rpmbuild/SPECS/
          curl -L -o ~/rpmbuild/SOURCES/xtensor-io-0.13.0.tar.gz https://github.com/xtensor-stack/xtensor-io/archive/refs/tags/0.13.0.tar.gz
          rpmbuild -ba ~/rpmbuild/SPECS/xtensor-io.spec
          dnf install -y ~/rpmbuild/RPMS/*/xtensor-io-*.rpm

      - name: Build and install exprtk
        run: |
          cp packaging/specs/exprtk.spec ~/rpmbuild/SPECS/
          curl -L -o ~/rpmbuild/SOURCES/exprtk-0.0.2.tar.gz https://github.com/ArashPartow/exprtk/archive/refs/tags/0.0.2.tar.gz
          rpmbuild -ba ~/rpmbuild/SPECS/exprtk.spec
          dnf install -y ~/rpmbuild/RPMS/*/exprtk-*.rpm
          ln -s /usr/include/exprtk/exprtk.hpp /usr/include/exprtk.hpp

      - name: Build and install highfive
        run: |
          set -e
          dnf install -y cmake gcc-c++ make bzip2 tar hdf5-devel
          mkdir -p ~/rpmbuild/SPECS ~/rpmbuild/SOURCES
          cp packaging/specs/highfive.spec ~/rpmbuild/SPECS/
          curl -L -o ~/rpmbuild/SOURCES/highfive-3.1.1.tar.gz https://github.com/highfive-devs/highfive/archive/v3.1.1.tar.gz
          rpmbuild --define "_topdir $HOME/rpmbuild" -ba ~/rpmbuild/SPECS/highfive.spec
          rpmfile=$(find ~/rpmbuild/RPMS -type f -name "highfive-*.rpm" | head -n1)
          if [ -n "$rpmfile" ]; then
            dnf install -y "$rpmfile"
          else
            echo "No RPM produced for highfive; see rpmbuild output above" >&2
            exit 1
          fi
      - name: Build and install boost (filesystem, system, uuid)
        run: |
          set -e
          # Install build deps needed for bootstrapping and building Boost
          dnf install -y gcc-c++ gcc make python3 bzip2 tar perl which
          mkdir -p ~/rpmbuild/SPECS ~/rpmbuild/SOURCES
          cp packaging/specs/boost.spec ~/rpmbuild/SPECS/

          curl -L -o ~/rpmbuild/SOURCES/boost-1.88.0.tar.gz https://github.com/boostorg/boost/releases/download/boost-1.88.0/boost-1.88.0-b2-nodocs.tar.gz
          echo "HOME=$HOME USER=$USER"
          ls -l ~/rpmbuild/SPECS ~/rpmbuild/SOURCES
          rpmbuild --define "_topdir $HOME/rpmbuild" -ba ~/rpmbuild/SPECS/boost.spec
          RPMS=$(find ~/rpmbuild/RPMS -type f \( -name "boost-*.rpm" -o -name "boost-filesystem-*.rpm" -o -name "boost-system-*.rpm" -o -name "boost-uuid-*.rpm" \) )
          if [ -n "$RPMS" ]; then
            dnf install -y $RPMS
          else
            echo "No Boost RPMs produced; check rpmbuild output" >&2
            exit 1
          fi

      - name: Build and install falcon-core-cpp-dev
        run: |
          cp packaging/specs/falcon-core-cpp-dev.spec ~/rpmbuild/SPECS/
          # Assumes your source is in the repo root and the spec expects falcon-core-cpp-dev-1.0.0/
          tar czf ~/rpmbuild/SOURCES/falcon-core-cpp-dev-1.0.0.tar.gz --transform 's,^.,falcon-core-cpp-dev-1.0.0,' .
          dnf install -y cereal-devel
          dnf install -y hdf5 hdf5-devel
          dnf install -y gtest gtest-devel
          # dnf install -y boost boost-devel
          ln -s /usr/include/boost/uuid/uuid.hpp /usr/include/boost/uuid.hpp
          rpmbuild -ba ~/rpmbuild/SPECS/falcon-core-cpp-dev.spec
          dnf install -y ~/rpmbuild/RPMS/*/falcon-core-cpp-dev-*.rpm

      - name: Build and install falcon-core-c-api-dev
        run: |
          cp packaging/specs/falcon-core-c-api-dev.spec ~/rpmbuild/SPECS/
          # Assumes your source is in the repo root and the spec expects falcon-core-cpp-dev-1.0.0/
          tar czf ~/rpmbuild/SOURCES/falcon-core-c-api-dev-1.0.0.tar.gz --transform 's,^.,falcon-core-c-api-dev-1.0.0,' .
          rpmbuild -ba ~/rpmbuild/SPECS/falcon-core-c-api-dev.spec
          dnf install -y ~/rpmbuild/RPMS/*/falcon-core-c-api-dev-*.rpm

      - name: Upload coverage reports
        uses: actions/upload-artifact@v4
        with:
          name: coverage-reports
          path: |
            cpp/cpp-coverage-report.txt
            c-api/c-api-coverage-report.txt
