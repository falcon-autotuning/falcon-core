name: Release

on:
  push:
    tags:
      - "v*" # Only run on version tags

jobs:
  build-linux:
    runs-on: ubuntu-latest
    container:
      image: archlinux:latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          pacman -Syu --noconfirm
          pacman -S --noconfirm base-devel git clang ninja cmake

      - name: Build falcon-core-cpp.so
        run: |
          cd cpp
          CC=clang CXX=clang++ USE_VCPKG=0 make build-dev

      - name: Build falcon-core-c-api.so
        run: |
          cd c-api
          CC=clang CXX=clang++ USE_VCPKG=0 make build-dev

      - name: Copy Linux artifacts
        run: |
          mkdir -p dist/linux
          cp cpp/build/libfalcon_core_cpp.so dist/linux/
          cp c-api/build/libfalcon_core_c_api.so dist/linux/

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-artifacts
          path: dist/linux/*

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup vcpkg
        uses: lukka/run-vcpkg@v11

      - name: Build falcon-core-cpp.dll
        run: |
          cd cpp
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_C_COMPILER=clang -DCMAKE_CXX_COMPILER=clang++ -DUSE_VCPKG=1
          cmake --build build --config Release

      - name: Build falcon-core-c-api.dll
        run: |
          cd c-api
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_C_COMPILER=clang -DCMAKE_CXX_COMPILER=clang++ -DUSE_VCPKG=1 -DCORE_ROOT=../cpp
          cmake --build build --config Release

      - name: Copy Windows artifacts
        run: |
          mkdir dist
          cp cpp/build/Release/falcon_core_cpp.dll dist/ || cp cpp/build/falcon_core_cpp.dll dist/
          cp c-api/build/Release/falcon_core_c_api.dll dist/ || cp c-api/build/falcon_core_c_api.dll dist/
          # Optionally copy .lib files if needed
          cp cpp/build/Release/falcon_core_cpp.lib dist/ || true
          cp c-api/build/Release/falcon_core_c_api.lib dist/ || true

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-artifacts
          path: dist/*

  package-headers-and-zip:
    runs-on: ubuntu-latest
    needs: [build-linux, build-windows]
    steps:
      - uses: actions/checkout@v4

      - name: Download Linux artifacts
        uses: actions/download-artifact@v4
        with:
          name: linux-artifacts
          path: release/linux

      - name: Download Windows artifacts
        uses: actions/download-artifact@v4
        with:
          name: windows-artifacts
          path: release/windows

      - name: Package headers
        run: |
          mkdir -p release/headers/cpp
          mkdir -p release/headers/c-api
          cp -r cpp/include/falcon_core release/headers/cpp/
          cp -r c-api/include/falcon_core release/headers/c-api/
          cd release/headers
          zip -r ../falcon-core-cpp-headers.zip cpp
          zip -r ../falcon-core-c-api-headers.zip c-api

      - name: Zip full repo
        run: |
          git archive --format=zip --output=release/falcon-core-full-repo.zip HEAD

      - name: Upload release assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release/linux/libfalcon_core_cpp.so
            release/linux/libfalcon_core_c_api.so
            release/windows/falcon_core_cpp.dll
            release/windows/falcon_core_c_api.dll
            release/windows/falcon_core_cpp.lib
            release/windows/falcon_core_c_api.lib
            release/falcon-core-cpp-headers.zip
            release/falcon-core-c-api-headers.zip
            release/falcon-core-full-repo.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
