name: Native Windows Build and Test

on:
  push:
    branches: [windows-support]
  pull_request:
    branches: [windows-support]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  build-and-test-windows:
    name: Build and Test on Windows (vcpkg + clang-cl)
    runs-on: windows-latest

    # vcpkg binary caching (manifest mode; vcpkg.json in repo root)
    env:
      # Store/restore built packages here (cached by actions/cache)
      VCPKG_BINARY_SOURCES: "clear;files,${{ github.workspace }}/.vcpkg/bincache,readwrite"
      # Optional: keep downloaded source archives too
      VCPKG_DOWNLOADS: "${{ github.workspace }}/.vcpkg/downloads"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Attempt to restore vcpkg binary cache
        uses: actions/cache@v4
        with:
          path: |
            .vcpkg/bincache
            .vcpkg/downloads
          key: vcpkg-${{ runner.os }}-${{ hashFiles('vcpkg.json', 'vcpkg-lock.json', '**/vcpkg-configuration.json') }}
          restore-keys: |
            vcpkg-${{ runner.os }}-

      - name: Setup vcpkg
        uses: lukka/run-vcpkg@v11
        with:
          vcpkgGitCommitId: "73af4de996897cb45dcf5034d16a551a3cf476f7"

      # Install dependencies once for both c++/c builds
      # - name: Install dependencies via vcpkg (manifest)
      #   run: |
      #     # Manifest mode reads vcpkg.json from repository root
      #     vcpkg install --triplet x64-windows
      #   shell: pwsh

      - name: Configure CMake with Visual Studio generator for cpp
        working-directory: cpp
        run: |
          cmake -B build `
            -S . `
            -G "Visual Studio 17 2022" `
            -A x64 `
            -DCMAKE_C_COMPILER="C:/Program Files/LLVM/bin/clang-cl.exe" `
            -DCMAKE_CXX_COMPILER="C:/Program Files/LLVM/bin/clang-cl.exe" `
            -DCMAKE_TOOLCHAIN_FILE="${env:VCPKG_ROOT}/scripts/buildsystems/vcpkg.cmake" `
            -DVCPKG_MANIFEST_DIR="${env:GITHUB_WORKSPACE}" `
            -DVCPKG_INSTALLED_DIR="${env:GITHUB_WORKSPACE}/cpp/build/vcpkg_installed" `
            -DCMAKE_BUILD_TYPE=Release `
            -DFALCON_CORE_DEV=ON
        shell: pwsh

      - name: Save vcpkg binary cache (early)
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            .vcpkg/bincache
            .vcpkg/downloads
          key: vcpkg-${{ runner.os }}-${{ hashFiles('vcpkg.json', 'vcpkg-lock.json', '**/vcpkg-configuration.json') }}

      - name: Build falcon-core-cpp
        working-directory: cpp
        run: |
          cmake --build build --config Release --verbose
        shell: pwsh

      - name: List cpp build outputs
        working-directory: cpp
        run: |
          Write-Host "=== CPP Build Outputs ==="
          Get-ChildItem -Path "build/Release" -Recurse | Select-Object FullName
        shell: pwsh

      - name: Run CPP tests (Release)
        working-directory: cpp
        shell: pwsh
        run: |
          $exe = (Resolve-Path "build/Release/falcon_core_cpp_run_tests.exe").Path

          # Prefer DLLs copied next to the exe (best), but also pin vcpkg bin to avoid collisions
          $vcpkgBin = (Resolve-Path "build/vcpkg_installed/x64-windows/bin").Path
          Write-Host "Using vcpkg bin: $vcpkgBin"
          Write-Host "Running: $exe"

          # Force the DLL search path to vcpkg bin FIRST (prevents Git/MSYS2/Strawberry zlib collisions)
          $cs = @'
          using System;
          using System.Runtime.InteropServices;
          namespace Win32 {
            public static class NativeMethods {
              [DllImport("kernel32.dll", SetLastError=true)]
              public static extern bool SetDllDirectory(string lpPathName);
            }
          }
          '@
          Add-Type -TypeDefinition $cs -Language CSharp
          [Win32.NativeMethods]::SetDllDirectory($vcpkgBin) | Out-Null

          # Also prepend PATH for child processes
          $env:PATH = "$vcpkgBin;$PWD\build\Release;$env:PATH"

          # Useful debug: show conflicts
          where.exe zlib1.dll
          where.exe hdf5.dll
          where.exe yaml-cpp.dll

          # Run with gtest output so we can see where it dies
          & $exe --gtest_color=no --gtest_output=xml:test-results.xml
          $code = $LASTEXITCODE
          Write-Host "Exit code: $code"
          exit $code

      - name: Generate cpp coverage report (placeholder)
        working-directory: cpp
        run: |
          # Windows coverage generation would go here
          # For now, create placeholder directory
          New-Item -ItemType Directory -Force -Path coverage
          Write-Host "Coverage report generation not yet implemented for Windows"
        shell: pwsh

      # ------------------
      # Error handling and debugging steps
      # ------------------
      - name: Run tests with ProcDump (capture crash dumps)
        if: always()
        working-directory: cpp
        shell: pwsh
        run: |
          # Install ProcDump (Chocolatey is available on windows-latest runners)
          choco install procdump -y

          # Paths
          $exe = (Resolve-Path "build/Release/falcon_core_cpp_run_tests.exe").Path
          $dumpDir = Join-Path $PWD "dumps"
          New-Item -ItemType Directory -Force -Path $dumpDir | Out-Null

          Write-Host "Exe: $exe"
          Write-Host "Dump dir: $dumpDir"

          # Run under ProcDump:
          #  -ma : full dump
          #  -e  : write dump on unhandled exception
          #  -x  : dump directory
          procdump -accepteula -ma -e -x $dumpDir $exe --gtest_color=no --gtest_output=xml:test-results.xml

          $code = $LASTEXITCODE
          Write-Host "Exit code: $code"

          # List dumps (if any)
          Get-ChildItem $dumpDir -Recurse -ErrorAction SilentlyContinue | Select-Object FullName, Length

          exit $code

      - name: Upload crash dumps
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-crash-dumps
          path: cpp/dumps/**
          if-no-files-found: ignore

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-test-results
          path: cpp/test-results.xml
          if-no-files-found: ignore


      # OS-agnostic, copy-pasteable into any workflow (no OS-specific shell)
      - name: Notify Discord on failure
        if: failure()
        uses: actions/github-script@v7
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        with:
          script: |
            const url = process.env.DISCORD_WEBHOOK_URL;
            if (!url) throw new Error("DISCORD_WEBHOOK_URL is not set");
            if (!url.startsWith("https://discord.com/api/webhooks/")) {
              throw new Error("Webhook URL doesn't look like a Discord webhook (expected https://discord.com/api/webhooks/...)");
            }

            const runUrl = `${process.env.GITHUB_SERVER_URL}/${process.env.GITHUB_REPOSITORY}/actions/runs/${process.env.GITHUB_RUN_ID}`;

            const payload = {
              content:
                `❌ **Workflow failed**\n` +
                `OS: **${process.env.RUNNER_OS}**\n` +
                `Repo: **${process.env.GITHUB_REPOSITORY}**\n` +
                `Workflow: **${process.env.GITHUB_WORKFLOW}**\n` +
                `Job: **${process.env.GITHUB_JOB}**\n` +
                `Branch: **${process.env.GITHUB_REF_NAME ?? ""}**\n` +
                `Commit: \`${process.env.GITHUB_SHA}\`\n` +
                `Run: ${runUrl}`
            };

            const res = await fetch(url, {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify(payload),
            });

            if (!res.ok) {
              const text = await res.text().catch(() => "");
              throw new Error(`Discord webhook failed: ${res.status} ${res.statusText}\n${text}`);
            }

      - name: Setup tmate session for debugging (on failure)
        if: ${{ failure() }}
        uses: mxschmitt/action-tmate@v3
        timeout-minutes: 30
        with:
          limit-access-to-actor: true
