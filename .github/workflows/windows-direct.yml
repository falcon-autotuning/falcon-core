name: Native Windows Build and Test

on:
  push:
    branches: [windows-support]
  pull_request:
    branches: [windows-support]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  build-and-test-windows:
    name: Build and Test on Windows (vcpkg + clang-cl)
    runs-on: windows-latest

    # vcpkg binary caching (manifest mode; vcpkg.json in repo root)
    env:
      # Store/restore built packages here (cached by actions/cache)
      VCPKG_BINARY_SOURCES: "clear;files,${{ github.workspace }}/.vcpkg/bincache,readwrite"
      # Optional: keep downloaded source archives too
      VCPKG_DOWNLOADS: "${{ github.workspace }}/.vcpkg/downloads"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Attempt to restore vcpkg binary cache
        uses: actions/cache@v4
        with:
          path: |
            .vcpkg/bincache
            .vcpkg/downloads
          key: vcpkg-${{ runner.os }}-${{ hashFiles('vcpkg.json', 'vcpkg-lock.json', '**/vcpkg-configuration.json') }}
          restore-keys: |
            vcpkg-${{ runner.os }}-

      - name: Setup vcpkg
        uses: lukka/run-vcpkg@v11
        with:
          vcpkgGitCommitId: "73af4de996897cb45dcf5034d16a551a3cf476f7"

      - name: Install dependencies via vcpkg (manifest)
        run: |
          # Manifest mode reads vcpkg.json from repository root
          vcpkg install --triplet x64-windows
        shell: pwsh

      - name: Save vcpkg binary cache (early)
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            .vcpkg/bincache
            .vcpkg/downloads
          key: vcpkg-${{ runner.os }}-${{ hashFiles('vcpkg.json', 'vcpkg-lock.json', '**/vcpkg-configuration.json') }}

      - name: Configure CMake with Visual Studio generator for cpp
        working-directory: cpp
        run: |
          cmake -B build `
            -S . `
            -G "Visual Studio 17 2022" `
            -A x64 `
            -DCMAKE_C_COMPILER="C:/Program Files/LLVM/bin/clang-cl.exe" `
            -DCMAKE_CXX_COMPILER="C:/Program Files/LLVM/bin/clang-cl.exe" `
            -DCMAKE_TOOLCHAIN_FILE="${env:VCPKG_ROOT}/scripts/buildsystems/vcpkg.cmake" `
            -DVCPKG_MANIFEST_DIR="${env:GITHUB_WORKSPACE}" `
            -DCMAKE_BUILD_TYPE=Release `
            -DFALCON_CORE_DEV=ON
        shell: pwsh

      - name: Build falcon-core-cpp
        working-directory: cpp
        run: |
          cmake --build build --config Release --verbose
        shell: pwsh

      - name: List cpp build outputs
        working-directory: cpp
        run: |
          Write-Host "=== CPP Build Outputs ==="
          Get-ChildItem -Path "build/Release" -Recurse | Select-Object FullName
        shell: pwsh

      - name: Run CPP tests (Release)
        working-directory: cpp
        shell: pwsh
        run: |
          $vcpkgBin = (Resolve-Path "build/vcpkg_installed/x64-windows/bin").Path
          Write-Host "Using vcpkg bin: $vcpkgBin"
          $env:PATH = "$vcpkgBin;$PWD\build\Release;$env:PATH"

          $exe = "$PWD\build\Release\falcon_core_cpp_run_tests.exe"
          Write-Host "Running CPP tests: $exe"
          & $exe
          if ($LASTEXITCODE -ne 0) { throw "CPP tests failed with exit code $LASTEXITCODE" }


      - name: Test falcon-core-cpp
        working-directory: cpp
        run: |
          # Add vcpkg DLLs and build output to PATH
          $env:PATH = "$PWD/build/vcpkg_installed/x64-windows/bin;$PWD/build/Release;$env:PATH"

          # Find the test executable (adjust name as needed)
          $testExe = Get-ChildItem -Path "build" -Recurse -Filter "*test*.exe" | Select-Object -First 1

          if ($null -eq $testExe) {
            Write-Error "No test executable found in cpp/build"
            Get-ChildItem -Path "build" -Recurse -Filter "*.exe" | Select-Object FullName
            exit 1
          }

          Write-Host "Running CPP tests: $($testExe.FullName)"
          
          & $testExe.FullName --gtest_color=no --gtest_output=xml:test-results.xml 2>&1 | Tee-Object -Variable testOutput
          $exitCode = $LASTEXITCODE

          # Check for DLL errors
          if ($exitCode -eq -1073741515 -or $exitCode -eq 3221225781) {
            Write-Error "DLL NOT FOUND ERROR - Missing dependencies"
            exit 1
          }

          if ($exitCode -ne 0) {
            Write-Error "CPP tests failed with exit code $exitCode"
            exit $exitCode
          }

          Write-Host "✅ CPP tests passed successfully"
        shell: pwsh

      - name: Generate cpp coverage report (placeholder)
        working-directory: cpp
        run: |
          # Windows coverage generation would go here
          # For now, create placeholder directory
          New-Item -ItemType Directory -Force -Path coverage
          Write-Host "Coverage report generation not yet implemented for Windows"
        shell: pwsh

      # OS-agnostic, copy-pasteable into any workflow (no OS-specific shell)
      - name: Notify Discord on failure
        if: failure()
        uses: actions/github-script@v7
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        with:
          script: |
            const url = process.env.DISCORD_WEBHOOK_URL;
            if (!url) throw new Error("DISCORD_WEBHOOK_URL is not set");
            if (!url.startsWith("https://discord.com/api/webhooks/")) {
              throw new Error("Webhook URL doesn't look like a Discord webhook (expected https://discord.com/api/webhooks/...)");
            }

            const runUrl = `${process.env.GITHUB_SERVER_URL}/${process.env.GITHUB_REPOSITORY}/actions/runs/${process.env.GITHUB_RUN_ID}`;

            const payload = {
              content:
                `❌ **Workflow failed**\n` +
                `OS: **${process.env.RUNNER_OS}**\n` +
                `Repo: **${process.env.GITHUB_REPOSITORY}**\n` +
                `Workflow: **${process.env.GITHUB_WORKFLOW}**\n` +
                `Job: **${process.env.GITHUB_JOB}**\n` +
                `Branch: **${process.env.GITHUB_REF_NAME ?? ""}**\n` +
                `Commit: \`${process.env.GITHUB_SHA}\`\n` +
                `Run: ${runUrl}`
            };

            const res = await fetch(url, {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify(payload),
            });

            if (!res.ok) {
              const text = await res.text().catch(() => "");
              throw new Error(`Discord webhook failed: ${res.status} ${res.statusText}\n${text}`);
            }

      - name: Setup tmate session for debugging (on failure)
        if: ${{ failure() }}
        uses: mxschmitt/action-tmate@v3
        timeout-minutes: 30
        with:
          limit-access-to-actor: true
