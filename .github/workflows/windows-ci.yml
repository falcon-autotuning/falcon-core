name: Windows CI
on:
  push:
    branches: [main]
    tags:
      - "v*"
  pull_request:
    branches: [main]
  workflow_dispatch:
  workflow_call:
jobs:
  test-and-release:
    runs-on: windows-2022
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Install build dependencies
        run: |
          choco install cmake make

      - name: Setup vcpkg
        uses: lukka/run-vcpkg@v11
        with:
          vcpkgGitCommitId: "7213cf8135c329c37c7e2778e40774489a0583a8"

      - name: Set VCPKG_ROOT as Unix-style path
        run: echo "VCPKG_ROOT=$(echo "${{ github.workspace }}/vcpkg" | sed 's|\\|/|g')" >> $GITHUB_ENV
      - name: Add PowerShell to PATH
        run: echo "C:\Windows\System32\WindowsPowerShell\v1.0" >> $GITHUB_PATH
      - name: Run tests
        env:
          PATH: "C:/Program Files/LLVM/bin;C:/Program Files/CMake/bin;C:/ProgramData/chocolatey/bin;${{ env.PATH }}"
          NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
          FEED_URL: ${{ secrets.NUGET_FEED_URL }}
          FEED_NAME: ${{ secrets.NUGET_FEED_NAME }}
          USERNAME: $ {{ secrets.NUGET_USERNAME }}
          CC: clang-cl
          CXX: clang-cl
        run: make test

      - name: Run C++ integration tests (same platform)
        working-directory: build/release/bin
        env:
          PATH: ${{ github.workspace }}/build/release;${{ github.workspace }}/vcpkg_installed/x64-windows/bin;${{ env.PATH }}
        run: |
          ./integration_serialize_connection --output cpp_windows_local.json --name "WindowsLocalTest" --type PlungerGate
          ./integration_deserialize_connection --input cpp_windows_local.json --name "WindowsLocalTest" --type PlungerGate --verbose

      - name: Serialize for cross-platform test
        working-directory: build/release/bin
        env:
          PATH: ${{ github.workspace }}/build/release;${{ github.workspace }}/vcpkg_installed/x64-windows/bin;${{ env.PATH }}
        run: |
          ./integration_serialize_connection --output cpp_windows_cross.json --name "WindowsToLinuxTest" --type BarrierGate
          cat cpp_windows_cross.json

      - name: Upload cross-platform test artifact
        uses: actions/upload-artifact@v4
        with:
          name: cpp-windows-serialized
          path: build/release/tests/cpp_windows_cross.json
          retention-days: 1

      - name: Run C-API integration tests (same platform)
        working-directory: build/release/bin
        env:
          PATH: ${{ github.workspace }}/build/release;${{ github.workspace }}/vcpkg_installed/x64-windows/bin;${{ env.PATH }}
        run: |
          ./integration_serialize_connection_c --output capi_windows_local.json --name "CApiWindowsLocalTest" --type PlungerGate
          ./integration_deserialize_connection_c --input capi_windows_local.json --name "CApiWindowsLocalTest" --type PlungerGate --verbose

      - name: Serialize for cross-platform test
        working-directory: build/release/bin
        env:
          PATH: ${{ github.workspace }}/build/release;${{ github.workspace }}/vcpkg_installed/x64-windows/bin;${{ env.PATH }}
        run: |
          ./integration_serialize_connection_c --output capi_windows_cross.json --name "CApiWindowsToLinuxTest" --type ScreeningGate
          cat capi_windows_cross.json

      - name: Upload cross-platform test artifact
        uses: actions/upload-artifact@v4
        with:
          name: capi-windows-serialized
          path: build/release/tests/capi_windows_cross.json
          retention-days: 1

      - name: Upload windows build state
        uses: actions/upload-artifact@v4
        with:
          name: windows-build-release
          path: build/release/**
          retention-days: 1

      - name: Setup tmate session on failure
        if: failure()
        uses: mxschmitt/action-tmate@v3
        timeout-minutes: 30
