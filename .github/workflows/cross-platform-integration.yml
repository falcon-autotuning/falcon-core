name: Cross-Platform Integration Tests

on:
  workflow_call:
  workflow_dispatch:

jobs:
  # Test C++ Linux → Windows
  cpp-linux-to-windows:
    name: C++ Linux → Windows
    runs-on: windows-latest

    env:
      VCPKG_BINARY_SOURCES: "clear;files,${{ github.workspace }}/.vcpkg/bincache,readwrite"
      VCPKG_DOWNLOADS: "${{ github.workspace }}/.vcpkg/downloads"

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Attempt to restore vcpkg binary cache
        uses: actions/cache@v4
        with:
          path: |
            .vcpkg/bincache
            .vcpkg/downloads
          key: vcpkg-${{ runner.os }}-clang-cl-${{ hashFiles('cpp/vcpkg.json', 'vcpkg-lock.json', '**/vcpkg-configuration.json') }}
          restore-keys: |
            vcpkg-${{ runner.os }}-clang-cl-
            vcpkg-${{ runner.os }}-

      - name: Setup vcpkg
        uses: lukka/run-vcpkg@v11
        with:
          vcpkgGitCommitId: "73af4de996897cb45dcf5034d16a551a3cf476f7"

      - name: Install LLVM/Clang
        shell: pwsh
        run: |
          choco install llvm -y
          $env:Path = [System.Environment]::GetEnvironmentVariable("Path","Machine") + ";" + [System.Environment]::GetEnvironmentVariable("Path","User")

      - name: Install vcpkg dependencies for runtime
        working-directory: cpp
        shell: pwsh
        run: |
          Write-Host "=== Installing runtime dependencies ==="
          C:\vcpkg\vcpkg.exe install --triplet=x64-windows

      - name: Download Windows deserializer
        uses: actions/download-artifact@v4
        with:
          name: cpp-windows-integration-deserializer
          path: deserializer

      - name: Download Linux serialized artifact
        uses: actions/download-artifact@v4
        with:
          name: cpp-linux-serialized
          path: data

      - name: Verify downloaded files
        shell: pwsh
        run: |
          Write-Host "=== Deserializer Contents ==="
          Get-ChildItem deserializer -Recurse | Select-Object FullName, Length

          Write-Host "`n=== Data Contents ==="
          Get-ChildItem data -Recurse | Select-Object FullName, Length

          Write-Host "`n=== Verifying DLL dependencies ==="
          $requiredDlls = @("falcon_core_cpp.dll", "integration_deserialize_connection.exe")
          foreach ($dll in $requiredDlls) {
            if (Test-Path "deserializer/$dll") {
              Write-Host "[OK] $dll"
            } else {
              Write-Error "[MISSING] $dll"
            }
          }

      - name: Setup runtime environment
        shell: pwsh
        run: |
          $deserializerPath = (Resolve-Path "deserializer").Path

          # Add deserializer directory to PATH (has all DLLs)
          $env:PATH = "$deserializerPath;$env:PATH"

          Write-Host "Runtime PATH includes: $deserializerPath"

          # Verify DLLs are accessible
          Write-Host "`n=== Available DLLs ==="
          Get-ChildItem $deserializerPath -Filter "*.dll" | Select-Object Name

      - name: Deserialize on Windows
        shell: pwsh
        run: |
          $deserializerPath = (Resolve-Path "deserializer").Path
          $env:PATH = "$deserializerPath;$env:PATH"

          cd deserializer
          .\integration_deserialize_connection.exe --input ../data/cpp_linux_cross.json --name "LinuxToWindowsTest" --type BarrierGate --verbose

          if ($LASTEXITCODE -ne 0) {
            Write-Error "Deserialization failed with exit code: $LASTEXITCODE"
            exit $LASTEXITCODE
          }

          Write-Host "`n[SUCCESS] C++ Linux → Windows cross-platform test passed!"

      - name: Setup tmate session on failure
        if: failure()
        uses: mxschmitt/action-tmate@v3
        timeout-minutes: 30

  # Test C++ Windows → Linux
  cpp-windows-to-linux:
    name: C++ Windows → Linux
    runs-on: ubuntu-latest
    container:
      image: archlinux:latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Create build user
        run: |
          useradd -m builduser
          echo "builduser ALL=(ALL) NOPASSWD: ALL" >> /etc/sudoers
          chown -R builduser:builduser .

      - name: Cache pacman packages
        uses: actions/cache@v4
        with:
          path: /var/cache/pacman/pkg
          key: ${{ runner.os }}-pacman-${{ github.ref }}
          restore-keys: |
            ${{ runner.os }}-pacman-

      - name: Cache AUR packages
        uses: actions/cache@v4
        with:
          path: |
            packaging/highfive/*.pkg.tar.zst
            packaging/exprtk/*.pkg.tar.zst
          key: ${{ runner.os }}-aur-${{ github.ref }}
          restore-keys: |
            ${{ runner.os }}-aur-

      - name: Install system dependencies
        run: |
          pacman -Syu --noconfirm
          pacman -S --noconfirm \
            base-devel \
            git \
            wget \
            curl \
            pkg-config \
            openssh \
            cereal \
            hdf5 \
            boost \
            bzip2 \
            expat \
            nlohmann-json \
            openssl \
            python \
            sqlite \
            yaml-cpp \
            zlib \
            ninja \
            llvm \
            ccache \
            clang \
            gtest \
            glibc \
            cmake \
            lld

      - name: Install AUR packages
        run: |
          mkdir -p packaging
          chown builduser:builduser packaging
          runuser -u builduser -- env PATH=/usr/bin:$PATH bash -c "
              if [ ! -d packaging/highfive ]; then git clone https://aur.archlinux.org/highfive.git packaging/highfive; fi
              if [ ! -d packaging/exprtk ]; then git clone https://aur.archlinux.org/exprtk.git packaging/exprtk; fi
              cd packaging/highfive
              if ls *.pkg.tar.zst 1> /dev/null 2>&1; then
                sudo pacman -U --noconfirm ./*.pkg.tar.zst
              else
                PKGDEST=\"\$(pwd)\" makepkg -si --noconfirm --needed
              fi
              cd ../exprtk
              if ls *.pkg.tar.zst 1> /dev/null 2>&1; then
                sudo pacman -U --noconfirm ./*.pkg.tar.zst
              else
                PKGDEST=\"\$(pwd)\" makepkg -si --noconfirm --needed
              fi
            "

      - name: Build xtensor packages
        run: |
          runuser -u builduser -- env PATH=/usr/bin:$PATH bash -c "
            cd packaging/xtl && makepkg -si --noconfirm --syncdeps --cleanbuild
            cd ../xsimd && makepkg -si --noconfirm --syncdeps --cleanbuild
            cd ../xtensor && makepkg -si --noconfirm --syncdeps --cleanbuild
            cd ../xtensor-io && makepkg -si --noconfirm --syncdeps --cleanbuild
          "

      - name: Download Linux deserializer
        uses: actions/download-artifact@v4
        with:
          name: cpp-linux-integration-deserializer
          path: deserializer

      - name: Download Windows serialized artifact
        uses: actions/download-artifact@v4
        with:
          name: cpp-windows-serialized
          path: data

      - name: Verify downloaded files
        run: |
          echo "=== Deserializer Contents ==="
          ls -lhR deserializer

          echo ""
          echo "=== Data Contents ==="
          ls -lhR data

          echo ""
          echo "=== Verifying shared libraries ==="
          if [ -f deserializer/libfalcon_core_cpp.so ]; then
            echo "[OK] libfalcon_core_cpp.so"
            file deserializer/libfalcon_core_cpp.so
          else
            echo "[MISSING] libfalcon_core_cpp.so"
          fi

          if [ -f deserializer/integration_deserialize_connection ]; then
            echo "[OK] integration_deserialize_connection"
            file deserializer/integration_deserialize_connection
          else
            echo "[MISSING] integration_deserialize_connection"
          fi

      - name: Make executable runnable
        run: |
          chmod +x deserializer/integration_deserialize_connection

          # Verify library dependencies
          echo "=== Library dependencies ==="
          ldd deserializer/integration_deserialize_connection || true

      - name: Deserialize on Linux
        run: |
          cd deserializer
          export LD_LIBRARY_PATH=$(pwd):$LD_LIBRARY_PATH

          echo "=== Running deserialization test ==="
          ./integration_deserialize_connection --input ../data/cpp_windows_cross.json --name "WindowsToLinuxTest" --type ReservoirGate --verbose

          if [ $? -eq 0 ]; then
            echo ""
            echo "[SUCCESS] C++ Windows → Linux cross-platform test passed!"
          else
            echo ""
            echo "[FAILED] Deserialization failed!"
            exit 1
          fi

      - name: Setup tmate session on failure
        if: failure()
        uses: mxschmitt/action-tmate@v3
        timeout-minutes: 30

  # Test C-API Linux → Windows
  capi-linux-to-windows:
    name: C-API Linux → Windows
    runs-on: windows-latest

    env:
      VCPKG_BINARY_SOURCES: "clear;files,${{ github.workspace }}/.vcpkg/bincache,readwrite"
      VCPKG_DOWNLOADS: "${{ github.workspace }}/.vcpkg/downloads"

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Attempt to restore vcpkg binary cache
        uses: actions/cache@v4
        with:
          path: |
            .vcpkg/bincache
            .vcpkg/downloads
          key: vcpkg-${{ runner.os }}-clang-cl-capi-${{ hashFiles('c-api/vcpkg.json', 'vcpkg-lock.json', '**/vcpkg-configuration.json') }}
          restore-keys: |
            vcpkg-${{ runner.os }}-clang-cl-capi-
            vcpkg-${{ runner.os }}-clang-cl-
            vcpkg-${{ runner.os }}-

      - name: Setup vcpkg
        uses: lukka/run-vcpkg@v11
        with:
          vcpkgGitCommitId: "73af4de996897cb45dcf5034d16a551a3cf476f7"

      - name: Install LLVM/Clang
        shell: pwsh
        run: |
          Write-Host "=== Installing LLVM/Clang ==="
          choco install llvm -y
          $env:Path = [System.Environment]::GetEnvironmentVariable("Path","Machine") + ";" + [System.Environment]::GetEnvironmentVariable("Path","User")
          Write-Host "✓ LLVM/Clang installed"

      - name: Install vcpkg dependencies for runtime
        working-directory: c-api
        shell: pwsh
        run: |
          Write-Host "=== Installing runtime dependencies ==="
          C:\vcpkg\vcpkg.exe install --triplet=x64-windows

      - name: Download Windows deserializer
        uses: actions/download-artifact@v4
        with:
          name: capi-windows-integration-deserializer
          path: deserializer

      - name: Download Linux serialized artifact
        uses: actions/download-artifact@v4
        with:
          name: capi-linux-serialized
          path: data

      - name: Verify downloaded files
        shell: pwsh
        run: |
          Write-Host "=== Deserializer Contents ==="
          Get-ChildItem deserializer -Recurse | Select-Object FullName, Length

          Write-Host "`n=== Data Contents ==="
          Get-ChildItem data -Recurse | Select-Object FullName, Length

          Write-Host "`n=== Verifying DLL dependencies ==="
          $requiredDlls = @(
            "falcon_core_c_api.dll",
            "falcon_core_cpp.dll",
            "integration_deserialize_connection_c.exe"
          )
          foreach ($dll in $requiredDlls) {
            if (Test-Path "deserializer/$dll") {
              Write-Host "[OK] $dll"
            } else {
              Write-Error "[MISSING] $dll"
            }
          }

      - name: Setup runtime environment
        shell: pwsh
        run: |
          $deserializerPath = (Resolve-Path "deserializer").Path
          $env:PATH = "$deserializerPath;$env:PATH"

          Write-Host "Runtime PATH includes: $deserializerPath"

          Write-Host "`n=== Available DLLs ==="
          Get-ChildItem $deserializerPath -Filter "*.dll" | Select-Object Name

      - name: Deserialize on Windows
        shell: pwsh
        run: |
          $deserializerPath = (Resolve-Path "deserializer").Path
          $env:PATH = "$deserializerPath;$env:PATH"

          cd deserializer
          .\integration_deserialize_connection_c.exe --input ../data/capi_linux_cross.json --name "CApiLinuxToWindowsTest" --type ScreeningGate --verbose

          if ($LASTEXITCODE -ne 0) {
            Write-Error "Deserialization failed with exit code: $LASTEXITCODE"
            exit $LASTEXITCODE
          }

          Write-Host "`n[SUCCESS] C-API Linux → Windows cross-platform test passed!"

      - name: Setup tmate session on failure
        if: failure()
        uses: mxschmitt/action-tmate@v3
        timeout-minutes: 30

  # Test C-API Windows → Linux
  capi-windows-to-linux:
    name: C-API Windows → Linux
    runs-on: ubuntu-latest
    container:
      image: archlinux:latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Create build user
        run: |
          useradd -m builduser
          echo "builduser ALL=(ALL) NOPASSWD: ALL" >> /etc/sudoers
          chown -R builduser:builduser .

      - name: Cache pacman packages
        uses: actions/cache@v4
        with:
          path: /var/cache/pacman/pkg
          key: ${{ runner.os }}-pacman-cross-capi-${{ github.ref }}
          restore-keys: |
            ${{ runner.os }}-pacman-cross-capi-
            ${{ runner.os }}-pacman-cross-
            ${{ runner.os }}-pacman-

      - name: Cache AUR packages
        uses: actions/cache@v4
        with:
          path: |
            packaging/highfive/*.pkg.tar.zst
            packaging/exprtk/*.pkg.tar.zst
          key: ${{ runner.os }}-aur-cross-capi-${{ github.ref }}
          restore-keys: |
            ${{ runner.os }}-aur-cross-capi-
            ${{ runner.os }}-aur-cross-
            ${{ runner.os }}-aur-

      - name: Install system dependencies
        run: |
          pacman -Syu --noconfirm
          pacman -S --noconfirm \
            base-devel \
            git \
            wget \
            curl \
            pkg-config \
            openssh \
            cereal \
            hdf5 \
            boost \
            bzip2 \
            expat \
            nlohmann-json \
            openssl \
            python \
            sqlite \
            yaml-cpp \
            zlib \
            ninja \
            llvm \
            ccache \
            clang \
            glibc \
            cmake \
            lld

      - name: Install AUR packages
        run: |
          mkdir -p packaging
          chown builduser:builduser packaging
          runuser -u builduser -- env PATH=/usr/bin:$PATH bash -c "
              if [ ! -d packaging/highfive ]; then git clone https://aur.archlinux.org/highfive.git packaging/highfive; fi
              if [ ! -d packaging/exprtk ]; then git clone https://aur.archlinux.org/exprtk.git packaging/exprtk; fi
              cd packaging/highfive
              if ls *.pkg.tar.zst 1> /dev/null 2>&1; then
                sudo pacman -U --noconfirm ./*.pkg.tar.zst
              else
                PKGDEST=\"\$(pwd)\" makepkg -si --noconfirm --needed
              fi
              cd ../exprtk
              if ls *.pkg.tar.zst 1> /dev/null 2>&1; then
                sudo pacman -U --noconfirm ./*.pkg.tar.zst
              else
                PKGDEST=\"\$(pwd)\" makepkg -si --noconfirm --needed
              fi
            "

      - name: Build xtensor packages
        run: |
          runuser -u builduser -- env PATH=/usr/bin:$PATH bash -c "
            cd packaging/xtl && makepkg -si --noconfirm --syncdeps --cleanbuild
            cd ../xsimd && makepkg -si --noconfirm --syncdeps --cleanbuild
            cd ../xtensor && makepkg -si --noconfirm --syncdeps --cleanbuild
            cd ../xtensor-io && makepkg -si --noconfirm --syncdeps --cleanbuild
          "

      - name: Download Linux deserializer
        uses: actions/download-artifact@v4
        with:
          name: capi-linux-integration-deserializer
          path: deserializer

      - name: Download Windows serialized artifact
        uses: actions/download-artifact@v4
        with:
          name: capi-windows-serialized
          path: data

      - name: Verify downloaded files
        run: |
          echo "=== Deserializer Contents ==="
          ls -lhR deserializer

          echo ""
          echo "=== Data Contents ==="
          ls -lhR data

          echo ""
          echo "=== Checking for executable ==="
          if [ -f "deserializer/integration_deserialize_connection_c" ]; then
            echo "[OK] integration_deserialize_connection_c found"
            file deserializer/integration_deserialize_connection_c
          else
            echo "[MISSING] integration_deserialize_connection_c not found!"
            echo "Searching for any deserialize executables..."
            find deserializer -name "*deserialize*" -type f
            exit 1
          fi

      - name: Make executable runnable
        run: |
          chmod +x deserializer/integration_deserialize_connection_c

          echo "=== Library dependencies ==="
          ldd deserializer/integration_deserialize_connection_c || true

