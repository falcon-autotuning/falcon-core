name: Cross-Platform Integration Tests

on:
  workflow_call:
  workflow_dispatch:

jobs:
  # Test C++ Linux → Windows
  cpp-linux-to-windows:
    name: C++ Linux → Windows
    runs-on: windows-latest

    env:
      VCPKG_BINARY_SOURCES: "clear;files,${{ github.workspace }}/.vcpkg-binary-cache,readwrite"

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Create vcpkg binary cache directory
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path ".vcpkg-binary-cache"

      - name: Cache vcpkg binary packages
        uses: actions/cache@v4
        with:
          path: .vcpkg-binary-cache
          key: vcpkg-binaries-windows-${{ hashFiles('**/vcpkg.json', '**/vcpkg-configuration.json') }}
          restore-keys: |
            vcpkg-binaries-windows-

      - name: Setup vcpkg
        uses: lukka/run-vcpkg@v11
        with:
          vcpkgGitCommitId: "73af4de996897cb45dcf5034d16a551a3cf476f7"

      - name: Install LLVM/Clang
        shell: pwsh
        run: |
          choco install llvm -y

      - name: Install vcpkg dependencies for runtime
        working-directory: cpp
        shell: pwsh
        run: |
          Write-Host "=== Installing runtime dependencies ==="
          # Use proper PowerShell path syntax
          & "$env:VCPKG_ROOT\vcpkg.exe" install --triplet=x64-windows

      - name: Download Windows deserializer
        uses: actions/download-artifact@v4
        with:
          name: cpp-windows-integration-deserializer
          path: deserializer

      - name: Download Linux serialized artifact
        uses: actions/download-artifact@v4
        with:
          name: cpp-linux-serialized
          path: data

      - name: Verify downloaded files
        shell: pwsh
        run: |
          Write-Host "=== Deserializer Contents ==="
          Get-ChildItem deserializer -Recurse | Select-Object FullName, Length

          Write-Host "`n=== Data Contents ==="
          Get-ChildItem data -Recurse | Select-Object FullName, Length

          Write-Host "`n=== Verifying DLL dependencies ==="
          $requiredDlls = @("falcon_core_cpp.dll", "integration_deserialize_connection.exe")
          foreach ($dll in $requiredDlls) {
            if (Test-Path "deserializer/$dll") {
              Write-Host "[OK] $dll"
            } else {
              Write-Error "[MISSING] $dll"
            }
          }

      - name: Setup runtime environment
        shell: pwsh
        run: |
          $deserializerPath = (Resolve-Path "deserializer").Path

          # Also add vcpkg DLLs to PATH
          $vcpkgBinPath = Join-Path $env:GITHUB_WORKSPACE "cpp\build\vcpkg_installed\x64-windows\bin"
          if (Test-Path $vcpkgBinPath) {
            $env:PATH = "$deserializerPath;$vcpkgBinPath;$env:PATH"
            Write-Host "Added vcpkg bin path: $vcpkgBinPath"
          } else {
            $env:PATH = "$deserializerPath;$env:PATH"
            Write-Host "Warning: vcpkg bin path not found: $vcpkgBinPath"
          }

          Write-Host "Runtime PATH includes: $deserializerPath"

          Write-Host "`n=== Available DLLs ==="
          Get-ChildItem $deserializerPath -Filter "*.dll" | Select-Object Name

      - name: Deserialize on Windows
        shell: pwsh
        run: |
          $deserializerPath = (Resolve-Path "deserializer").Path

          # Add vcpkg DLLs to PATH
          $vcpkgBinPath = Join-Path $env:GITHUB_WORKSPACE "cpp\build\vcpkg_installed\x64-windows\bin"
          if (Test-Path $vcpkgBinPath) {
            $env:PATH = "$deserializerPath;$vcpkgBinPath;$env:PATH"
          } else {
            $env:PATH = "$deserializerPath;$env:PATH"
          }

          cd deserializer
          .\integration_deserialize_connection.exe --input ../data/cpp_linux_cross.json --name "LinuxToWindowsTest" --type BarrierGate --verbose

          if ($LASTEXITCODE -ne 0) {
            Write-Error "Deserialization failed with exit code: $LASTEXITCODE"
            exit $LASTEXITCODE
          }

          Write-Host "`n[SUCCESS] C++ Linux → Windows cross-platform test passed!"

      - name: Setup tmate session on failure
        if: failure()
        uses: mxschmitt/action-tmate@v3
        timeout-minutes: 30

  # Test C++ Windows → Linux
  cpp-windows-to-linux:
    name: C++ Windows → Linux
    runs-on: ubuntu-latest

    env:
      VCPKG_BINARY_SOURCES: "clear;files,${{ github.workspace }}/.vcpkg-binary-cache,readwrite"

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Create vcpkg binary cache directory
        run: |
          mkdir -p "${{ github.workspace }}/.vcpkg-binary-cache"

      - name: Cache vcpkg binary packages
        uses: actions/cache@v4
        with:
          path: .vcpkg-binary-cache
          key: vcpkg-binaries-linux-${{ hashFiles('**/vcpkg.json', '**/vcpkg-configuration.json') }}
          restore-keys: |
            vcpkg-binaries-linux-

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential clang llvm pkg-config cmake \
            curl zip unzip tar git autoconf automake libtool

      - name: Setup vcpkg
        uses: lukka/run-vcpkg@v11
        with:
          vcpkgGitCommitId: "73af4de996897cb45dcf5034d16a551a3cf476f7"

      - name: Install vcpkg dependencies for runtime
        working-directory: cpp
        run: |
          echo "=== Installing runtime dependencies with vcpkg ==="
          ${VCPKG_ROOT}/vcpkg install --triplet=x64-linux-dynamic

          echo ""
          echo "=== Verifying vcpkg installation ==="
          ls -la build/vcpkg_installed/x64-linux-dynamic/lib/ || echo "vcpkg lib directory not found!"

      - name: Download Linux deserializer
        uses: actions/download-artifact@v4
        with:
          name: cpp-linux-integration-deserializer
          path: deserializer

      - name: Download Windows serialized artifact
        uses: actions/download-artifact@v4
        with:
          name: cpp-windows-serialized
          path: data

      - name: Verify downloaded files
        run: |
          echo "=== Deserializer Contents ==="
          ls -lhR deserializer
          echo ""
          echo "=== Data Contents ==="
          ls -lhR data
          echo ""
          echo "=== Verifying shared libraries ==="
          if [ -f deserializer/libfalcon_core_cpp.so ]; then
            echo "[OK] libfalcon_core_cpp.so"
            file deserializer/libfalcon_core_cpp.so
          else
            echo "[MISSING] libfalcon_core_cpp.so"
          fi
          if [ -f deserializer/integration_deserialize_connection ]; then
            echo "[OK] integration_deserialize_connection"
            file deserializer/integration_deserialize_connection
          else
            echo "[MISSING] integration_deserialize_connection"
          fi

      - name: Make executable runnable
        run: |
          chmod +x deserializer/integration_deserialize_connection
          echo "=== Library dependencies ==="
          ldd deserializer/integration_deserialize_connection || true

      - name: Deserialize on Linux
        run: |
          cd deserializer

          # Set up library path
          VCPKG_LIB_PATH="${GITHUB_WORKSPACE}/cpp/build/vcpkg_installed/x64-linux-dynamic/lib"
          export LD_LIBRARY_PATH=$(pwd):${VCPKG_LIB_PATH}:$LD_LIBRARY_PATH

          echo "=== LD_LIBRARY_PATH ==="
          echo $LD_LIBRARY_PATH

          echo ""
          echo "=== Checking if vcpkg libs exist ==="
          if [ -d "${VCPKG_LIB_PATH}" ]; then
            ls -la ${VCPKG_LIB_PATH} | head -20
          else
            echo "ERROR: vcpkg lib path not found!"
            exit 1
          fi

          echo ""
          echo "=== Running deserialization test ==="
          ./integration_deserialize_connection --input ../data/cpp_windows_cross.json --name "WindowsToLinuxTest" --type ReservoirGate --verbose

          if [ $? -eq 0 ]; then
            echo ""
            echo "[SUCCESS] C++ Windows → Linux cross-platform test passed!"
          else
            echo ""
            echo "[FAILED] Deserialization failed!"
            exit 1
          fi

      - name: Setup tmate session on failure
        if: failure()
        uses: mxschmitt/action-tmate@v3
        timeout-minutes: 30

  # Test C-API Linux → Windows
  capi-linux-to-windows:
    name: C-API Linux → Windows
    runs-on: windows-latest

    env:
      VCPKG_BINARY_SOURCES: "clear;files,${{ github.workspace }}/.vcpkg-binary-cache,readwrite"

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Create vcpkg binary cache directory
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path ".vcpkg-binary-cache"

      - name: Cache vcpkg binary packages
        uses: actions/cache@v4
        with:
          path: .vcpkg-binary-cache
          key: vcpkg-binaries-windows-${{ hashFiles('**/vcpkg.json', '**/vcpkg-configuration.json') }}
          restore-keys: |
            vcpkg-binaries-windows-

      - name: Setup vcpkg
        uses: lukka/run-vcpkg@v11
        with:
          vcpkgGitCommitId: "73af4de996897cb45dcf5034d16a551a3cf476f7"

      - name: Install LLVM/Clang
        shell: pwsh
        run: |
          choco install llvm -y

      - name: Install vcpkg dependencies for runtime
        working-directory: c-api
        shell: pwsh
        run: |
          Write-Host "=== Installing runtime dependencies ==="
          # Use proper PowerShell path syntax
          & "$env:VCPKG_ROOT\vcpkg.exe" install --triplet=x64-windows

      - name: Download Windows deserializer
        uses: actions/download-artifact@v4
        with:
          name: capi-windows-integration-deserializer
          path: deserializer

      - name: Download Linux serialized artifact
        uses: actions/download-artifact@v4
        with:
          name: capi-linux-serialized
          path: data

      - name: Verify downloaded files
        shell: pwsh
        run: |
          Write-Host "=== Deserializer Contents ==="
          Get-ChildItem deserializer -Recurse | Select-Object FullName, Length
          Write-Host "`n=== Data Contents ==="
          Get-ChildItem data -Recurse | Select-Object FullName, Length
          Write-Host "`n=== Verifying DLL dependencies ==="
          $requiredDlls = @(
            "falcon_core_c_api.dll",
            "falcon_core_cpp.dll",
            "integration_deserialize_connection_c.exe"
          )
          foreach ($dll in $requiredDlls) {
            if (Test-Path "deserializer/$dll") {
              Write-Host "[OK] $dll"
            } else {
              Write-Error "[MISSING] $dll"
            }
          }

      - name: Setup runtime environment
        shell: pwsh
        run: |
          $deserializerPath = (Resolve-Path "deserializer").Path

          # Also add vcpkg DLLs to PATH
          $vcpkgBinPath = Join-Path $env:GITHUB_WORKSPACE "c-api\build\vcpkg_installed\x64-windows\bin"
          if (Test-Path $vcpkgBinPath) {
            $env:PATH = "$deserializerPath;$vcpkgBinPath;$env:PATH"
            Write-Host "Added vcpkg bin path: $vcpkgBinPath"
          } else {
            $env:PATH = "$deserializerPath;$env:PATH"
            Write-Host "Warning: vcpkg bin path not found: $vcpkgBinPath"
          }

          Write-Host "Runtime PATH includes: $deserializerPath"
          Write-Host "`n=== Available DLLs ==="
          Get-ChildItem $deserializerPath -Filter "*.dll" | Select-Object Name

      - name: Deserialize on Windows
        shell: pwsh
        run: |
          $deserializerPath = (Resolve-Path "deserializer").Path

          # Add vcpkg DLLs to PATH
          $vcpkgBinPath = Join-Path $env:GITHUB_WORKSPACE "c-api\build\vcpkg_installed\x64-windows\bin"
          if (Test-Path $vcpkgBinPath) {
            $env:PATH = "$deserializerPath;$vcpkgBinPath;$env:PATH"
          } else {
            $env:PATH = "$deserializerPath;$env:PATH"
          }

          cd deserializer
          .\integration_deserialize_connection_c.exe --input ../data/capi_linux_cross.json --name "CApiLinuxToWindowsTest" --type ScreeningGate --verbose

          if ($LASTEXITCODE -ne 0) {
            Write-Error "Deserialization failed with exit code: $LASTEXITCODE"
            exit $LASTEXITCODE
          }

          Write-Host "`n[SUCCESS] C-API Linux → Windows cross-platform test passed!"

      - name: Setup tmate session on failure
        if: failure()
        uses: mxschmitt/action-tmate@v3
        timeout-minutes: 30

  # Test C-API Windows → Linux
  capi-windows-to-linux:
    name: C-API Windows → Linux
    runs-on: ubuntu-latest

    env:
      VCPKG_BINARY_SOURCES: "clear;files,${{ github.workspace }}/.vcpkg-binary-cache,readwrite"

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Create vcpkg binary cache directory
        run: |
          mkdir -p "${{ github.workspace }}/.vcpkg-binary-cache"

      - name: Cache vcpkg binary packages
        uses: actions/cache@v4
        with:
          path: .vcpkg-binary-cache
          key: vcpkg-binaries-linux-${{ hashFiles('**/vcpkg.json', '**/vcpkg-configuration.json') }}
          restore-keys: |
            vcpkg-binaries-linux-

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential clang llvm pkg-config cmake \
            curl zip unzip tar git autoconf automake libtool

      - name: Setup vcpkg
        uses: lukka/run-vcpkg@v11
        with:
          vcpkgGitCommitId: "73af4de996897cb45dcf5034d16a551a3cf476f7"

      - name: Install vcpkg dependencies for runtime
        working-directory: c-api
        run: |
          echo "=== Installing runtime dependencies with vcpkg ==="
          ${VCPKG_ROOT}/vcpkg install --triplet=x64-linux-dynamic

          echo ""
          echo "=== Verifying vcpkg installation ==="
          ls -la build/vcpkg_installed/x64-linux-dynamic/lib/ || echo "vcpkg lib directory not found!"

      - name: Download Linux deserializer
        uses: actions/download-artifact@v4
        with:
          name: capi-linux-integration-deserializer
          path: deserializer

      - name: Download Windows serialized artifact
        uses: actions/download-artifact@v4
        with:
          name: capi-windows-serialized
          path: data

      - name: Verify downloaded files
        run: |
          echo "=== Deserializer Contents ==="
          ls -lhR deserializer
          echo ""
          echo "=== Data Contents ==="
          ls -lhR data
          echo ""
          echo "=== Checking for executable ==="
          if [ -f "deserializer/integration_deserialize_connection_c" ]; then
            echo "[OK] integration_deserialize_connection_c found"
            file deserializer/integration_deserialize_connection_c
          else
            echo "[MISSING] integration_deserialize_connection_c not found!"
            echo "Searching for any deserialize executables..."
            find deserializer -name "*deserialize*" -type f
            exit 1
          fi

      - name: Make executable runnable
        run: |
          chmod +x deserializer/integration_deserialize_connection_c
          echo "=== Library dependencies ==="
          ldd deserializer/integration_deserialize_connection_c || true

      - name: Deserialize on Linux
        run: |
          cd deserializer

          # Set up library path
          VCPKG_LIB_PATH="${GITHUB_WORKSPACE}/c-api/build/vcpkg_installed/x64-linux-dynamic/lib"
          export LD_LIBRARY_PATH=$(pwd):${VCPKG_LIB_PATH}:$LD_LIBRARY_PATH

          echo "=== LD_LIBRARY_PATH ==="
          echo $LD_LIBRARY_PATH

          echo ""
          echo "=== Checking if vcpkg libs exist ==="
          if [ -d "${VCPKG_LIB_PATH}" ]; then
            ls -la ${VCPKG_LIB_PATH} | head -20
            echo ""
            echo "=== Boost libraries available ==="
            find ${VCPKG_LIB_PATH} -name "libboost*" | head -10
          else
            echo "ERROR: vcpkg lib path not found at: ${VCPKG_LIB_PATH}"
            echo ""
            echo "=== Looking for vcpkg_installed directory ==="
            find ${GITHUB_WORKSPACE}/c-api -type d -name "vcpkg_installed" || echo "No vcpkg_installed found"
            exit 1
          fi

          echo ""
          echo "=== Running C-API deserialization test ==="
          ./integration_deserialize_connection_c --input ../data/capi_windows_cross.json --name "CApiWindowsToLinuxTest" --type Ohmic --verbose

          if [ $? -eq 0 ]; then
            echo ""
            echo "[SUCCESS] C-API Windows → Linux cross-platform test passed!"
          else
            echo ""
            echo "[FAILED] Deserialization failed!"
            exit 1
          fi

      - name: Setup tmate session on failure
        if: failure()
        uses: mxschmitt/action-tmate@v3
        timeout-minutes: 30

  # Summary
  cross-platform-complete:
    name: Cross-Platform Tests Complete
    needs:
      [
        cpp-linux-to-windows,
        cpp-windows-to-linux,
        capi-linux-to-windows,
        capi-windows-to-linux,
      ]
    runs-on: ubuntu-latest
    steps:
      - name: Success Summary
        run: |
          echo "=================================================="
          echo "All cross-platform integration tests passed!"
          echo "=================================================="
          echo "[PASS] C++ Linux → Windows"
          echo "[PASS] C++ Windows → Linux"
          echo "[PASS] C-API Linux → Windows"
          echo "[PASS] C-API Windows → Linux"
          echo "=================================================="
