name: Cross-Platform Integration Tests

on:
  workflow_call:
  workflow_dispatch:

jobs:
  linux-to-windows:
    name: Linux → Windows
    runs-on: windows-2022
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          choco install ninja cmake llvm mono

      - name: Install vcpkg dependencies
        env:
          NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
          FEED_URL: ${{ secrets.NUGET_FEED_URL }}
          FEED_NAME: ${{ secrets.NUGET_FEED_NAME }}
          USERNAME: $ {{ secrets.NUGET_USERNAME }}
        run: make vcpkg-install-deps

      - name: Download Windows build state
        uses: actions/download-artifact@v4
        with:
          name: windows-build-release
          path: build/release

      - name: Download Linux serialized artifact
        uses: actions/download-artifact@v4
        with:
          name: cpp-linux-serialized
          path: data

      - name: Download Second Linux serialized artifact
        uses: actions/download-artifact@v4
        with:
          name: capi-linux-serialized
          path: data

      - name: Deserialize on Windows
        working-directory: build/release/bin
        env:
          PATH: ${{ github.workspace }}/build/release;${{ github.workspace }}/vcpkg_installed/x64-windows/bin;${{ env.PATH }}
        run: |
          ./integration_deserialize_connection --input ../../../data/cpp_linux_cross.json --name "LinuxToWindowsTest" --type BarrierGate --verbose || { echo "Deserialization failed!"; exit 1; }

      - name: Deserialize Again on Windows
        working-directory: build/release/bin
        env:
          PATH: ${{ github.workspace }}/build/release;${{ github.workspace }}/vcpkg_installed/x64-windows/bin;${{ env.PATH }}
        run: |
          ./integration_deserialize_connection_c --input ../../../data/capi_linux_cross.json --name "CApiLinuxToWindowsTest" --type ScreeningGate --verbose || { echo "Deserialization failed!"; exit 1; }

  windows-to-linux:
    name: Windows → Linux
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build cmake build-essential mono-complete

      - name: Set VCPKG_ROOT as Unix-style path
        run: echo "VCPKG_ROOT=$(echo "${{ github.workspace }}/vcpkg" | sed 's|\\|/|g')" >> $GITHUB_ENV
      - name: Add PowerShell to PATH
        run: echo "C:\Windows\System32\WindowsPowerShell\v1.0" >> $GITHUB_PATH
      - name: Install vcpkg dependencies
        env:
          PATH: "C:/Program Files/LLVM/bin;C:/Program Files/CMake/bin;C:/ProgramData/chocolatey/bin;${{ env.PATH }}"
          NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
          FEED_URL: ${{ secrets.NUGET_FEED_URL }}
          FEED_NAME: ${{ secrets.NUGET_FEED_NAME }}
          USERNAME: $ {{ secrets.NUGET_USERNAME }}
          CC: clang-cl
          CXX: clang-cl
        run: make vcpkg-install-deps

      - name: Download Linux build state
        uses: actions/download-artifact@v4
        with:
          name: linux-build-release
          path: build/release

      - name: Download Windows serialized artifact
        uses: actions/download-artifact@v4
        with:
          name: cpp-windows-serialized
          path: data

      - name: Download Second Windows serialized artifact
        uses: actions/download-artifact@v4
        with:
          name: capi-windows-serialized
          path: data

      - name: Deserialize on Linux
        working-directory: build/release/bin
        run: |
          export LD_LIBRARY_PATH=$(pwd):$(pwd)/vcpkg_installed/x64-linux-dynamic/lib:$LD_LIBRARY_PATH
          ./integration_deserialize_connection --input ../../../data/cpp_windows_cross.json --name "WindowsToLinuxTest" --type BarrierGate --verbose || { echo "Deserialization failed!"; exit 1; }

      - name: Deserialize Again on Linux
        working-directory: build/release/bin
        run: |
          export LD_LIBRARY_PATH=$(pwd):$(pwd)/vcpkg_installed/x64-linux-dynamic/lib:$LD_LIBRARY_PATH
          ./integration_deserialize_connection_c --input ../../../data/capi_windows_cross.json --name "CApiWindowsToLinuxTest" --type ScreeningGate --verbose || { echo "Deserialization failed!"; exit 1; }

  # Summary
  cross-platform-complete:
    name: Cross-Platform Tests Complete
    needs: [linux-to-windows, windows-to-linux]
    runs-on: ubuntu-24.04
    steps:
      - name: Success Summary
        run: |
          echo "=================================================="
          echo "All cross-platform integration tests passed!"
          echo "=================================================="
          echo "[PASS] Linux → Windows"
          echo "[PASS] Windows → Linux"
          echo "=================================================="
