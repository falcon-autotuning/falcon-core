        run: |
          cd deserializer
          export LD_LIBRARY_PATH=$(pwd):$LD_LIBRARY_PATH

          echo "=== Running C-API deserialization test ==="
          ./integration_deserialize_connection_c --input ../data/capi_windows_cross.json --name "CApiWindowsToLinuxTest" --type Ohmic --verbose

          if [ $? -eq 0 ]; then
            echo ""
            echo "[SUCCESS] C-API Windows → Linux cross-platform test passed!"
          else
            echo ""
            echo "[FAILED] Deserialization failed!"
            exit 1
          fi

      - name: Setup tmate session on failure
        if: failure()
        uses: mxschmitt/action-tmate@v3
        timeout-minutes: 30

  # Summary
  cross-platform-complete:
    name: Cross-Platform Tests Complete
    needs:
      [
        cpp-linux-to-windows,
        cpp-windows-to-linux,
        capi-linux-to-windows,
        capi-windows-to-linux,
      ]
    runs-on: ubuntu-latest
    steps:
      - name: Success Summary
        run: |
          echo "=================================================="
          echo "All cross-platform integration tests passed!"
          echo "=================================================="
          echo "[PASS] C++ Linux → Windows"
          echo "[PASS] C++ Windows → Linux"
          echo "[PASS] C-API Linux → Windows"
          echo "[PASS] C-API Windows → Linux"
          echo "=================================================="
