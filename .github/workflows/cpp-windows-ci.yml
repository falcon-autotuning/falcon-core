name: C++ Windows CI

on:
  workflow_call:
  workflow_dispatch:

jobs:
  build-and-test:
    name: Build and Test C++ (Windows)
    runs-on: windows-latest

    env:
      VCPKG_BINARY_SOURCES: "clear;files,${{ github.workspace }}/.vcpkg-binary-cache,readwrite"
      VCPKG_DOWNLOADS: "${{ github.workspace }}/.vcpkg/downloads"

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Create vcpkg binary cache directory
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path ".vcpkg-binary-cache"

      - name: Cache vcpkg binary packages (SHARED ACROSS ALL WINDOWS WORKFLOWS)
        uses: actions/cache@v4
        with:
          path: .vcpkg-binary-cache
          # This key is SHARED by all Windows workflows
          key: vcpkg-binaries-windows-${{ hashFiles('**/vcpkg.json', '**/vcpkg-configuration.json') }}
          restore-keys: |
            vcpkg-binaries-windows-

      - name: Setup vcpkg
        uses: lukka/run-vcpkg@v11
        with:
          vcpkgGitCommitId: "73af4de996897cb45dcf5034d16a551a3cf476f7"

      - name: Install LLVM/Clang via Chocolatey
        shell: pwsh
        run: |
          Write-Host "=== Installing LLVM/Clang ==="
          choco install llvm -y
          $env:Path = [System.Environment]::GetEnvironmentVariable("Path","Machine") + ";" + [System.Environment]::GetEnvironmentVariable("Path","User")
          Write-Host "✓ LLVM/Clang installed"

      - name: Install Ninja
        shell: pwsh
        run: |
          Write-Host "=== Installing Ninja ==="
          choco install ninja -y
          Write-Host "✓ Ninja installed"

      - name: Verify Toolchain
        shell: pwsh
        run: |
          Write-Host "=== Toolchain Verification ==="
          $env:Path = [System.Environment]::GetEnvironmentVariable("Path","Machine") + ";" + [System.Environment]::GetEnvironmentVariable("Path","User")
          Write-Host "`nClang-cl version:"
          clang-cl --version
          Write-Host "`nNinja version:"
          ninja --version
          Write-Host "`nVCPKG Root:"
          Write-Host "  VCPKG_ROOT = $env:VCPKG_ROOT"

      - name: Clean and Configure CMake with Ninja + clang-cl
        working-directory: cpp
        shell: pwsh
        run: |
          $env:Path = [System.Environment]::GetEnvironmentVariable("Path","Machine") + ";" + [System.Environment]::GetEnvironmentVariable("Path","User")

          Write-Host "=== Cleaning build directory ==="
          if (Test-Path build) {
            Remove-Item -Recurse -Force build
            Write-Host "✓ Build directory cleaned"
          }

          Write-Host "`n=== CMake Configuration ==="
          cmake -B build `
            -S . `
            -G "Ninja" `
            -DCMAKE_C_COMPILER=clang-cl `
            -DCMAKE_CXX_COMPILER=clang-cl `
            -DCMAKE_TOOLCHAIN_FILE="${env:VCPKG_ROOT}/scripts/buildsystems/vcpkg.cmake" `
            -DVCPKG_MANIFEST_DIR="${env:GITHUB_WORKSPACE}/cpp" `
            -DVCPKG_INSTALLED_DIR="${env:GITHUB_WORKSPACE}/cpp/build/vcpkg_installed" `
            -DCMAKE_BUILD_TYPE=Release `
            -DFALCON_CORE_DEV=ON `
            -DUSE_VCPKG=ON

          if ($LASTEXITCODE -ne 0) {
            Write-Error "CMake configuration failed!"
            exit $LASTEXITCODE
          }

          Write-Host "✓ CMake configuration successful"

      - name: Save vcpkg binary cache (early)
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            .vcpkg/bincache
            .vcpkg/downloads
          key: vcpkg-${{ runner.os }}-clang-cl-${{ hashFiles('cpp/vcpkg.json', 'vcpkg-lock.json', '**/vcpkg-configuration.json') }}-${{ github.run_id }}

      - name: Build falcon-core-cpp
        working-directory: cpp
        shell: pwsh
        run: |
          Write-Host "=== Building with Ninja ==="
          ninja -C build -v

          if ($LASTEXITCODE -ne 0) {
            Write-Error "Build failed!"
            exit $LASTEXITCODE
          }

          Write-Host "✓ Build successful"

      - name: Run CPP tests
        working-directory: cpp
        shell: pwsh
        run: |
          Write-Host "=== Test Execution Setup ==="

          $vcpkgBinPaths = @(
            "build/vcpkg_installed/x64-windows/bin",
            "build/vcpkg_installed/x64-windows/debug/bin"
          )

          $vcpkgBin = $null
          foreach ($path in $vcpkgBinPaths) {
            if (Test-Path $path) {
              $vcpkgBin = (Resolve-Path $path).Path
              Write-Host "Found vcpkg bin: $vcpkgBin"
              break
            }
          }

          if (-not $vcpkgBin) {
            Write-Error "Could not find vcpkg bin directory!"
            exit 1
          }

          $buildDir = (Resolve-Path "build").Path
          $env:PATH = "$vcpkgBin;$buildDir;$env:PATH"

          $testExe = Get-ChildItem -Path "build" -Filter "falcon_core_cpp_run_tests.exe" -Recurse | Select-Object -First 1

          if (-not $testExe) {
            Write-Error "Test executable not found!"
            exit 1
          }

          Write-Host "`n=== Running Tests ==="
          & ".\$($testExe.FullName.Replace("$PWD\", ''))" --gtest_color=yes --gtest_output=xml:test-results.xml
          $exitCode = $LASTEXITCODE

          if ($exitCode -ne 0) {
            Write-Error "Tests failed with exit code: $exitCode"
            exit $exitCode
          }

          Write-Host "`n✓ All tests passed successfully"

      - name: Run C++ integration tests (same platform)
        shell: pwsh
        run: |
          cd cpp/build
          .\integration_serialize_connection.exe --output cpp_windows_local.json --name "WindowsLocalTest" --type PlungerGate
          .\integration_deserialize_connection.exe --input cpp_windows_local.json --name "WindowsLocalTest" --type PlungerGate --verbose

      - name: Serialize for cross-platform test
        shell: pwsh
        run: |
          cd cpp/build
          .\integration_serialize_connection.exe --output cpp_windows_cross.json --name "WindowsToLinuxTest" --type ReservoirGate
          Get-Content cpp_windows_cross.json

      - name: Upload cross-platform test artifact
        uses: actions/upload-artifact@v4
        with:
          name: cpp-windows-serialized
          path: cpp/build/cpp_windows_cross.json
          retention-days: 1

      - name: Prepare C++ build artifacts for C-API CI
        working-directory: cpp/build
        shell: pwsh
        run: |
          Write-Host "=== Preparing C++ build artifacts for C-API ==="

          $artifactDir = "cpp-build-for-capi"
          New-Item -ItemType Directory -Force -Path $artifactDir

          # Copy DLL and LIB
          Copy-Item "falcon_core_cpp.dll" $artifactDir
          Copy-Item "falcon_core_cpp.lib" $artifactDir

          # Copy CMake files
          Copy-Item "CMakeCache.txt" $artifactDir -ErrorAction SilentlyContinue

          Write-Host "`n=== Artifacts for C-API ==="
          Get-ChildItem $artifactDir | Select-Object Name, Length

      - name: Verify C++ library integrity before upload
        working-directory: cpp
        shell: pwsh
        run: |
          Write-Host "=== Verifying DLL integrity ==="

          $dllPath = "build\falcon_core_cpp.dll"
          if (-not (Test-Path $dllPath)) {
            Write-Error "ERROR: falcon_core_cpp.dll not found!"
            exit 1
          }

          $dllFile = Get-Item $dllPath
          Write-Host "DLL size: $($dllFile.Length) bytes"

          # Check minimum size
          if ($dllFile.Length -lt 100000) {
            Write-Error "ERROR: DLL is too small - likely corrupt!"
            exit 1
          }

          # Verify PE signature
          $bytes = [System.IO.File]::ReadAllBytes($dllPath)
          $mzSignature = [System.BitConverter]::ToUInt16($bytes, 0)
          if ($mzSignature -ne 0x5A4D) {
            Write-Error "ERROR: Not a valid PE file!"
            exit 1
          }

          Write-Host "✓ DLL verification passed"

      - name: Generate DLL checksum
        working-directory: cpp/build
        shell: pwsh
        run: |
          Write-Host "=== Generating checksum ==="
          $hash = Get-FileHash "falcon_core_cpp.dll" -Algorithm SHA256
          $hash.Hash | Out-File -FilePath "falcon_core_cpp.dll.sha256" -Encoding ASCII -NoNewline
          Write-Host "DLL SHA256: $($hash.Hash)"
          Write-Host "DLL Size: $((Get-Item 'falcon_core_cpp.dll').Length) bytes"

      - name: Prepare DLL for upload
        working-directory: cpp/build
        shell: pwsh
        run: |
          Write-Host "=== Preparing DLL for upload ==="

          # Wait for file system
          Start-Sleep -Seconds 3

          # Create clean directory
          New-Item -ItemType Directory -Force -Path "../dll-upload"

          # Copy DLL
          Copy-Item "falcon_core_cpp.dll" "../dll-upload/" -Force

          # Verify
          $original = Get-Item "falcon_core_cpp.dll"
          $copy = Get-Item "../dll-upload/falcon_core_cpp.dll"

          Write-Host "Original size: $($original.Length) bytes"
          Write-Host "Copy size: $($copy.Length) bytes"

          if ($original.Length -ne $copy.Length) {
            Write-Error "Copy size mismatch!"
            exit 1
          }

          # Generate checksum of the COPY
          $hash = Get-FileHash "../dll-upload/falcon_core_cpp.dll" -Algorithm SHA256
          $hash.Hash | Out-File -FilePath "../dll-upload/falcon_core_cpp.dll.sha256" -Encoding ASCII -NoNewline
          Write-Host "SHA256: $($hash.Hash)"

      - name: Upload C++ DLL separately
        uses: actions/upload-artifact@v4
        with:
          name: cpp-windows-dll
          path: cpp/dll-upload/*
          retention-days: 1
          compression-level: 0
          if-no-files-found: error

      - name: Upload C++ lib and cache
        uses: actions/upload-artifact@v4
        with:
          name: cpp-windows-support
          path: |
            cpp/build/falcon_core_cpp.lib
            cpp/build/CMakeCache.txt
          retention-days: 1
          compression-level: 0

      - name: Prepare integration test executable with dependencies for cross-platform tests
        working-directory: cpp/build
        shell: pwsh
        run: |
          Write-Host "=== Preparing integration test executable ==="

          $artifactDir = "integration-test-package"
          New-Item -ItemType Directory -Force -Path $artifactDir

          # Copy executable
          Copy-Item "integration_deserialize_connection.exe" $artifactDir

          # Copy main DLL
          Copy-Item "falcon_core_cpp.dll" $artifactDir

          # Copy vcpkg DLLs
          $vcpkgBin = "vcpkg_installed/x64-windows/bin"
          if (Test-Path $vcpkgBin) {
            Get-ChildItem $vcpkgBin -Filter "*.dll" | ForEach-Object {
              Copy-Item $_.FullName $artifactDir
              Write-Host "  Copied: $($_.Name)"
            }
          }

          Write-Host "`n=== Integration Test Package Contents ==="
          Get-ChildItem $artifactDir | Select-Object Name, Length

      - name: Upload integration test executable for cross-platform tests
        uses: actions/upload-artifact@v4
        with:
          name: cpp-windows-integration-deserializer
          path: cpp/build/integration-test-package/**
          retention-days: 1
          compression-level: 0

      - name: Setup tmate session on failure
        if: failure()
        uses: mxschmitt/action-tmate@v3
        timeout-minutes: 30
