name: C++ Windows Release Build

on:
  workflow_call:
  workflow_dispatch:

jobs:
  build-release:
    name: Build C++ Release (Windows)
    runs-on: windows-latest

    env:
      VCPKG_BINARY_SOURCES: "clear;files,${{ github.workspace }}/.vcpkg-binary-cache,readwrite"
      VCPKG_DOWNLOADS: "${{ github.workspace }}/.vcpkg/downloads"

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Create vcpkg binary cache directory
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path ".vcpkg-binary-cache"

      - name: Cache vcpkg binary packages (SHARED ACROSS ALL WINDOWS WORKFLOWS)
        uses: actions/cache@v4
        with:
          path: .vcpkg-binary-cache
          # This key is SHARED by all Windows workflows
          key: vcpkg-binaries-windows-${{ hashFiles('**/vcpkg.json', '**/vcpkg-configuration.json') }}
          restore-keys: |
            vcpkg-binaries-windows-

      - name: Setup vcpkg
        uses: lukka/run-vcpkg@v11
        with:
          vcpkgGitCommitId: "73af4de996897cb45dcf5034d16a551a3cf476f7"

      - name: Install LLVM/Clang
        shell: pwsh
        run: |
          Write-Host "=== Installing LLVM/Clang ==="
          choco install llvm -y
          $env:Path = [System.Environment]::GetEnvironmentVariable("Path","Machine") + ";" + [System.Environment]::GetEnvironmentVariable("Path","User")
          Write-Host "✓ LLVM/Clang installed"

      - name: Install Ninja
        shell: pwsh
        run: |
          Write-Host "=== Installing Ninja ==="
          choco install ninja -y
          Write-Host "✓ Ninja installed"

      - name: Configure CMake for OPTIMIZED RELEASE
        working-directory: cpp
        shell: pwsh
        run: |
          $env:Path = [System.Environment]::GetEnvironmentVariable("Path","Machine") + ";" + [System.Environment]::GetEnvironmentVariable("Path","User")

          Write-Host "=== Cleaning build directory ==="
          if (Test-Path build) {
            Remove-Item -Recurse -Force build
          }

          Write-Host "`n=== CMake Configuration (RELEASE) ==="
          cmake -B build `
            -S . `
            -G "Ninja" `
            -DCMAKE_C_COMPILER=clang-cl `
            -DCMAKE_CXX_COMPILER=clang-cl `
            -DCMAKE_TOOLCHAIN_FILE="${env:VCPKG_ROOT}/scripts/buildsystems/vcpkg.cmake" `
            -DVCPKG_MANIFEST_DIR="${env:GITHUB_WORKSPACE}/cpp" `
            -DVCPKG_INSTALLED_DIR="${env:GITHUB_WORKSPACE}/cpp/build/vcpkg_installed" `
            -DCMAKE_BUILD_TYPE=Release `
            -DFALCON_CORE_DEV=OFF `
            -DUSE_VCPKG=ON

          if ($LASTEXITCODE -ne 0) {
            Write-Error "CMake configuration failed!"
            exit $LASTEXITCODE
          }

          Write-Host "✓ CMake configuration successful"

      - name: Build C++ library (OPTIMIZED RELEASE)
        working-directory: cpp
        shell: pwsh
        run: |
          Write-Host "=== Building RELEASE with Ninja ==="
          $env:Path = [System.Environment]::GetEnvironmentVariable("Path","Machine") + ";" + [System.Environment]::GetEnvironmentVariable("Path","User")

          ninja -C build falcon_core_cpp

          if ($LASTEXITCODE -ne 0) {
            Write-Error "Build failed!"
            exit $LASTEXITCODE
          }

          Write-Host "✓ Build successful"

      - name: Verify and locate build artifacts
        working-directory: cpp
        shell: pwsh
        run: |
          Write-Host "=== Searching for build artifacts ==="

          # Find the DLL
          $dllFile = Get-ChildItem -Path "build" -Filter "falcon_core_cpp.dll" -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1

          if (-not $dllFile) {
            Write-Error "ERROR: falcon_core_cpp.dll not found!"
            Get-ChildItem "build" -Recurse -Filter "*.dll" | Select-Object FullName
            exit 1
          }

          Write-Host "Found DLL at: $($dllFile.FullName)"
          Write-Host "DLL size: $($dllFile.Length) bytes"

          # Find the LIB (import library)
          $libFile = Get-ChildItem -Path "build" -Filter "falcon_core_cpp.lib" -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1

          if ($libFile) {
            Write-Host "Found LIB at: $($libFile.FullName)"
            Write-Host "LIB size: $($libFile.Length) bytes"
          } else {
            Write-Host "Note: No .lib import library found (might be header-only or different naming)"
          }

          # Store the actual build directory for later steps
          $buildDir = $dllFile.Directory.FullName
          Write-Host "Actual build directory: $buildDir"

          # Save to environment for next steps
          "BUILD_OUTPUT_DIR=$buildDir" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

          Write-Host "`n=== All DLL files in build directory ==="
          Get-ChildItem "build" -Recurse -Filter "*.dll" | Select-Object FullName, Length

          Write-Host "`n=== All LIB files in build directory ==="
          Get-ChildItem "build" -Recurse -Filter "*.lib" | Select-Object FullName, Length

          Write-Host "`n✓ Build artifacts verified"

      - name: Copy vcpkg.json for distribution
        working-directory: cpp
        shell: pwsh
        run: |
          Copy-Item "vcpkg.json" "build/"

      - name: Collect vcpkg licenses
        working-directory: cpp
        shell: pwsh
        run: |
          Write-Host "=== Collecting vcpkg licenses ==="

          $vcpkgInstalled = "build/vcpkg_installed/x64-windows"
          $licensesDir = "build/collected_licenses"
          New-Item -ItemType Directory -Force -Path $licensesDir | Out-Null

          # vcpkg stores licenses in share/<package>/copyright
          if (Test-Path "$vcpkgInstalled/share") {
            Get-ChildItem "$vcpkgInstalled/share" -Directory | ForEach-Object {
              $pkgName = $_.Name
              
              # Skip gtest/gmock packages
              if ($pkgName -like "*gtest*" -or $pkgName -like "*gmock*") {
                Write-Host "Skipping $pkgName (test dependency)"
                return
              }

              # Look for copyright/license files
              $copyrightFile = Join-Path $_.FullName "copyright"
              if (Test-Path $copyrightFile) {
                Write-Host "Found license for: $pkgName"
                $pkgLicenseDir = Join-Path $licensesDir $pkgName
                New-Item -ItemType Directory -Force -Path $pkgLicenseDir | Out-Null
                Copy-Item $copyrightFile (Join-Path $pkgLicenseDir "LICENSE")
              }
              
              # Some packages have additional license files
              Get-ChildItem $_.FullName -Filter "LICENSE*" -ErrorAction SilentlyContinue | ForEach-Object {
                Copy-Item $_.FullName (Join-Path $pkgLicenseDir $_.Name)
              }
              Get-ChildItem $_.FullName -Filter "COPYING*" -ErrorAction SilentlyContinue | ForEach-Object {
                Copy-Item $_.FullName (Join-Path $pkgLicenseDir $_.Name)
              }
            }
          }

          # Create a LICENSE_INDEX.txt documenting all licenses
          $indexContent = @"
          THIRD-PARTY SOFTWARE LICENSES
          ==============================

          This distribution includes third-party software packages managed by vcpkg.
          Each package's license is included in its respective subdirectory.

          Packages included:
          "@

          Get-ChildItem $licensesDir -Directory | ForEach-Object {
            $indexContent += "`n  - $($_.Name)/ - License for $($_.Name)"
          }

          Set-Content -Path (Join-Path $licensesDir "LICENSE_INDEX.txt") -Value $indexContent -Encoding UTF8

          Write-Host "`n=== Collected Licenses ==="
          Get-ChildItem $licensesDir -Recurse -File | Select-Object FullName

      - name: Package release artifact with vcpkg dependencies
        working-directory: cpp
        shell: pwsh
        run: |
          Write-Host "=== Creating Release Package ==="

          $pkgDir = "release-package"
          New-Item -ItemType Directory -Force -Path "$pkgDir/bin"
          New-Item -ItemType Directory -Force -Path "$pkgDir/include"
          New-Item -ItemType Directory -Force -Path "$pkgDir/LICENSES"

          # Copy main library DLL from wherever it was built
          Write-Host "Copying main library from: $env:BUILD_OUTPUT_DIR"

          $dllFile = Get-ChildItem -Path $env:BUILD_OUTPUT_DIR -Filter "falcon_core_cpp.dll" -ErrorAction Stop
          Copy-Item $dllFile.FullName "$pkgDir/bin/"
          Write-Host "Copied: $($dllFile.Name)"

          # Copy import library if it exists
          $libFile = Get-ChildItem -Path $env:BUILD_OUTPUT_DIR -Filter "falcon_core_cpp.lib" -ErrorAction SilentlyContinue
          if ($libFile) {
            Copy-Item $libFile.FullName "$pkgDir/bin/"
            Write-Host "Copied: $($libFile.Name)"
          }

          # Copy headers
          Copy-Item -Recurse "include/falcon_core" "$pkgDir/include/"

          # Copy vcpkg.json
          Copy-Item "build/vcpkg.json" "$pkgDir/"

          # Copy vcpkg dependencies (excluding gtest) - merge bin and lib folders
          Write-Host "`n=== Collecting vcpkg dependencies ==="
          $vcpkgInstalled = "build/vcpkg_installed/x64-windows"

          # Copy DLLs from vcpkg bin/
          if (Test-Path "$vcpkgInstalled/bin") {
            Write-Host "Copying DLLs from vcpkg bin/"
            Get-ChildItem "$vcpkgInstalled/bin" -Filter *.dll | Where-Object { 
              $_.Name -notlike "*gtest*" -and $_.Name -notlike "*gmock*" 
            } | ForEach-Object {
              Copy-Item $_.FullName "$pkgDir/bin/"
              Write-Host "  - $($_.Name)"
            }
          }

          # Copy import libraries from vcpkg lib/
          if (Test-Path "$vcpkgInstalled/lib") {
            Write-Host "Copying import libraries from vcpkg lib/"
            Get-ChildItem "$vcpkgInstalled/lib" -Filter *.lib | Where-Object { 
              $_.Name -notlike "*gtest*" -and $_.Name -notlike "*gmock*" 
            } | ForEach-Object {
              Copy-Item $_.FullName "$pkgDir/bin/"
              Write-Host "  - $($_.Name)"
            }
          }

          # Copy include files
          if (Test-Path "$vcpkgInstalled/include") {
            Write-Host "Copying headers from vcpkg include/"
            # Copy all include directories except gtest/gmock
            Get-ChildItem "$vcpkgInstalled/include" -Directory | Where-Object { 
              $_.Name -ne "gtest" -and $_.Name -ne "gmock" 
            } | ForEach-Object {
              Copy-Item -Recurse $_.FullName "$pkgDir/include/"
            }
            # Copy any header files in the root include directory
            Get-ChildItem "$vcpkgInstalled/include" -File | ForEach-Object {
              Copy-Item $_.FullName "$pkgDir/include/"
            }
          }

          # Copy all collected licenses
          Copy-Item -Recurse "build/collected_licenses/*" "$pkgDir/LICENSES/"

          # Create README
          Set-Content -Path "$pkgDir/README.md" -Encoding UTF8 -Value @"
          # Falcon Core C++ Library - Windows x64

          ## Contents

          - ``bin/falcon_core_cpp.dll`` - Main C++ shared library
          - ``bin/falcon_core_cpp.lib`` - Import library (if applicable)
          - ``bin/*.dll`` - All required vcpkg dependency DLLs
          - ``bin/*.lib`` - All required vcpkg dependency import libraries
          - ``include/falcon_core/`` - Public C++ header files
          - ``include/`` - All required vcpkg dependency headers
          - ``LICENSES/`` - Third-party software licenses (see below)
          - ``vcpkg.json`` - Dependency manifest

          ## Third-Party Software Licenses

          This distribution includes third-party software packages. All licenses are located in the ``LICENSES/`` directory.

          **Important**: This software is distributed with dependencies that have their own licenses. Please review the ``LICENSES/LICENSE_INDEX.txt`` file for a complete list of included packages and their respective licenses.

          Each package has its own subdirectory under ``LICENSES/`` containing:
          - LICENSE file with the full license text
          - Any additional copyright or attribution files

          ## Installation

          ### Option 1: Use bundled dependencies (Recommended)

          All required DLLs are included in ``bin/``. Add the ``bin/`` directory to your PATH or copy the DLLs to your application directory.

          **To use:**
          1. Add ``bin/`` to your system PATH, or
          2. Copy all files from ``bin/`` to your application's directory

          ### Option 2: Build dependencies yourself

          If you prefer to build dependencies yourself, use vcpkg:

              vcpkg install --triplet=x64-windows

          This will read the included vcpkg.json and install:
          - boost-filesystem, boost-system, boost-uuid
          - hdf5 (with cpp features)
          - yaml-cpp
          - cereal
          - xtensor, xtensor-io, xsimd, xtl
          - exprtk, highfive

          ## Build Information
          - Platform: Windows x86_64
          - Compiler: Clang-CL (LLVM)
          - C++ Standard: C++14
          - Build Type: Release (Optimized)

          ## Usage

          ### Linking (if you have .lib files)

              clang-cl /MD /EHsc myapp.cpp /I"path\to\release-package\include" /link /LIBPATH:"path\to\release-package\bin" falcon_core_cpp.lib

          ### Runtime

          Ensure the DLLs are in your PATH or application directory:

              set PATH=C:\path\to\release-package\bin;%PATH%
              myapp.exe

          ## License Compliance

          When distributing software that uses this library, you must comply with:
          1. The Falcon Core library license
          2. All third-party licenses in the ``LICENSES/`` directory

          Please ensure you understand and comply with all license requirements.
          "@

          Set-Content -Path "$pkgDir/VERSION.txt" -Encoding UTF8 -Value $("falcon-core-cpp-windows-x64 Built: " + (Get-Date -Format "yyyy-MM-dd HH:mm:ss UTC") + " Commit: $env:GITHUB_SHA")

          Write-Host "`n=== Package Contents ==="
          Get-ChildItem $pkgDir -Recurse -File | Select-Object FullName, Length | Format-Table -AutoSize

          Write-Host "`n=== Creating ZIP archive ==="
          Compress-Archive -Path "$pkgDir/*" -DestinationPath "falcon-core-cpp-windows-x64.zip" -CompressionLevel Optimal

          Write-Host "`n=== ZIP Info ==="
          Get-Item "falcon-core-cpp-windows-x64.zip" | Select-Object Name, Length

      - name: Generate checksum
        working-directory: cpp
        shell: pwsh
        run: |
          $hash = Get-FileHash "falcon-core-cpp-windows-x64.zip" -Algorithm SHA256
          "$($hash.Hash.ToLower())  falcon-core-cpp-windows-x64.zip" | Out-File -FilePath "falcon-core-cpp-windows-x64.zip.sha256" -Encoding ASCII
          Get-Content "falcon-core-cpp-windows-x64.zip.sha256"

      - name: Upload build artifact for C-API release
        uses: actions/upload-artifact@v4
        with:
          name: cpp-windows-release-build
          path: |
            cpp/build/**/*.dll
            cpp/build/**/*.lib
            cpp/build/vcpkg_installed/
          retention-days: 1

      - name: Upload release package
        uses: actions/upload-artifact@v4
        with:
          name: falcon-core-cpp-windows-x64
          path: |
            cpp/falcon-core-cpp-windows-x64.zip
            cpp/falcon-core-cpp-windows-x64.zip.sha256
          retention-days: 90
          compression-level: 0

      - name: Setup tmate session on failure
        if: failure()
        uses: mxschmitt/action-tmate@v3
        timeout-minutes: 30
