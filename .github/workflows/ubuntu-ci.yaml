name: Ubuntu 22.04 CI

on:
  push:
    branches: [main, new-dev]
  pull_request:
    branches: [main, new-dev]

jobs:
  build-and-test-ubuntu:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            clang \
            llvm \
            lld \
            ninja-build \
            cmake \
            ccache \
            python3 python3-pip \
            # core C++ deps that mirror Arch pacman packages
            libcereal-dev \
            libhdf5-dev \
            libyaml-cpp-dev \
            libboost-all-dev \
            libbz2-dev \
            libexpat1-dev \
            libsqlite3-dev \
            libssl-dev \
            zlib1g-dev \
            nlohmann-json3-dev \
            libxtensor-dev \
            libxtl-dev \
            libxsimd-dev \
            libgtest-dev

      # Optional: make sure clang/llvm are the compilers we use
      - name: Set CC/CXX
        run: |
          echo "CC=clang"  >> $GITHUB_ENV
          echo "CXX=clang++" >> $GITHUB_ENV

      - name: Configure and build C++ extension (dev, tests, coverage)
        working-directory: cpp
        env:
          CC: ${{ env.CC }}
          CXX: ${{ env.CXX }}
        run: |
          echo "--- Configuring and Building C++ Extension (dev, tests, coverage) ---"
          # Match what you do in arch-ci: USE_VCPKG=0 and Makefile entrypoint
          CC=${CC} CXX=${CXX} USE_VCPKG=0 make build-dev

      - name: Run C++ tests
        working-directory: cpp
        env:
          CC: ${{ env.CC }}
          CXX: ${{ env.CXX }}
        run: |
          # If your Makefile has a dedicated test target, use that; otherwise run ctest
          if grep -q "test-dev:" Makefile; then
            CC=${CC} CXX=${CXX} USE_VCPKG=0 make test-dev
          else
            ctest --test-dir build --output-on-failure
          fi

      - name: Collect C++ coverage (optional, if your Makefile supports it)
        working-directory: cpp
        env:
          CC: ${{ env.CC }}
          CXX: ${{ env.CXX }}
        run: |
          if grep -q "coverage-dev:" Makefile; then
            CC=${CC} CXX=${CXX} USE_VCPKG=0 make coverage-dev
          else
            echo "No coverage-dev target; skipping coverage step."
          fi

      # Add similar c-api build/test/coverage steps here if you want parity with Arch/Fedora
      # - name: Build c-api ...
      # - name: Run c-api tests ...
      # - name: Collect c-api coverage ...

      - name: Upload coverage reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-reports-ubuntu
          path: |
            cpp/coverage/*
            c-api/coverage/*
