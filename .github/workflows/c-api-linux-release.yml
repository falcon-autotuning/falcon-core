name: C-API Linux Release Build

on:
  workflow_call:
  workflow_dispatch:

jobs:
  build-release:
    name: Build C-API Release (Linux)
    runs-on: ubuntu-latest

    env:
      VCPKG_BINARY_SOURCES: "clear;files,${{ github.workspace }}/.vcpkg/bincache,readwrite"
      VCPKG_DOWNLOADS: "${{ github.workspace }}/.vcpkg/downloads"

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Create vcpkg cache directories
        run: |
          mkdir -p "${{ github.workspace }}/.vcpkg/bincache"
          mkdir -p "${{ github.workspace }}/.vcpkg/downloads"
          echo "Created cache directories:"
          ls -la "${{ github.workspace }}/.vcpkg/"

      - name: Attempt to restore vcpkg binary cache
        uses: actions/cache@v4
        with:
          path: |
            .vcpkg/bincache
            .vcpkg/downloads
          key: vcpkg-${{ runner.os }}-linux-release-capi-${{ hashFiles('c-api/vcpkg.json', 'cpp/vcpkg.json', 'vcpkg-lock.json', '**/vcpkg-configuration.json') }}
          restore-keys: |
            vcpkg-${{ runner.os }}-linux-release-capi-
            vcpkg-${{ runner.os }}-linux-

      - name: Install build dependencies (MUST be before vcpkg setup)
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            make \
            ninja-build \
            clang \
            llvm \
            lld \
            pkg-config \
            cmake \
            curl \
            zip \
            unzip \
            tar \
            git \
            autoconf \
            automake \
            libtool \
            rsync \
            tree

      - name: Setup vcpkg
        uses: lukka/run-vcpkg@v11
        with:
          vcpkgGitCommitId: "73af4de996897cb45dcf5034d16a551a3cf476f7"

      - name: Verify vcpkg is ready
        run: |
          echo "=== Verifying vcpkg installation ==="
          echo "VCPKG_ROOT: ${VCPKG_ROOT}"
          ls -la "${VCPKG_ROOT}"
          ${VCPKG_ROOT}/vcpkg version

      - name: Download C++ release build
        uses: actions/download-artifact@v4
        with:
          name: cpp-linux-release-build
          path: cpp/build

      - name: Verify C++ library
        run: |
          test -f cpp/build/libfalcon_core_cpp.so || (echo "ERROR: libfalcon_core_cpp.so not found!" && exit 1)
          echo "=== C++ Library Info ==="
          ls -lh cpp/build/libfalcon_core_cpp.so
          echo "✓ C++ library verified"

      - name: Build C-API library (OPTIMIZED RELEASE using Makefile)
        working-directory: c-api
        run: |
          echo "=== Building RELEASE with Makefile ==="
          CC=/usr/bin/clang CXX=/usr/bin/clang++ USE_VCPKG=1 VCPKG_TRIPLET=x64-linux-dynamic CORE_ROOT=../cpp make build-release

          if [ $? -ne 0 ]; then
            echo "ERROR: Build failed!"
            exit 1
          fi

          echo "✓ Build successful"

      - name: Verify release build
        working-directory: c-api
        run: |
          test -f build/libfalcon_core_c_api.so || (echo "ERROR: libfalcon_core_c_api.so not found!" && exit 1)

          echo "=== Library Info ==="
          ls -lh build/libfalcon_core_c_api.so
          file build/libfalcon_core_c_api.so
          echo "✓ C-API release build verified"

      - name: Copy vcpkg.json for distribution
        working-directory: c-api
        run: |
          cp vcpkg.json build/

      - name: Collect vcpkg licenses
        working-directory: c-api
        run: |
          echo "=== Collecting vcpkg licenses ==="

          VCPKG_INSTALLED="build/vcpkg_installed/x64-linux-dynamic"
          LICENSES_DIR="build/collected_licenses"
          mkdir -p "$LICENSES_DIR"

          # vcpkg stores licenses in share/<package>/copyright
          if [ -d "$VCPKG_INSTALLED/share" ]; then
            for pkg_dir in "$VCPKG_INSTALLED/share"/*; do
              if [ -d "$pkg_dir" ]; then
                pkg_name=$(basename "$pkg_dir")
                
                # Skip gtest/gmock packages
                if [[ "$pkg_name" == *"gtest"* ]] || [[ "$pkg_name" == *"gmock"* ]]; then
                  echo "Skipping $pkg_name (test dependency)"
                  continue
                fi

                # Look for copyright/license files
                if [ -f "$pkg_dir/copyright" ]; then
                  echo "Found license for: $pkg_name"
                  mkdir -p "$LICENSES_DIR/$pkg_name"
                  cp "$pkg_dir/copyright" "$LICENSES_DIR/$pkg_name/LICENSE"
                fi
                
                # Some packages have additional license files
                for license_file in "$pkg_dir"/LICENSE* "$pkg_dir"/COPYING*; do
                  if [ -f "$license_file" ]; then
                    cp "$license_file" "$LICENSES_DIR/$pkg_name/"
                  fi
                done
              fi
            done
          fi

          # Create a LICENSE_INDEX.txt documenting all licenses
          cat > "$LICENSES_DIR/LICENSE_INDEX.txt" << 'EOF'
          THIRD-PARTY SOFTWARE LICENSES
          ==============================

          This distribution includes third-party software packages managed by vcpkg.
          Each package's license is included in its respective subdirectory.

          Packages included:
          EOF

          # List all collected licenses
          for pkg_dir in "$LICENSES_DIR"/*; do
            if [ -d "$pkg_dir" ]; then
              pkg_name=$(basename "$pkg_dir")
              echo "  - $pkg_name/ - License for $pkg_name" >> "$LICENSES_DIR/LICENSE_INDEX.txt"
            fi
          done

          echo ""
          echo "=== Collected Licenses ==="
          find "$LICENSES_DIR" -type f | sort

      - name: Package release artifact with vcpkg dependencies
        working-directory: c-api
        run: |
          echo "=== Creating Release Package ==="

          mkdir -p release-package/lib
          mkdir -p release-package/include
          mkdir -p release-package/LICENSES

          # Copy C-API library
          cp build/libfalcon_core_c_api.so release-package/lib/

          # Copy C++ library (dependency)
          cp ../cpp/build/libfalcon_core_cpp.so release-package/lib/

          # Copy headers
          cp -r include/falcon_core release-package/include/

          # Copy vcpkg.json
          cp build/vcpkg.json release-package/

          # Copy vcpkg installed dependencies (excluding gtest) - all to lib/
          echo "=== Collecting vcpkg dependencies ==="
          VCPKG_INSTALLED="build/vcpkg_installed/x64-linux-dynamic"

          # Copy all shared libraries (.so files)
          if [ -d "$VCPKG_INSTALLED/lib" ]; then
            echo "Copying libraries from $VCPKG_INSTALLED/lib"
            find "$VCPKG_INSTALLED/lib" -name "*.so*" ! -name "*gtest*" ! -name "*gmock*" -exec cp -P {} release-package/lib/ \;
            find "$VCPKG_INSTALLED/lib" -name "*.a" ! -name "*gtest*" ! -name "*gmock*" -exec cp -P {} release-package/lib/ \;
          fi

          # Also check in bin/ (some packages put shared libs there)
          if [ -d "$VCPKG_INSTALLED/bin" ]; then
            echo "Copying binaries from $VCPKG_INSTALLED/bin"
            find "$VCPKG_INSTALLED/bin" -name "*.so*" ! -name "*gtest*" ! -name "*gmock*" -exec cp -P {} release-package/lib/ \;
          fi

          # Copy all include files (excluding gtest)
          if [ -d "$VCPKG_INSTALLED/include" ]; then
            echo "Copying headers from $VCPKG_INSTALLED/include"
            rsync -av --exclude='gtest' --exclude='gmock' "$VCPKG_INSTALLED/include/" release-package/include/
          fi

          # Copy all collected licenses
          cp -r build/collected_licenses/* release-package/LICENSES/

          # Create README
          cat > release-package/README.md << 'EOF'
          # Falcon Core C-API Library - Linux x64

          ## Contents

          - `lib/libfalcon_core_c_api.so` - C-API shared library
          - `lib/libfalcon_core_cpp.so` - C++ core library (dependency)
          - `lib/*.so*` - All required vcpkg dependency shared libraries
          - `lib/*.a` - All required vcpkg dependency static libraries
          - `include/falcon_core/` - Public C-API header files
          - `include/` - All required vcpkg dependency headers
          - `LICENSES/` - Third-party software licenses (see below)
          - `vcpkg.json` - Dependency manifest

          ## Third-Party Software Licenses

          This distribution includes third-party software packages. All licenses are located in the `LICENSES/` directory.

          **Important**: This software is distributed with dependencies that have their own licenses. Please review the `LICENSES/LICENSE_INDEX.txt` file for a complete list of included packages and their respective licenses.

          Each package has its own subdirectory under `LICENSES/` containing:
          - LICENSE file with the full license text
          - Any additional copyright or attribution files

          ## Installation

          ### Option 1: Use bundled dependencies (Recommended)

          All required libraries are included in `lib/`. Set your library path:

          ```bash
          export LD_LIBRARY_PATH=/path/to/release-package/lib:$LD_LIBRARY_PATH
          ```

          ### Option 2: Build dependencies yourself

          If you prefer to build dependencies yourself, use vcpkg with the x64-linux-dynamic triplet:

          ```bash
          vcpkg install --triplet=x64-linux-dynamic
          ```

          This will read the included vcpkg.json and install all dependencies.

          **Note**: The `x64-linux-dynamic` triplet ensures dynamic linking, which is what this release uses.

          ## Build Information
          - Platform: Linux x86_64
          - Compiler: Clang/LLVM
          - C Standard: C99
          - C++ Standard: C++14
          - Build Type: Release (Optimized)
          - vcpkg Triplet: x64-linux-dynamic

          ## Usage

          Link against the library:

          ```bash
          clang -o myapp myapp.c \
            -I/path/to/release-package/include \
            -L/path/to/release-package/lib \
            -lfalcon_core_c_api -lfalcon_core_cpp \
            -Wl,-rpath,/path/to/release-package/lib
          ```

          The `-Wl,-rpath` option ensures the runtime linker can find the shared libraries.

          ## License Compliance

          When distributing software that uses this library, you must comply with:
          1. The Falcon Core library license
          2. All third-party licenses in the `LICENSES/` directory

          Please ensure you understand and comply with all license requirements.
          EOF

          echo "$(date -u '+%Y-%m-%d %H:%M:%S UTC') - Commit: $GITHUB_SHA" > release-package/VERSION.txt

          echo ""
          echo "=== Package Structure ==="
          tree release-package || find release-package -type f -ls

          echo ""
          echo "=== Library Dependencies Check ==="
          echo "C-API library dependencies:"
          ldd release-package/lib/libfalcon_core_c_api.so || true
          echo ""
          echo "C++ library dependencies:"
          ldd release-package/lib/libfalcon_core_cpp.so || true

          echo ""
          echo "=== Creating tarball ==="
          tar -czf falcon-core-c-api-linux-x64.tar.gz -C release-package .

          echo ""
          echo "=== Tarball Info ==="
          ls -lh falcon-core-c-api-linux-x64.tar.gz

      - name: Generate checksum
        working-directory: c-api
        run: |
          sha256sum falcon-core-c-api-linux-x64.tar.gz > falcon-core-c-api-linux-x64.tar.gz.sha256
          cat falcon-core-c-api-linux-x64.tar.gz.sha256

      - name: Upload release package
        uses: actions/upload-artifact@v4
        with:
          name: falcon-core-c-api-linux-x64
          path: |
            c-api/falcon-core-c-api-linux-x64.tar.gz
            c-api/falcon-core-c-api-linux-x64.tar.gz.sha256
          retention-days: 90
          compression-level: 0

      - name: Setup tmate session on failure
        if: failure()
        uses: mxschmitt/action-tmate@v3
        timeout-minutes: 30
