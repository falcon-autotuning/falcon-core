[build-system]
requires = ["uv_build>=0.8.22,<0.9.0"]
build-backend = "uv_build"

[project]
name = "falcon_core"
description = "Core utilities for all falcon applications used for autotuning of quantum devices"
readme = "README.md"
requires-python = ">=3.13"
license = "MIT"
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering",
]
package-dir = { "" = "/src/falcon_core" }
version = "0.1.0"

[project.optional-dependencies]
test = ["pytest==8.2.1", "pytest-xdist==3.6.1"]

[tool.ruff]
line-length = 88

# Pyrefly header
[tool.pyrefly]

#### configuring what to type check and where to import from
project_includes = ["**/*.py"]
project_excludes = ["**/.[!/.]*", "**/tests"]
search_path = ["."]

#### configuring your python environment
python_platform = "linux"
python_version = "3.13"

ignore_errors_in_generated_code = true
use_untyped_imports = true
ignore_missing_source = true

[tool.pyrefly.errors]
bad-assignment = false
invalid-argument = false

[tool.basedpyright]
include = ["src"]
exclude = ["**/__pycache__"]
pythonVersion = "3.13"
typeCheckingMode = "standard"
