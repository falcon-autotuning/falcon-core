- comment_raw: "/**\n   * @brief List can be constructed in 5 different ways:\n  \
    \ *\n   * - Default constructor: creates an empty List container.\n   *   @code\n\
    \   *   List o;\n   *   @endcode\n   *\n   * - Sized constructor: creates an List\
    \ container with a given\n   * number of default-initialized elements.\n   * \
    \  @param count Number of elements.\n   *   @code\n   *   List o(10);\n   *  \
    \ @endcode\n   *\n   * - Fill constructor: creates an List container with a given\n\
    \   * number of copies of a specified value.\n   *   @param count Number of elements.\n\
    \   *   @param value Value to copy.\n   *   @code\n   *   List o(10, someValue);\n\
    \   *   @endcode\n   *\n   * - Vector constructor: creates an List container from\
    \ an existing\n   * vector of values.\n   *   @param vec Vector of values to copy.\n\
    \   *   @code\n   *   std::vector<ListP> v = ...;\n   *   List o(v);\n   *   @endcode\n\
    \   * - Initializer list constructor: creates a List container\n   *from an initializer\
    \ list of shared pointers.\n   *   @param init Initializer list of shared_ptr<T>\
    \ to copy.\n   *   @code\n   *   List o{ptr1, ptr2, ptr3};\n   *   @endcode\n\
    \   */"
