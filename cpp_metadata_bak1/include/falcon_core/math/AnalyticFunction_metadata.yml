- comment_raw: "/**\n * @file AnalyticFunction.hpp\n * @brief A class for a gunction\
    \ that can be used to describe analytic time\n * domain shaped.\n *\n * This supports\
    \ functions of the form x[0]*t^2 + x[1] where the values that can\n * be set are\
    \ elements of the x vector, and it can be evaluated as a function of\n * time\
    \ at a later date. For time evaluation, it is assumed that this function\n * should\
    \ be evaluated at t=0.\n *\n * Not that this vector should always start from 0,\
    \ and you should not skip any\n * indexes.\n *\n * There are builtin labels, such\
    \ that the arbitrary vector indexes can be\n * turned into human readable labels.\n\
    \ */"
  comment: '@file AnalyticFunction.hpp

    @brief A class for a gunction that can be used to describe analytic time

    domain shaped.

    This supports functions of the form x[0]*t^2 + x[1] where the values that can

    be set are elements of the x vector, and it can be evaluated as a function of

    time at a later date. For time evaluation, it is assumed that this function

    should be evaluated at t=0.

    Not that this vector should always start from 0, and you should not skip any

    indexes.

    There are builtin labels, such that the arbitrary vector indexes can be

    turned into human readable labels.'
  declaration: using VariableName = std::string;
  kind: alias
  name: null
