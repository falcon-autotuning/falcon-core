- comment_raw: "/**\n * @brief Abstract base for all serializable Song objects.\n\
    \ *\n * Inherit from Song in your serializable class, implement serialize(), and\n\
    \ * register with cereal.\n *\n * @note\n * std::hash<falcon_core::generic::Song>\
    \ is specialized (see Song.cpp)\n * so Song can be used as a key in std::unordered_map.\n\
    \ *\n * @section usage Usage\n * @code\n * struct Animal : public Song {\n * \
    \    int legs = 4;\n *     template<class Archive>\n *     void serialize(Archive&\
    \ ar) { ar(CEREAL_NVP(legs)); }\n *     virtual ~Animal() = default;\n * };\n\
    \ * struct Dog : public Animal {\n *     bool tail = true;\n *     template<class\
    \ Archive>\n *     void serialize(Archive& ar) {\n *         ar(cereal::base_class<Animal>(this),\
    \ CEREAL_NVP(tail));\n *     }\n * };\n * CEREAL_REGISTER_TYPE(Animal)\n * CEREAL_REGISTER_TYPE(Dog)\n\
    \ * CEREAL_REGISTER_POLYMORPHIC_RELATION(Animal, Dog)\n * @endcode\n */"
  comment: "@brief Abstract base for all serializable Song objects.\nInherit from\
    \ Song in your serializable class, implement serialize(), and\nregister with cereal.\n\
    @note\nstd::hash<falcon_core::generic::Song> is specialized (see Song.cpp)\nso\
    \ Song can be used as a key in std::unordered_map.\n@section usage Usage\n@code\n\
    struct Animal : public Song {\n   int legs = 4;\n   template<class Archive>\n\
    \   void serialize(Archive& ar) { ar(CEREAL_NVP(legs)); }\n   virtual ~Animal()\
    \ = default;\n};\nstruct Dog : public Animal {\n   bool tail = true;\n   template<class\
    \ Archive>\n   void serialize(Archive& ar) {\n       ar(cereal::base_class<Animal>(this),\
    \ CEREAL_NVP(tail));\n   }\n};\nCEREAL_REGISTER_TYPE(Animal)\nCEREAL_REGISTER_TYPE(Dog)\n\
    CEREAL_REGISTER_POLYMORPHIC_RELATION(Animal, Dog)\n@endcode"
