site_name: Falcon Core Documentation
site_description: Core utilities for autotuning quantum devices
site_author: Falcon Autotuning Team
repo_url: https://github.com/falcon-autotuning/falcon-core
repo_name: falcon-autotuning/falcon-core

theme:
  name: material
  palette:
    # Light mode
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    # Dark mode
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.code.annotate

nav:
  - Home: index.md
  - Getting Started:
      - Installation: installation.md
      - Developer Guide: developer-guide.md
  - Architecture:
      - C++ Core: cpp-core.md
      - C API: c-api.md
      - Documentation Generation: code-docs.md
      - API Docs Setup: api-docs-setup.md

# Note: API Reference documentation will be generated via Doxygen
# To integrate Doxygen-generated API docs:
# 1. Install doxygen and doxypypy plugins for MkDocs:
#    pip install mkdocs-material mkdoxy
# 2. Add to plugins section:
#    - mkdoxy:
#        projects:
#          cpp:
#            src-dirs: cpp/include
#          c-api:
#            src-dirs: c-api/include
# 3. Uncomment the API Reference section above

markdown_extensions:
  - admonition
  - codehilite:
      guess_lang: false
  - toc:
      permalink: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences
  - pymdownx.details
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - attr_list
  - md_in_html

plugins:
  - search

# Note: Install additional plugins with:
# pip install mkdocs-material

extra:
  social:
    - icon: material/github
      link: https://github.com/falcon-autotuning/falcon-core
  version:
    provider: mike

copyright: Copyright &copy; 2023-2024 Tyler Kovach, Daniel Schug, Zachery Merino
