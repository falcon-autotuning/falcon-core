site_name: Falcon Core Documentation
site_description: Core utilities for autotuning quantum devices
site_author: Falcon Autotuning Team
repo_url: https://github.com/falcon-autotuning/falcon-core
repo_name: falcon-autotuning/falcon-core

theme:
  name: material
  palette:
    - media: "(prefers-color-scheme)"
      primary: pink
      accent: pink
      toggle:
        icon: material/brightness-auto
        name: "Switch to light mode"
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: pink
      accent: pink
      toggle:
        icon: material/brightness-7
        name: "Switch to dark mode"
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: pink
      accent: pink
      toggle:
        icon: material/brightness-4
        name: "Switch to system preference"
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.top
    - navigation.instant
    - navigation.instant.prefetch
    - navigation.instant.preview
    - navigation.instant.progress
    - navigation.path
    - navigation.tracking
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.code.annotate
    - content.tabs.link
    - announce.dismiss
    - toc.follow
  logo: assets/icons/icon-256.png
  favicon: assets/icons/icon-256.png

nav:
  - Home: index.md
  - Getting Started:
      - Installation: installation.md
      - Developer Guide: developer-guide.md
  - Architecture:
      - C++ Core: cpp-core.md
      - C API: c-api.md
      - Documentation Generation: code-docs.md
  - API Reference:
      # point explicitly to mkdoxy-generated index files
      - C++ API: cpp-core/index.md
      - C API: c-api/index.md

markdown_extensions:
  - admonition
  - codehilite:
      guess_lang: false
  - toc:
      permalink: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences
  - pymdownx.details
  - pymdownx.tabbed:
      alternate_style: true
  - attr_list
  - md_in_html

plugins:
  - search
  - mkdoxy:
      projects:
        # rename project key from `cpp` -> `cpp-core` so mkdoxy generates docs/cpp-core/
        cpp-core:
          src-dirs: cpp/include
          full-doc: true
        c-api:
          src-dirs: c-api/include
          full-doc: true

extra:
  social:
    - icon: material/github
      link: https://github.com/falcon-autotuning/falcon-core
  version:
    provider: mike
